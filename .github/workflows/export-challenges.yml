name: Export Challenges 1448
# تصديرُ تحديات مسح ١٤٤٨ إلى درايف المالك — لا يُطبَع في السجل إلا أعداد (المستودعُ عامّ)
on:
  push:
    branches: [export-challenges]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm i firebase-admin@12 googleapis@144 jsdom@24 --no-save --no-audit --no-fund
      - run: pip3 install --break-system-packages --quiet openpyxl
      - name: read
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/export-challenges.mjs
      - name: usage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/export-usage.mjs
      - name: diag lost surveys
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: echo skip-diag
      - name: heal tombstoned surveys (V28.3)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HEAL_APPLY: '1'
        run: echo skip-heal-tombs
      - name: heal three + quarantine check (V28.4)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo skip-heal-list
      - name: diag new points (read-only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo skip-diag-new3
      - name: merge the three added points (V28.6, owner decision)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo skip-merge-new3
      - name: fix Khaled visits (V28.7, owner decision)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo skip-fix-khaled
      - name: old devices (read-only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo skip-old-devices
      - name: orphan documents (read-only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo skip-orphans
      - name: photos diag (read-only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
        run: echo skip-photos-diag
      - name: app files from main + jsdom
        run: |
          git fetch --depth 1 origin main
          git checkout origin/main -- index.html i18n scripts/lib
      - name: study numbers from the system (read-only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_OPTIONS: --require ./scripts/lib/jsdom-dict.cjs
        run: echo skip-study
      - name: newsites reality check (read-only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/newsites-check.mjs || true
      - run: python3 scripts/challenges-xlsx.py
      - name: upload
        env:
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
        run: node scripts/export-upload.mjs

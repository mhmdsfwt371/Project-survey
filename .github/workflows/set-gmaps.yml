# (V43.6) one-time: save the Google Maps browser key the owner gave as settings/gmaps (what the constants card writes)
name: Set Maps key
on:
  workflow_dispatch:
    inputs:
      key:
        description: مفتاح خرائط جوجل
        required: true
        type: string
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: أدواتُ الخادم
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط سيرًا.
        run: |
          for i in 1 2 3; do
            npm i firebase-admin@12 --no-save --no-audit --no-fund && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: حفظُ مفتاح الخرائط
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAPS_KEY: ${{ inputs.key }}
        run: node scripts/set-gmaps.mjs

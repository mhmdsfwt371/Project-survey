# (V40.1) one-time read-only diagnosis of the AFAQY PRO bridge (prints counts and IMEIs, never a token or password)
name: Integration diagnosis
on:
  workflow_dispatch: {}
  push:
    branches: [staging]
    paths: ['.github/workflows/integ-diag.yml', 'scripts/integ-diag.mjs']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: أدواتُ الخادم
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط سيرًا.
        run: |
          for i in 1 2 3; do
            npm i firebase-admin@12 --no-save --no-audit --no-fund && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: تشخيصُ الربط
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/integ-diag.mjs

# (V39.88) one-time: copy the Drive key and the service account from GitHub secrets into Google Secret Manager, so the
# provisioning job can run as a scheduled cloud function (every 5 minutes, exactly) instead of on GitHub's best-effort cron.
# No value is ever printed; the owner never handles the key. Runs once when this file lands on staging, or by hand.
name: Secrets to Google Secret Manager
on:
  workflow_dispatch: {}
  push:
    branches: [staging]
    paths: ['.github/workflows/secrets-to-gsm.yml']
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: نقلُ مفتاح الدرايف وحساب الخدمة إلى خزنة جوجل — بلا طباعةٍ لأيِّ قيمة
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
        run: |
          set -e
          umask 077; printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud config set project project-survey-60600 --quiet
          put(){ n="$1"; v="$2"; if [ -z "$v" ]; then echo "::warning::$n فارغٌ في GitHub — تُرك"; return 0; fi
            if gcloud secrets describe "$n" >/dev/null 2>&1; then printf '%s' "$v" | gcloud secrets versions add "$n" --data-file=- --quiet >/dev/null
            else printf '%s' "$v" | gcloud secrets create "$n" --data-file=- --replication-policy=automatic --quiet >/dev/null; fi
            echo "✓ $n في الخزنة"; }
          put JOBS_FIREBASE_SA "$SA"
          put GDRIVE_OAUTH "$GDRIVE_OAUTH"
          put GDRIVE_FOLDER "$GDRIVE_FOLDER"
          rm -f "$RUNNER_TEMP/sa.json"

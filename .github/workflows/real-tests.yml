name: Real browser + rules emulator
# اختبارٌ في كروميوم حقيقيٍّ بمقاس هاتف، وقواعدُ القاعدة على محاكي Firestore
# الرسمي — لا يفعلهما المتصفّحُ الصوريّ: لا يرسم ولا يلمس، ولا يعرف القاعدة.
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'firestore.rules', 'firebase.json', 'vendor/**', 'scripts/browser-test.mjs', 'scripts/rules-test.mjs', '.github/workflows/real-tests.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  browser:
    name: كروميوم حقيقي — هاتف
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund playwright@^1.56
      - run: npx playwright install --with-deps chromium
      - name: يدخل ويلمس نقطةَ ممرٍّ ويقيس النافذةَ ويرسم كلَّ شاشة
        run: node scripts/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-artifacts/
          retention-days: 14
  rules:
    name: قواعد Firestore — محاكي رسمي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm i --no-save --no-audit --no-fund firebase-tools@13 firebase@^10 @firebase/rules-unit-testing@^3
      - name: كلُّ دورٍ يطرق كلَّ باب — يُفتَح ما يجب ويُغلَق ما يجب
        run: npx firebase emulators:exec --only firestore --project demo-nusuk "node scripts/rules-test.mjs"

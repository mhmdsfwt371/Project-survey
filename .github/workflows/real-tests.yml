name: Real browser + rules emulator
# اختبارٌ في كروميوم حقيقيٍّ بمقاس هاتف، وقواعدُ القاعدة على محاكي Firestore
# الرسمي — لا يفعلهما المتصفّحُ الصوريّ: لا يرسم ولا يلمس، ولا يعرف القاعدة.
# يُستدعى من سير الفحص (Docs Version Check) قبل الترقية إلى الأصل — لا بدفعٍ
# مستقل، فلا يعمل مرتين لالتزامٍ واحد (V17.81).
# ═══ بوابةٌ صامتة (V17.93) ═══
# الفشلُ هنا لا يُسقِط التشغيلَ (فلا رسالةَ حمراء لصاحب المستودع): يُكتَب علامةَ
# PASS/FAIL في مصنوعة gate-* يقرؤها promote فلا يرقّي إلا إن مرَّ كلُّ شيء، ويُكتَب
# ما سقط تعليقًا على الالتزام فيقرؤه المساعدُ ويصلحه.
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  browser:
    name: كروميوم حقيقي — هاتف
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط حارسًا.
        run: |
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund playwright@^1.56 && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: متصفّح Chromium
        # `--with-deps` يشغّل `apt-get` على مرايا أوبونتو، وهي تتعثّر أحيانًا في
        # المُشغِّل («Some index files failed to download») فيسقط الحارسُ بسببِ
        # شبكةٍ لا بسببِ شيفرة. ومكتباتُ النظام موجودةٌ أصلًا في صورة
        # `ubuntu-latest` — فيُجرَّب التثبيتُ بلا حزمِ النظام أولًا، ولا يُلجَأ
        # إلى `apt` إلا إن فشل، ومع تحديثِ الفهارس قبله.
        run: |
          for i in 1 2 3; do
            npx playwright install chromium && exit 0
            echo "::warning::محاولةُ تنزيل المتصفّح $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::warning::تنزيلُ المتصفّح تعثّر ثلاثًا — تُجرَّب حزمُ النظام"
          sudo apt-get update -qq || true
          npx playwright install --with-deps chromium && exit 0
          echo "::error::تعذّر تثبيتُ المتصفّح"; exit 1
      - name: يدخل ويلمس نقطةَ ممرٍّ ويقيس النافذةَ ويرسم كلَّ شاشة
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          RC=0; node scripts/browser-test.mjs 2>&1 | tee /tmp/browser.txt || RC=$?
          mkdir -p gate
          if [ "$RC" = "0" ]; then echo PASS > gate/browser.txt; else
            { echo FAIL; grep -aE '✗|Error' /tmp/browser.txt | tail -30; } > gate/browser.txt
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(printf '### 🔴 المتصفّحُ الحقيقي سقط — لا ترقية\n```\n%s\n```' "$(grep -aE '✗|Error' /tmp/browser.txt | tail -30)")" > /dev/null || true
            echo "::warning::المتصفّحُ الحقيقي سقط — التفصيلُ تعليقًا على الالتزام، ولا ترقية"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-browser
          path: gate/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-artifacts/
          retention-days: 14
  rules:
    name: قواعد Firestore — محاكي رسمي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: أدواتُ المحاكي
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط حارسًا.
        run: |
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund firebase-tools@13 firebase@^10 @firebase/rules-unit-testing@^3 && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: كلُّ دورٍ يطرق كلَّ باب — يُفتَح ما يجب ويُغلَق ما يجب
        # المخرَجُ يُحفَظ ويُلخَّص: التنبيهاتُ تحمل اسمَ كلِّ فحصٍ ساقط،
        # والملخَّصُ يُكتَب في صفحة التشغيل فيُقرأ بلا تنزيلِ سجلّ.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          RC=0
          npx firebase emulators:exec --only firestore --project demo-nusuk \
            "node scripts/rules-test.mjs && node scripts/rules-before-test.mjs" 2>&1 | tee /tmp/rules.txt || RC=$?
          {
            echo '### محاكي القواعد'
            echo '```'
            grep -aE '✓|✗|فحصًا' /tmp/rules.txt | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p gate
          if [ "$RC" = "0" ]; then echo PASS > gate/rules.txt; else
            { echo FAIL; grep -aE '✗|Error|error' /tmp/rules.txt | tail -40; } > gate/rules.txt
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(printf '### 🔴 محاكي القواعد سقط — لا ترقية\n```\n%s\n```' "$(grep -aE '✗|فحصًا|Error' /tmp/rules.txt | tail -40)")" > /dev/null || true
            echo "::warning::محاكي القواعد سقط — التفصيلُ تعليقًا على الالتزام، ولا ترقية"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-rules
          path: gate/
          retention-days: 7

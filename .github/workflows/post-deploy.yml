name: Post-deploy smoke
# ما بعد النشر: الحرّاسُ تفحص المستودع، وهذا يفحص ما وصل الهاتفَ فعلًا —
# النسخةُ الحيّةُ هي المدفوعة، وتُقلع وتدخل وترسم كلَّ شاشةٍ بكلِّ دور.
# ═══ يعمل بعد النشر لا معه ═══
# كان يبدأ مع الدفع ويستطلع ستَّ دقائقَ حتى تصل النسخةُ. ونشرُ الصفحات قد
# يبقى في الطابور أطولَ من ذلك، فيسقط الفحصُ أحمرَ ولا عطلَ في شيءٍ سوى أنه
# سبق النشر — «فشل النشرُ لم يصل» وقد وصل بعده بدقيقة. والحمرةُ التي لا تدلُّ
# على عطلٍ تُعلِّم صاحبَها تجاهلَ الأحمر.
#   فصار يبدأ بحدث النشر نفسِه (deployment_status عند نجاحه): لا سباقَ أصلًا.
# والاستطلاعُ يبقى احتياطًا لانتشار المخبأ، والجدولةُ حارسًا على الخدمة.
on:
  deployment_status:
  schedule:
    - cron: '17 */6 * * *'     # حارسُ الخدمة كلَّ ستِّ ساعات
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    # حدثُ النشر يقع مرتين: عند بدئه وعند نجاحه — ولا يُفحَص إلا الناجح
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write      # (V38.82) بلاغُ المالك إن سقط فحصُ ما بعد النشر
    steps:
      # النسخةُ المتوقَّعةُ تُقرأ من الشجرة التي نُشرت لا من رأس الفرع:
      # دفعةٌ تالية أثناء النشر كانت تجعل الفحصَ ينتظر نسخةً لم تُنشَر بعد
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment && github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: المتصفّح الصوريّ
        # التثبيتُ يُعاد ثلاثًا: سقط سيرٌ كاملٌ مرةً لا لخللٍ في الكود بل
        # لتعثّرِ سِجلِّ الحزم لحظةً — والحارسُ الذي يسقط لسببٍ خارجيٍّ
        # يُعلِّم صاحبَه تجاهلَ الأحمر. المهلةُ تتضاعف، وما بقي أحمرَ بعدها
        # عطلٌ حقيقيٌّ يستحقُّ النظر.
        run: |
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund jsdom@^24 && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: النسخةُ الحيّةُ تُقلع وترسم كلَّ شاشة
        run: node scripts/post-deploy.mjs
      # (V38.82) سلسلةُ النشر تكمل وحدَها على الخادم — فإن سقط فحصُ ما بعد النشر بعد إعادته التلقائية
      # (rerun.yml يعيد المرةَ الأولى) يُبلَّغ المالك: النسخةُ نُشرت، وفحصُها سقط
      - name: فحصُ ما بعد النشر سقط مرتين — بلاغٌ للمالك
        if: failure() && github.event_name == 'deployment_status' && github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_LIVE: '1'
          CHAIN_SHA: ${{ github.event.deployment.sha }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          npm i --no-save --no-audit --no-fund nodemailer@^6 >/dev/null 2>&1 || true
          node scripts/chain-alert.mjs "فحص ما بعد النشر" "النسخةُ الحيّةُ لم تُقلع أو لم ترسم شاشاتِها — مرتين" || true

  # (V38.82) النشرُ نفسُه فشل: الإنتاجُ بقي على النسخة السابقة — بلاغٌ للمالك
  deploy-failed:
    if: github.event_name == 'deployment_status' && (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: النشرُ فشل — بلاغٌ للمالك
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_SHA: ${{ github.event.deployment.sha }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          npm i --no-save --no-audit --no-fund nodemailer@^6 >/dev/null 2>&1 || true
          node scripts/chain-alert.mjs "النشر" "صفحاتُ المستودع لم تنشر النسخة — الإنتاجُ على النسخة السابقة" || true

name: OSM fetch — Mina walkways (data branch only)
# فرعُ بياناتٍ منفصل: يجلب شوارعَ منى وطرقَ المشاة بأسمائها من OpenStreetMap (ODbL) مرةً واحدة
# ويحفظها في maps/mina-osm.json على هذا الفرع وحدَه — لا يمسُّ main ولا staging ولا البوابة.
on:
  push:
    branches: [osm-fetch]
    paths: ['.github/workflows/osm-fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass (highways with names, Mina + Jamarat)
        run: |
          Q='[out:json][timeout:170];(way["highway"](21.393,39.855,21.437,39.925););out tags geom;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sS --retry 2 -m 200 -X POST --data-urlencode "data=$Q" "$u" -o maps/mina-osm.json && python3 -c "import json;d=json.load(open('maps/mina-osm.json'));print('ways',len(d['elements']))" && break
          done
          ls -la maps/mina-osm.json
          # خطُّ قطار المشاعر ومحطاته — من عرفات إلى منى (للدور الرابع: الحجاجُ يركبون القطارَ ويمشون من محطة الجمرات)
          R='[out:json][timeout:170];(way["railway"~"^(rail|light_rail|subway|monorail)$"](21.34,39.85,21.44,39.99);node["railway"="station"](21.34,39.85,21.44,39.99);node["public_transport"="station"](21.34,39.85,21.44,39.99););out tags geom;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sS --retry 2 -m 200 -X POST --data-urlencode "data=$R" "$u" -o maps/mashaer-rail.json && python3 -c "import json;d=json.load(open('maps/mashaer-rail.json'));print('rail elements',len(d['elements']))" && break
          done
          ls -la maps/mashaer-rail.json
          # (V27.6) أسماءُ الشوارع والأماكن للمشاعر كلِّها — أربعُ رقعٍ صغيرة (الرقعةُ الواحدةُ الكبيرة كانت تتجاوز مهلة الخادم)، وما فشل منها لا يوقف الباقي
          mkdir -p /tmp/nm
          for BB in "21.39,39.85,21.45,39.93" "21.36,39.90,21.42,39.99" "21.33,39.93,21.40,40.02" "21.38,39.78,21.46,39.86"; do
            N="[out:json][timeout:120];(way[\"highway\"][\"name\"]($BB);node[\"place\"][\"name\"]($BB);node[\"natural\"=\"peak\"][\"name\"]($BB);nwr[\"amenity\"~\"^(hospital|mosque|place_of_worship|police|bus_station)$\"][\"name\"]($BB);nwr[\"railway\"=\"station\"][\"name\"]($BB););out tags center geom;"
            OUT="/tmp/nm/$(echo $BB | tr ',' '_').json"
            for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS --retry 1 -m 150 -X POST --data-urlencode "data=$N" "$u" -o "$OUT" && python3 -c "import json;json.load(open('$OUT'))" && break || rm -f "$OUT"
            done
            sleep 5
          done
          ls -la /tmp/nm/ || true
          python3 scripts/osm-names.py || true
          ls -la maps/mashaer-names.json || true
          # (V27.8) أسماءُ الإقليم (مكة وجدة والطائف وما بينها): المدنُ والقرى والمطاراتُ والطرقُ الرئيسية بأرقامها — للتكبير البعيد فوق القمر الصناعي
          mkdir -p /tmp/rg
          for BB in "20.6,38.9,21.4,40.0" "21.4,38.9,22.2,40.0" "20.6,40.0,21.4,41.1" "21.4,40.0,22.2,41.1"; do
            R2="[out:json][timeout:150];(node[\"place\"~\"^(city|town|village|suburb|hamlet)$\"][\"name\"]($BB);nwr[\"aeroway\"=\"aerodrome\"][\"name\"]($BB);node[\"natural\"=\"peak\"][\"name\"]($BB);way[\"highway\"~\"^(motorway|trunk|primary)$\"]($BB););out tags center geom;"
            OUT="/tmp/rg/$(echo $BB | tr ',' '_').json"
            for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS --retry 1 -m 170 -X POST --data-urlencode "data=$R2" "$u" -o "$OUT" && python3 -c "import json;json.load(open('$OUT'))" && break || rm -f "$OUT"
            done
            sleep 8
          done
          ls -la /tmp/rg/ || true
          python3 scripts/osm-region.py || true
          ls -la maps/region-names.json || true
      - name: Commit
        run: |
          git config user.name "osm-fetch-bot"; git config user.email "osm-fetch-bot@users.noreply.github.com"
          git add maps/mina-osm.json maps/mashaer-rail.json; git add maps/mashaer-names.json 2>/dev/null || true; git add maps/region-names.json 2>/dev/null || true; git commit -m "OSM: شوارع منى وطرق المشاة بأسمائها، وخطُّ قطار المشاعر ومحطاته، وأسماءُ شوارع المشاعر وأماكنها (ODbL)" && git push

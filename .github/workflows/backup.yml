name: Daily Firestore Backup
on:
  schedule:
    - cron: '30 2 * * *'   # 05:30 صباحًا بتوقيت السعودية يوميًا
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/backup.yml'
      - 'scripts/backup.mjs'
permissions:
  contents: write
concurrency: backup
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i firebase-admin@12 --no-save --no-audit --no-fund
      - name: Run backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning title=لا نسخة احتياطية::سرُّ FIREBASE_SERVICE_ACCOUNT غير مضبوط — لم تُؤخَذ نسخةٌ اليوم. اضبطه من Settings ← Secrets ← Actions."
            echo "لا نسخة احتياطية — السرُّ غير مضبوط" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          node scripts/backup.mjs

      # رفع النسخة الكاملة إلى درايف المالك — قبل التشفير لأنها تُرفع خامًا
      # إلى مساحته الخاصة. يتجاوز نفسه بهدوء إن لم تُضبط الأسرار.
      - name: Upload to Google Drive
        env:
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          GDRIVE_KEEP_DAYS: '0'      # 0 = لا يُحذف شيء أبدًا — المساحة ٥ تيرا
          GDRIVE_PHOTO_DAYS: '540'   # الصور: ١٨ شهرًا ≈ ١٫٢ تيرا
        run: |
          if [ -z "$GDRIVE_SA" ]; then
            echo "::notice::GDRIVE_SA غير مضبوط — تخطّي الرفع للدرايف"
            mkdir -p backups/latest
            printf '{\n  "ok": false,\n  "at": "%s",\n  "why": "GDRIVE_SA غير مضبوط — لم يُرفَع شيءٌ إلى درايف",\n  "fix": "Settings ← Secrets and variables ← Actions: GDRIVE_SA (JSON حساب الخدمة) وGDRIVE_FOLDER (معرّف المجلد المشارَك مع بريد الحساب)"\n}\n' "$(date -u +%FT%TZ)" > backups/latest/_drive.json
          else
            npm i googleapis@144 --no-save --no-audit --no-fund
            node scripts/drive-upload.mjs
          fi

      # المستودع عام — لا تُكتب بيانات خام أبدًا كنص صريح.
      # الحزمة تُشفَّر بمفتاح من الأسرار، وبلا مفتاح تُحذف ولا تُنشر.
      - name: Encrypt bundle
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            # الحمايةُ تبقى: بلا مفتاحٍ لا تُكتب بيانةٌ خامٌ في مستودعٍ عام.
            # لكنّ الفشلَ اليوميَّ يُعلّم صاحبَه تجاهلَ البريد، فيضيع الإنذارُ
            # الحقيقيُّ يومَ يأتي. فيُسجَّل النقصُ حيث يُرى — في المستودع نفسه
            # وفي ملخّص التشغيل — ولا يُفشَل.
            rm -f backups/bundle.json
            mkdir -p backups/latest
            printf '{\n  "ok": false,\n  "at": "%s",\n  "why": "BACKUP_KEY غير مضبوط — لم تُؤخَذ نسخة",\n  "fix": "Settings ← Secrets and variables ← Actions ← New repository secret · الاسم BACKUP_KEY"\n}\n' "$(date -u +%FT%TZ)" > backups/latest/_meta.json
            {
              echo "## ⚠ لا نسخة احتياطية اليوم"
              echo ""
              echo "\`BACKUP_KEY\` غير مضبوط، فلم تُحفظ أيُّ بيانات — أعدادٌ فقط."
              echo "المستودعُ عام، ولا تُكتب فيه بيانةٌ خامٌ بلا تشفير."
              echo ""
              echo "**الضبط مرةً واحدة:** Settings ← Secrets and variables ← Actions ← New repository secret"
              echo "الاسم \`BACKUP_KEY\` وقيمته عبارةٌ طويلة — احفظها عندك، فبدونها لا تُفكّ النسخة."
              echo ""
              echo "**وللاسترجاع لاحقًا:**"
              echo '```'
              echo "openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \\"
              echo "  -in backups/latest/backup.enc -out bundle.json -pass env:BACKUP_KEY"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            echo "::warning title=لا نسخة احتياطية::BACKUP_KEY غير مضبوط — لم تُحفظ أي بيانات. الضبط من Settings ← Secrets ← Actions."
          else
            openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
              -in backups/bundle.json -out backups/latest/backup.enc -pass env:BACKUP_KEY
            rm -f backups/bundle.json
            echo "encrypted ok — $(du -h backups/latest/backup.enc | cut -f1)"
          fi

      - name: Guard — no plaintext data may be committed
        run: |
          rm -f backups/photos.json
          LEAK=$(find backups/latest -name '*.json' ! -name '_meta.json' ! -name '_drive.json' | head -5)
          if [ -n "$LEAK" ]; then
            echo "::error::وُجد ملف بيانات صريح: $LEAK — أُلغيت العملية"
            exit 1
          fi
          echo "clean ✓"

      - name: Commit backup
        run: |
          git config user.name 'project-backup-bot'
          git config user.email 'actions@github.com'
          git add -A backups/latest
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "backup: $(date -u +%F_%H%M)"
            git push
          fi

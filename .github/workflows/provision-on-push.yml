# ═══ الحساباتُ المطلوبةُ من التطبيق تُنفَّذ عند كلِّ دفع (V30.7) ═══
# ترقيةُ main من البوابة لا تشغّل جسرَ الحسابات (provision.yml)، وجدولتُه تتأخر ساعاتٍ على مستودعٍ هادئ —
# فهذا السيرُ المستقلُّ يُنشئ ما طلبه المكتبُ مع أوّل دفعةٍ إلى التجربة أو الأصل، بالمنطق نفسِه (scripts/provision.mjs).
name: provision-on-push
on:
  push:
    branches: [main, staging]
    paths-ignore: ['backups/**', 'docs/**']
permissions:
  contents: read
concurrency:
  group: provision-on-push
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: أدواتُ الخادم
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط سيرًا.
        run: |
          for i in 1 2 3; do
            npm i firebase-admin@12 googleapis@140 --no-save --no-audit --no-fund && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: إنشاءُ ما طلبه المكتب
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/provision.mjs

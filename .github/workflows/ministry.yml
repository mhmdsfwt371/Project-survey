# ═══ شاشةُ الوزارة خارج التطبيق — لقطةٌ كلَّ ستِّ ساعات، وتقريرٌ كلَّ سبت ═══
# التقريرُ يُبنى من دوالِّ التطبيق نفسِها في متصفّحٍ صوري ببيانات القاعدة
# (scripts/ministry-report.mjs) فلا حقيقةَ ثانية. اللقطةُ (أرقامٌ فقط) تُدفَع إلى
# فرع ministry فتقرؤها الصفحةُ المشتركة docs/ministry/ برمز اليوم. والتقريرُ
# يُطبَع PDF بكروميوم ويُرسَل بالبريد مع رموز الأسبوع.
name: Ministry screen
on:
  schedule:
    - cron: '20 */6 * * *'     # لقطةٌ كلَّ ستِّ ساعات
    - cron: '30 4 * * 0'       # التحديثُ الأسبوعيُّ — الأحد ٧:٣٠ صباحًا بمكة قبل اجتماع الوزارة (V30.0)
    - cron: '30 2 * * *'       # ملفُّ البيانات اليوميُّ للوزارة — ٥:٣٠ صباحًا بمكة (V30.4)
  workflow_dispatch:
    inputs:
      report:
        description: 'أرسل التقريرَ الأسبوعيَّ الآن'
        default: 'no'
      mail:
        description: 'بالبريد؟ (no = توليدٌ ورفعٌ للدرايف بلا بريد)'
        default: 'yes'
      daily:
        description: 'ولّد ملفَّ البيانات اليوميَّ الآن'
        default: 'no'
permissions:
  contents: write
jobs:
  ministry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: الحزم
        run: |
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund jsdom@^24 firebase-admin@^12 nodemailer@^6 qrcode@^1 && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت"; sleep $((i*15))
          done
          exit 1
      - name: التقريرُ واللقطة — من دوالِّ التطبيق نفسِها
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MINISTRY_SECRET: ${{ secrets.MINISTRY_SECRET }}
          MINISTRY_OUT: /tmp/ministry
        run: node scripts/ministry-report.mjs
      - name: اللقطةُ إلى فرع ministry — أرقامٌ فقط
        run: |
          git config user.name nusuk-ministry && git config user.email bot@nusuk
          rm -rf /tmp/mbranch && mkdir -p /tmp/mbranch && cp /tmp/ministry/snapshot.json /tmp/mbranch/
          cd /tmp/mbranch && git init -q && git checkout -q -b ministry && git add snapshot.json
          git -c user.name=nusuk-ministry -c user.email=bot@nusuk commit -q -m "snapshot $(date -u +%FT%H:%M)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ministry:ministry
          echo "✓ اللقطةُ نُشرت"
      - name: التقريرُ الأسبوعي — PDF بالبريد
        if: github.event.schedule == '30 4 * * 0' || github.event.inputs.report == 'yes'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MINISTRY_SECRET: ${{ secrets.MINISTRY_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          NODE_OPTIONS: --require ./scripts/lib/jsdom-dict.cjs
        run: |
          npm i --no-save --no-audit --no-fund googleapis@^144 || true
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund playwright@^1 && npx playwright install --with-deps chromium && break
            echo "::warning::تثبيتُ المتصفّح $i تعثّر"; sleep $((i*15))
          done
          node scripts/ministry-pdf.mjs /tmp/ministry/report.html /tmp/ministry/ministry-report.pdf || true
          # (V30.0) التحديثُ الأسبوعيُّ من التطبيق نفسِه: باوربوينت بالقالب الموحَّد وPDF بالخطِّ المرفوع — وفحصُ الملف قبل الخروج
          node scripts/weekly-pack.mjs || true
          if [ -f /tmp/ministry/weekly.html ]; then
            BASE="$(cat /tmp/ministry/base.txt)"
            node scripts/ministry-pdf.mjs /tmp/ministry/weekly.html "/tmp/ministry/${BASE}.pdf" || true
            node scripts/weekly-drive.mjs "/tmp/ministry/${BASE}.pptx" "/tmp/ministry/${BASE}.pdf" /tmp/ministry/brief.txt || true
          fi
          {
            if [ -f /tmp/ministry/brief.txt ]; then cat /tmp/ministry/brief.txt; echo ""; echo "────────"; fi
            echo "تقريرُ الوزارة الأسبوعي — مرفقٌ PDF بنفس تصميم شاشة الوزارة."
            echo ""
            echo "الصفحةُ المشتركة: https://mhmdsfwt371.github.io/Project-survey/docs/ministry/"
            if [ -n "$MINISTRY_SECRET" ]; then
              echo "رموزُ الدخول لأيام الأسبوع القادم (كلُّ رمزٍ ليومه بتوقيت غرينتش):"
              for k in 0 1 2 3 4 5 6; do
                day=$(date -u -d "+$k day" +%F)
                code=$(printf '%s|%s' "$MINISTRY_SECRET" "$day" | sha256sum | cut -c1-6 | tr a-f A-F)
                echo "  $day → $code"
              done
            fi
          } > /tmp/ministry/mail.txt
          ATT=/tmp/ministry/ministry-report.pdf
          if [ -f /tmp/ministry/base.txt ]; then BASE="$(cat /tmp/ministry/base.txt)"; [ -f "/tmp/ministry/${BASE}.pptx" ] && ATT="/tmp/ministry/${BASE}.pptx,$ATT"; [ -f "/tmp/ministry/${BASE}.pdf" ] && ATT="/tmp/ministry/${BASE}.pdf,$ATT"; fi
          if [ "${{ github.event.inputs.mail }}" = "no" ]; then echo "بلا بريد — توليدٌ ورفعٌ فقط"; else MAIL_ATTACH="$ATT" node scripts/mail-send.mjs "قارئات أفاقي — التحديثُ الأسبوعي $(date -u +%F)" /tmp/ministry/mail.txt; fi
      - name: ملفُّ البيانات اليومي — إكسل وJSON وGeoJSON إلى الدرايف (V30.4)
        if: github.event.schedule == '30 2 * * *' || github.event.inputs.daily == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          NODE_OPTIONS: --require ./scripts/lib/jsdom-dict.cjs
          WEEKLY_MODE: daily
          WEEKLY_OUT: /tmp/daily
          WEEKLY_FOLDER: البيانات اليومية
        run: |
          npm i --no-save --no-audit --no-fund googleapis@^144 xlsx@0.18.5 || true
          node scripts/weekly-pack.mjs || true
          if [ -f /tmp/daily/base.txt ]; then BASE="$(cat /tmp/daily/base.txt)"; node scripts/weekly-drive.mjs "/tmp/daily/${BASE}.xlsx" "/tmp/daily/${BASE}.json" "/tmp/daily/${BASE}.geojson" /tmp/daily/brief.txt || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ministry-${{ github.run_id }}
          path: /tmp/ministry/
          retention-days: 30

# ═══ تغذيةُ الموسم — بياناتُ المشروع المؤكَّدةُ تصل القاعدةَ من الملف ═══
# docs/season.json يحمل كلَّ قيمةٍ بمصدرها، وهذا السيرُ يملأ بها settings/points
# حين يتغيّر الملفُ — ولا يُكتَب إلا الحقلُ الفارغ: ما ضُبط بيدٍ في التطبيق
# لا يُمَسّ. فالتطبيقُ لا يعرض أصفارًا لأن أحدًا لم يفتح شاشةَ الإعدادات.
name: Season seed
on:
  push:
    branches: [main]
    paths: ['docs/season.json', 'docs/trials.json', 'docs/twins.json', 'scripts/season-seed.mjs']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: الحزم
        run: |
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund firebase-admin@^12 && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت"; sleep $((i*15))
          done
          exit 1
      - name: التغذية — الفارغُ وحدَه
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/season-seed.mjs | tee /tmp/seed.txt | tee -a $GITHUB_STEP_SUMMARY
      # النتيجةُ تعليقًا على الالتزام: تُقرأ من الواجهة بلا فتح السجلّ (V17.89)
      - name: النتيجةُ على الالتزام
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### تغذيةُ الموسم — $(date -u +%FT%H:%M)"; echo '```'; tail -c 6000 /tmp/seed.txt; echo '```'; } > /tmp/seed-comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat /tmp/seed-comment.md)" > /dev/null && echo "✓ كُتبت النتيجة" || echo "::warning::تعذّر تعليقُ النتيجة"


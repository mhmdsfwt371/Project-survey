name: Docs Version Check
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: الحارس — تطابق النسخ وسجل الصفحات والترجمة
        run: node scripts/check-version.mjs
      - name: لجنة الفحص — كل شاشة تُفتح وترسم
        run: npm i --no-save --silent jsdom && node scripts/qa.mjs

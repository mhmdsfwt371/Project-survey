name: Docs Version Check
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: المتصفّح الصوريّ — تحتاجه الجرودُ كلُّها
        # التثبيتُ يُعاد ثلاثًا: سقط سيرٌ كاملٌ مرةً لا لخللٍ في الكود بل
        # لتعثّرِ سِجلِّ الحزم لحظةً — والحارسُ الذي يسقط لسببٍ خارجيٍّ
        # يُعلِّم صاحبَه تجاهلَ الأحمر. المهلةُ تتضاعف، وما بقي أحمرَ بعدها
        # عطلٌ حقيقيٌّ يستحقُّ النظر.
        run: |
          for i in 1 2 3; do
            npm i --no-save --no-audit --no-fund jsdom@^24 docx@^9 jszip@^3 && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      # أدلةُ الأدوار تُولَّد من الصلاحيات — والسحابةُ تتحقّق أن المدفوعَ
      # مطابقٌ لما يُولَّد: من غيّر دورًا ونسي التوليدَ يُمسَك هنا.
      - name: أدلة الأدوار — مولَّدة ومطابقة
        run: cp docs/manuals/index.json /tmp/mi.json && node scripts/role-manuals.mjs && cmp -s /tmp/mi.json docs/manuals/index.json || { echo "✗ فهرسُ أدلة الأدوار غيرُ مطابق — دورٌ تغيّر ولم يُعَد التوليد"; exit 1; }
      # الحارسُ يشغّل الجرودَ داخله ليكون تشغيلُه وحدَه كافيًا على الجهاز.
      # وهنا لكلِّ جردٍ خطوتُه، فإعادتُه فيه تشغيلٌ مرتين لكلِّ شيء —
      # والاسمُ الظاهرُ في الخطوة يقول أيُّ جردٍ سقط، وهو أنفعُ من رسالةٍ واحدة.
      - name: الحارس — تطابق النسخ وسجل الصفحات والترجمة
        env:
          NUSUK_SKIP_AUDITS: '1'
        run: node scripts/check-version.mjs
      - name: جرد البيانات — كل حقلٍ مقروءٍ على مصدره
        run: node scripts/audit-data.mjs
      - name: جرد الكتابة — كل وعدٍ يكتب أو يقول لماذا
        run: node scripts/audit-writes.mjs
      - name: جرد السعة — ميزانيةُ اليوم والحصص
        run: node scripts/audit-capacity.mjs
      - name: جرد الاتساع — مئة وخمسون جهازًا ستة أشهر
        run: node scripts/audit-scale.mjs
      - name: الحالة الصفرية — كل رقم معروض له مصدر
        run: node scripts/audit-zero.mjs
      - name: جرد الصفحات — لا شاشة ميتة ولا معزولة
        run: node scripts/audit-pages.mjs
      - name: جرد اللغة — لا حرف عربي يبقى بلا قرار
        run: node scripts/audit-lang.mjs
      - name: جرد الترجمة بالرندر — كل صفحة تُفتح بالإنجليزية
        run: node scripts/audit-i18n.mjs
      - name: جرد الاستقرار — ما يسوء يُرى ولا يُبتلَع
        run: node scripts/audit-stability.mjs
      - name: رحلة المسح — من الإسناد إلى نقاط التركيب
        run: node scripts/audit-journey.mjs
      - name: جرد الشرائح — الدمج لا يغيّر رؤية أحد ولا يكسر رابطًا
        run: node scripts/audit-tabs.mjs
      - name: جرد دورة الزيارة — من الإسناد إلى طبقة التركيب بالنقر
        run: node scripts/audit-cycle.mjs
      - name: جرد سلسلة الإدارة — المدير أعلى مرتبةً والقسم من أقسام الشركة
        run: node scripts/audit-mgr.mjs
      - name: جرد اللمس — أهداف ٤٤ بكسلًا وأرقام الأسطورة
        run: node scripts/audit-touch.mjs
      - name: جرد العناوين — المُركّبة سابقًا تُقرأ من الميدان ولا تُخترَع
        run: node scripts/audit-ip.mjs
      - name: جرد التسليم — محضر لكل نقطة ولكل شركة، والفك بعده
        run: node scripts/audit-hand.mjs
      - name: جرد الجودة — معرّفات مكرّرة وحقول بلا تسمية ونصوص مركّبة، بكل دور ولغتين
        run: node scripts/audit-qa.mjs
      - name: جرد مبادئ الإدارة — مخاطر حيّة وصندوق قرارات ونافذة وزارة قراءةً
        run: node scripts/audit-pmp.mjs
      - name: جرد الفجوات الإدارية — التغيير يحدّث خط الأساس، ومواعيد المعالم، والاحتياطي
        run: node scripts/audit-pmp2.mjs
      - name: جرد إشعار الشركات — دفتر الجوالات وزر واتساب بنصوصه الثلاثة
        run: node scripts/audit-wa.mjs
      - name: جرد إغلاق اللوحات — كل لوح يُغلَق بنقرة خارجه
        run: node scripts/audit-dismiss.mjs
      - name: جرد الملاءمة — ما يُعرَض على كل دور يُقرأ على شاشته
        run: node scripts/audit-fit.mjs
      - name: جرد تزامن اللغة — تُغيَّر من موضع فتتفق في المواضع الثلاثة
        run: node scripts/audit-lang2.mjs
      - name: جرد الأزرار — لا زرَّ يُرسَم بلا معالج ولا ينتقل إلى شاشة غير موجودة
        run: node scripts/audit-buttons.mjs
      - name: جرد سجل الإسنادات — كل نوع يُتابَع ويُعدَّل ويُحذَف
        run: node scripts/audit-registry.mjs
      - name: جرد التصحيح والحذف — ما يُضاف يُصحَّح ويُحذَف
        run: node scripts/audit-del.mjs
      - name: جرد الجاهز للإسناد — لكل نوع طلب بابه من التوزيع
        run: node scripts/audit-asnq.mjs
      - name: جرد طلب الصرف — DR يُسنَد ويدخل عهدة صاحبه
        run: node scripts/audit-issue.mjs
      - name: جرد رموز الطلبات — SR/IR/MR/UR/DR بمعانيها، والصيانة من الخريطة
        run: node scripts/audit-codes.mjs
      - name: جرد ثوابت العمل — لا يتيم ولا سالب ولا مكرّر
        run: node scripts/audit-invariants.mjs
      - name: جرد حالة النسخ — لا نجاح كاذبًا
        run: node scripts/audit-backup.mjs
      - name: جرد الوثيقة المسمومة — لا توقف الطابور
        run: node scripts/audit-poison.mjs
      - name: جرد سيور السحابة — لا سقوط لسبب خارجي، وما سقط يُعاد مرة
        run: node scripts/audit-ci.mjs
      - name: جرد وثيقة الحساب — لا حصار صامت
        run: node scripts/audit-mydoc.mjs
      - name: جرد إطلاق المعزول — إصلاح السبب يُطلق ما حُبس به
        run: node scripts/audit-release.mjs
      - name: جرد الدورة الكاملة — نقطة تُمشى من أولها إلى آخرها
        run: node scripts/audit-e2e.mjs
      - name: جرد الدفع اليدوي — زر يُضغَط فيقع شيء ويُقال نتيجته
        run: node scripts/audit-push.mjs
      - name: جرد فكِّ الأسماء المركّبة — بالفاصلة لا بكل «شركة»
        run: node scripts/audit-cosplit.mjs
      - name: جرد اسم الشركة — بلغة الواجهة والقيمة عربية
        run: node scripts/audit-coname.mjs
      - name: جرد الفكِّ والصيانة — لكل نوع نموذجه يُغلِق مهمته
        run: node scripts/audit-urmr.mjs
      - name: جرد إعلان الخطوات — كل حفظ يُعلن ويصل اللوحات
        run: node scripts/audit-steps.mjs
      - name: جرد التمام البنيوي — ما يُرى في الشاشة يصل القاعدة
        run: node scripts/audit-wiring.mjs
      - name: جرد محضر الاستلام — لكل نوع نموذجه الرسمي
        run: node scripts/audit-hodoc.mjs
      - name: جرد جاهزية الموسم — ما ينقص يُقال قبل أن يبدأ
        run: node scripts/audit-ready.mjs
      - name: جرد بدء الموسم — المقترح يُكتَب ولا يُفرَض
        run: node scripts/audit-seed.mjs
      - name: جرد الصنعة — ما لا يظهر في شاشة
        run: node scripts/audit-craft.mjs
      - name: جرد سلسلة الشروط — الطريق يُرى قبل الرفض
        run: node scripts/audit-gate.mjs
      - name: جرد حفظ الموضع — لا قفزة إلى الرأس مع كل ضغطة
        run: node scripts/audit-scroll.mjs
      - name: جرد من يُسنَد إليه — الميدان ثلاثة لا كل الحسابات
        run: node scripts/audit-field.mjs
      - name: جرد تسمية الصور — باسم النقطة ورقمها
        run: node scripts/audit-photos.mjs
      - name: جرد الإدارة العليا — مرتبة فوق مدير المشروع
        run: node scripts/audit-exec.mjs
      - name: جرد الرتبة والوظيفة — الرتبة أعلى الاثنين
        run: node scripts/audit-rank.mjs
      - name: جرد الإنصات والرؤية — كل جهاز يرى ما يُكتَب وكلٌّ يرى من دونه
        run: node scripts/audit-live.mjs
      - name: جرد الإنشاء من الخادم — المكتب يكتب والخادم يُنشئ
        run: node scripts/audit-invite.mjs
      - name: جرد سلسلة الحساب — الهرم كله بلصقة ويُمشى ما بعده
        run: node scripts/audit-accounts.mjs
      - name: جرد من يُنشئ من — كلٌّ في مستواه أو دونه
        run: node scripts/audit-hier.mjs
      - name: جرد كلمة المرور — المؤقتة تُبدَّل أول دخول
        run: node scripts/audit-pw.mjs
      - name: جرد الحضور — من بدأ ومن لم يبدأ يُعرَف صباحًا
        run: node scripts/audit-att.mjs
      - name: جرد طريق اليوم — الأقرب أولًا واتجاهات لكل نقطة
        run: node scripts/audit-route.mjs
      - name: جرد واتساب الإسناد — الفني يُبلَّغ بضغطة
        run: node scripts/audit-waasn.mjs
      - name: جرد الفريق من طرف إلى طرف — المدير يُنشئ والمهندس على لابه يرى المشرفين
        run: node scripts/audit-e2e-accounts.mjs
      - name: جرد الدخول — لا دخول بلا هوية مُثبَتة
        run: node scripts/audit-login.mjs
      - name: جرد شاهد القبر — ما يُمسح في جهاز يُمحى في الباقي
        run: node scripts/audit-tomb.mjs
      - name: التصفير ونسخ الأجهزة — كلُّ بندٍ له مجموعةٌ وحذفٌ في القاعدة، والنسخُ من الأجهزة لا من الحفر
        run: node scripts/audit-wipe.mjs
      - name: عدّاد المزامنة والسجلات وطلبات الإنشاء — السجلات تُفتح بحدث حقيقي، والعدّاد يعدّ ويزامن، والطلب يذهب مع صاحبه
        run: node scripts/audit-sync.mjs
      - name: مصفوفة الصلاحيات — الشاشة تكتب ما تقرؤه القاعدة والافتراضيات مرآة
        run: node scripts/audit-perms.mjs
      - name: الأدوار المخصَّصة — تُضاف وتُحذَف وتنفذ في القاعدة، والميدان يرى المُسنَد
        run: node scripts/audit-crole.mjs
      - name: الحساب المكرَّر وإعادة الكلمة — المؤقت لا يكتب وثيقة، والمكرَّر يُدمَج، والكلمة تُعاد من الشاشة
        run: node scripts/audit-dupe.mjs
      - name: الرؤية من فوق — النطاق بالرتبة، والمؤشر لا يقفز، والإنصات الحي على العمل، ودورة دقيقة
        run: node scripts/audit-cascade.mjs
      - name: مراجعة الأدوار — أمن وقواعد وتشغيل وجودة ومعمار ووصولية وتدقيق
        run: node scripts/audit-review.mjs
      - name: الدورة الحياتية — سيناريو كامل من الحساب إلى التقرير
        run: node scripts/audit-flow.mjs
      - name: جرد الدورة الكاملة — كل إضافة وتعديل وحذف تُجرَّب
        run: node scripts/audit-crud.mjs
      - name: جرد قواعد القاعدة — تُقاس على التطبيق
        run: node scripts/audit-db-rules.mjs
      - name: جرد القواعد — كل قاعدة تمنع فعلًا
        run: node scripts/audit-rules.mjs
      - name: جرد التصديرات — كل ورقة تُولَّد وتُقاس
        run: node scripts/audit-exports.mjs
      - name: جرد المعادلات — كل رقم يُحسب مرتين
        run: node scripts/audit-calc.mjs
      - name: جرد الأدوار — كلٌّ يرى ما له ولا يرى ما ليس له
        run: node scripts/audit-roles.mjs
      - name: جرد الخريطة الثلاثية — الثلاثيُّ هو الخريطةُ نفسُها مرفوعةً
        run: node scripts/audit-map3d.mjs
      - name: جرد مجلدات الصور — لكلِّ نقطةٍ مجلدُها باسمها
        run: node scripts/audit-photo-folders.mjs
      - name: دفتر المطابقة — القديم كلُّه محكومٌ عليه
        run: node scripts/parity.mjs
      - name: حارس الحُرّاس — عطلٌ مزروعٌ يجب أن يُمسَك
        run: node scripts/audit-guards.mjs
      - name: لجنة الفحص — كل شاشة تُفتح وترسم
        run: node scripts/qa.mjs

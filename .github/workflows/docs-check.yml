name: Docs Version Check
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: المتصفّح الصوريّ — تحتاجه الجرودُ كلُّها
        run: npm i --no-save --no-audit --no-fund jsdom@^24
      # الحارسُ يشغّل الجرودَ داخله ليكون تشغيلُه وحدَه كافيًا على الجهاز.
      # وهنا لكلِّ جردٍ خطوتُه، فإعادتُه فيه تشغيلٌ مرتين لكلِّ شيء —
      # والاسمُ الظاهرُ في الخطوة يقول أيُّ جردٍ سقط، وهو أنفعُ من رسالةٍ واحدة.
      - name: الحارس — تطابق النسخ وسجل الصفحات والترجمة
        env:
          NUSUK_SKIP_AUDITS: '1'
        run: node scripts/check-version.mjs
      - name: جرد البيانات — كل حقلٍ مقروءٍ على مصدره
        run: node scripts/audit-data.mjs
      - name: جرد الكتابة — كل وعدٍ يكتب أو يقول لماذا
        run: node scripts/audit-writes.mjs
      - name: جرد السعة — ميزانيةُ اليوم والحصص
        run: node scripts/audit-capacity.mjs
      - name: جرد الاتساع — مئة وخمسون جهازًا ستة أشهر
        run: node scripts/audit-scale.mjs
      - name: الحالة الصفرية — كل رقم معروض له مصدر
        run: node scripts/audit-zero.mjs
      - name: جرد الصفحات — لا شاشة ميتة ولا معزولة
        run: node scripts/audit-pages.mjs
      - name: جرد اللغة — لا حرف عربي يبقى بلا قرار
        run: node scripts/audit-lang.mjs
      - name: جرد الترجمة بالرندر — كل صفحة تُفتح بالإنجليزية
        run: node scripts/audit-i18n.mjs
      - name: مراجعة الأدوار — أمن وقواعد وتشغيل وجودة ومعمار ووصولية وتدقيق
        run: node scripts/audit-review.mjs
      - name: الدورة الحياتية — سيناريو كامل من الحساب إلى التقرير
        run: node scripts/audit-flow.mjs
      - name: جرد الدورة الكاملة — كل إضافة وتعديل وحذف تُجرَّب
        run: node scripts/audit-crud.mjs
      - name: جرد قواعد القاعدة — تُقاس على التطبيق
        run: node scripts/audit-db-rules.mjs
      - name: جرد القواعد — كل قاعدة تمنع فعلًا
        run: node scripts/audit-rules.mjs
      - name: جرد التصديرات — كل ورقة تُولَّد وتُقاس
        run: node scripts/audit-exports.mjs
      - name: جرد المعادلات — كل رقم يُحسب مرتين
        run: node scripts/audit-calc.mjs
      - name: جرد الأدوار — كلٌّ يرى ما له ولا يرى ما ليس له
        run: node scripts/audit-roles.mjs
      - name: دفتر المطابقة — القديم كلُّه محكومٌ عليه
        run: node scripts/parity.mjs
      - name: حارس الحُرّاس — عطلٌ مزروعٌ يجب أن يُمسَك
        run: node scripts/audit-guards.mjs
      - name: لجنة الفحص — كل شاشة تُفتح وترسم
        run: node scripts/qa.mjs

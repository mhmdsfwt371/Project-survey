name: Provision accounts
# ═══ إنشاءُ الحسابات من الخادم ═══
# المكتبُ يكتب الطلبَ في التطبيق — والخادمُ يُنشئ حسابَ الدخول بمفتاح
# المشروع، فلا يقف حسابٌ على متصفّحٍ ولا شبكةٍ لحظية. كلَّ عشر دقائق،
# وعند الطلب من صفحة Actions.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: أدواتُ الخادم
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط سيرًا.
        run: |
          for i in 1 2 3; do
            npm i firebase-admin@12 --no-save --no-audit --no-fund && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: إنشاءُ ما طلبه المكتب
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/provision.mjs

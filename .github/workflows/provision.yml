name: Provision accounts + photos
# ═══ إنشاءُ الحسابات من الخادم ═══
# المكتبُ يكتب الطلبَ في التطبيق — والخادمُ يُنشئ حسابَ الدخول بمفتاح
# المشروع، فلا يقف حسابٌ على متصفّحٍ ولا شبكةٍ لحظية. كلَّ عشر دقائق،
# وعند الطلب من صفحة Actions.
on:
  schedule:
    - cron: '*/5 * * * *'   # (V39.81) دورةٌ واحدةٌ كلَّ ٥ دقائق بدل حلقة ٥٫٥ ساعات
  # الجدولةُ تتأخّر ساعاتٍ تحت ضغط GitHub — فالدفعُ إلى main يشغّل الجسرَ أيضًا (V17.39)
  push:
    branches: [main]
    paths-ignore: ['backups/**']
  # التشغيلُ اليدويُّ بلا مدخلات (V17.93): الحساباتُ تُطلَب من التطبيق في provision
  # حيث تحرسها القواعدُ بالرتبة — لا من نصٍّ حرٍّ يكتبه من يملك مفتاحَ التشغيل
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write        # جسرُ البلاغات: يفتح بلاغَ المستودع من بلاغ التطبيق
# (V38.77) the schedule fired twice in ten hours on 22 Oct and photos waited all morning: GitHub drops most scheduled starts
# under load. One run now keeps working for five and a half hours, a cycle every five minutes, and a newer start replaces it.
concurrency:
  group: provision-loop
  cancel-in-progress: false   # (V39.81) لا تُقطَع دورةٌ جارية؛ الزائدُ ينتظر أو يُلغى بصمت
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: أدواتُ الخادم
        # التثبيتُ يُعاد ثلاثًا: تعثّرُ سِجلِّ الحزم لحظةً لا يُسقِط سيرًا.
        run: |
          for i in 1 2 3; do
            npm i firebase-admin@12 googleapis@140 --no-save --no-audit --no-fund && exit 0
            echo "::warning::محاولةُ التثبيت $i تعثّرت — إعادةٌ بعد $((i*15))ث"
            sleep $((i*15))
          done
          echo "::error::تعذّر التثبيتُ بعد ثلاث محاولات"; exit 1
      - name: دورةُ الخادم — الحسابات والصور والبلاغات كلَّ خمس دقائق لخمس ساعات ونصف
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1; do   # (V39.81) owner: «كل شوية بيجيلي إيميل بمشكلة» — the 5.5-hour loop lost its runner («The hosted runner lost communication»); one short cycle per run removes that
            echo "::group::الدورة $i — $(date -u +%H:%M)"
            node scripts/provision.mjs   || echo "::warning::الحسابات: الدورة $i تعثّرت"
            node scripts/photos-sync.mjs || echo "::warning::الصور: الدورة $i تعثّرت"
            node scripts/bugs-sync.mjs   || echo "::warning::البلاغات: الدورة $i تعثّرت"
            echo "::endgroup::"
          done
      # (V38.84) ما قرأته هذه المهمّةُ من القاعدة يُضاف إلى settings/jobreads — تسمّيه بطاقةُ التكلفة باسمه
      - name: عدّادُ قراءات المهمّة
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/reads-flush.mjs || true

name: Release train
# ═══ قطارُ الإصدار (V17.97) ═══
# الميدانُ يستقبل التحديثَ مرةً في اليوم لا مع كلِّ دفعة (V21.9): كلَّ يومٍ
# ٠١:٠٠ UTC (٠٤:٠٠ مكة) يُرقَّى آخرُ التزامٍ على فرع التجربة بوابتُه خضراء
# (nusuk/gate = success) إلى الأصل تقدُّمًا سريعًا. ويُطلَق يدًا عند الحاجة.
# الطوارئُ تُرقَّى فورًا من البوابة نفسِها بترويسة «Release: hotfix».
# المواعيدُ هنا وحدَها — وAGENTS.md يسمّيها.
on:
  schedule:
    - cron: '0 1 * * *'   # كلَّ يومٍ ٠١:٠٠ UTC (٤ فجرًا بمكة) — تحديثٌ واحدٌ في اليوم يصل الأجهزةَ أوّلَ فتحٍ صباحيّ، لا في منتصف العمل (V21.9)
  workflow_dispatch: {}
permissions:
  contents: write
  statuses: read
  actions: write
  issues: write   # (V39.82) قفلُ مسائل «الإصدار … وقف عند» القديمة بعد كل ترقيةٍ ناجحة
concurrency:
  group: train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: staging
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: اختيارُ آخر التزامٍ خضراءَ بوابتُه
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main staging
          sha=$(node scripts/train-pick.mjs)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          [ -n "$sha" ] && echo "المرشّح: $sha" || echo "لا مرشّح"
      - name: الترقيةُ إلى الأصل
        if: steps.pick.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git merge-base --is-ancestor "${{ steps.pick.outputs.sha }}" origin/main; then
            echo "::notice title=لا جديد::الأصلُ يحمل هذا الالتزامَ أصلًا"; exit 0
          fi
          node scripts/train-promote.mjs "${{ steps.pick.outputs.sha }}"
      - name: إطلاقُ سير التغذية بعد الترقية
        if: steps.pick.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${{ steps.pick.outputs.sha }}" origin/main; then
            gh workflow run season.yml --ref main && echo "✓ أُطلقت التغذية" || echo "::warning::تعذّر إطلاقُ التغذية"
          fi
      - name: قفلُ مسائل «الإصدار … وقف» القديمة — الإنتاجُ تجاوزها
        # (V39.82) owner: «اعملها» — every successful promotion closes the old «release stopped at…» issues it supersedes
        if: steps.pick.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ steps.pick.outputs.sha }}" origin/main; then exit 0; fi
          VER=$(git show origin/main:sw.js | grep -o "nusuk-survey-v[0-9]*\.[0-9]*" | head -1 | sed 's/nusuk-survey-v/V/')
          n=0
          for num in $(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title | test("^الإصدار V[0-9.]+ وقف عند")) | .number'); do
            gh issue close "$num" --reason completed --comment "أُغلقت تلقائيًّا: الإنتاجُ على ${VER:-آخر إصدار} بعد ترقيةٍ خضراء — الإصدارُ المذكور تجاوزه ما بعده." && n=$((n+1)) || echo "::warning::تعذّر قفلُ #$num"
          done
          echo "::notice title=المسائل القديمة::أُغلقت $n"

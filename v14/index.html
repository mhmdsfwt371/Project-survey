<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#185FA5">
<title>قارئات نُسُك — معاينة V14</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   نُسُك V14 — نظام التصميم
   وضعان: فاتح للإدارة على المكتب · داكن للميدان تحت الشمس
   والاتجاه ينقلب مع dir بالخصائص المنطقية وحدها
   ═══════════════════════════════════════════════════════════════════ */

:root{
  --bg:#f4f6f8; --surface:#fff; --surface-2:#f8fafb; --raise:#fff;
  --ink:#14181d; --ink-soft:#5b6673; --ink-mute:#8a939d;
  --line:#e2e6ea; --line-2:#eef1f4;
  --brand:#185FA5; --brand-ink:#fff; --brand-soft:#E6F1FB; --brand-deep:#0C447C;
  --danger:#b3261e; --danger-bg:#fdecea;
  --ok:#1d7a3d; --ok-bg:#e8f5ec;
  --warn:#8a5300; --warn-bg:#fdf1de;
  --info:#0b5f7a; --info-bg:#e3f4f8;
  --sidebar:#101a1f; --sidebar-ink:#d7dde2; --sidebar-line:rgba(255,255,255,.1);
  --radius:10px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,24,29,.06);
  --sw:264px;
}
[data-theme="dark"]{
  --bg:#0A0D10; --surface:#12171c; --surface-2:#0F1418; --raise:#171D23;
  --ink:#E8EBEE; --ink-soft:#9BA5AF; --ink-mute:#6C757E;
  --line:#232B33; --line-2:#1B222A;
  --brand:#378ADD; --brand-ink:#04121f; --brand-soft:#12263A; --brand-deep:#9CC8F5;
  --danger:#F0837B; --danger-bg:#2A1512;
  --ok:#5FD08A; --ok-bg:#0F2418;
  --warn:#E7B45C; --warn-bg:#2A1F0D;
  --info:#6FC9E0; --info-bg:#0D2229;
  --sidebar:#0C1216; --sidebar-ink:#C6CFD7; --sidebar-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body[data-lang="ur"]{font-family:"Noto Nastaliq Urdu",system-ui,sans-serif;line-height:1.9}
a{color:var(--brand)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── الهيكل ───────────────────────────────────────── */
.shell{margin-inline-start:var(--sw);min-height:100vh;display:flex;flex-direction:column}
.content{padding:22px;max-width:1200px;width:100%;flex:1}
.content.flush{padding:0;max-width:none}

.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sw);
  background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;
  padding:16px 12px;overflow-y:auto;z-index:40;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:0 2px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--brand);
  color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:9.5px;
  letter-spacing:.5px;flex:0 0 auto}
.brand-name{font-weight:600;line-height:1.25;min-width:0}
.brand-sub{font-size:11px;opacity:.6;font-weight:400}

.nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav a,.group-toggle{display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:var(--radius-sm);color:var(--sidebar-ink);text-decoration:none;font-size:14px;
  background:transparent;border:0;width:100%;cursor:pointer;text-align:start;font-family:inherit;
  min-height:40px}
.nav a:hover,.group-toggle:hover{background:rgba(255,255,255,.07)}
.nav a:focus-visible,.group-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.nav a.active{background:var(--brand);color:var(--brand-ink);font-weight:500}
.item-icon{opacity:.72;font-size:15px;flex:0 0 auto;width:18px;text-align:center}
.nav a.active .item-icon{opacity:1}
.group-toggle{justify-content:space-between;text-transform:uppercase;font-size:11px;
  letter-spacing:.06em;opacity:.82;margin-top:10px}
.group-label{display:flex;align-items:center;gap:9px;min-width:0}
.chevron{width:7px;height:7px;border-inline-end:2px solid currentColor;
  border-block-end:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;flex:0 0 auto}
.nav-section[data-open="false"] .chevron{transform:rotate(-45deg)}
.nav-section[data-open="false"] .group-panel{display:none}
.group-panel{display:flex;flex-direction:column;gap:2px}
.nav a.sub{padding-inline-start:32px;font-size:13.5px}
.badge{margin-inline-start:auto;background:rgba(255,255,255,.13);border-radius:99px;
  padding:1px 7px;font-size:10.5px;font-weight:700;flex:0 0 auto}
.nav a.active .badge{background:rgba(0,0,0,.18)}

.sidebar-foot{border-top:1px solid var(--sidebar-line);padding-top:13px;margin-top:13px;font-size:13px}
.who{font-weight:600}
.who-role{opacity:.65;font-size:12px;margin-bottom:10px}
.foot-row{display:flex;gap:6px;margin-bottom:8px}
.foot-row select{flex:1;min-width:0;background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.14);color:var(--sidebar-ink)}
.foot-row select option{background:var(--sidebar);color:var(--sidebar-ink)}

/* ── الشريط العلوي ─────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:12px}
.burger{display:none;background:none;border:0;cursor:pointer;padding:7px;color:inherit}
.burger span,.burger::before,.burger::after{content:"";display:block;width:20px;height:2px;
  background:currentColor;margin:4px 0;border-radius:2px}
.crumb{font-weight:600;font-size:15px}
.topbar-meta{margin-inline-start:auto;font-size:12.5px;color:var(--ink-soft);
  display:flex;align-items:center;gap:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* ── رأس الصفحة ────────────────────────────────────── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:25px;margin:2px 0 4px}
.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.lede{margin:0;color:var(--ink-soft);max-width:62ch}

/* ── البطاقات ──────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:16px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15.5px}
.card-body{padding:17px}
.card-body.tight{padding:0}
.hint{color:var(--ink-soft);font-size:13px;margin:10px 0 0}
.hint:first-child{margin-top:0}

/* ── الإحصاءات ─────────────────────────────────────── */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.stat .v{font-size:26px;font-weight:600;line-height:1.25;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.acc .v{color:var(--brand)} .stat.ok .v{color:var(--ok)}
.stat.bad .v{color:var(--danger)} .stat.wrn .v{color:var(--warn)}

/* ── المقاييس ──────────────────────────────────────── */
.meter{margin-bottom:13px}
.meter:last-child{margin-bottom:0}
.meter-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:6px}
.meter-l span:last-child{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s}

/* ── الجداول ───────────────────────────────────────── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th,.data-table td{padding:10px 12px;text-align:start;
  border-bottom:1px solid var(--line);vertical-align:middle}
.data-table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-soft);font-weight:500;white-space:nowrap;background:var(--surface-2)}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--line);background:var(--surface-2)}
.data-table.rows tbody tr:hover{background:var(--surface-2)}

/* ── العلامات ──────────────────────────────────────── */
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;
  background:var(--line);color:var(--ink-soft);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.off{background:var(--danger-bg);color:var(--danger)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.acc{background:var(--brand-soft);color:var(--brand-deep)}

.alert{padding:11px 15px;border-radius:var(--radius-sm);margin-bottom:15px;font-size:14px;
  display:flex;gap:9px;align-items:flex-start}
.alert.success{background:var(--ok-bg);color:var(--ok)}
.alert.error{background:var(--danger-bg);color:var(--danger)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info)}

/* ── النماذج ───────────────────────────────────────── */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.req{color:var(--danger)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
input[type="number"]{max-width:140px}
.grid{display:grid;gap:13px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline-form input,.inline-form select{min-width:150px;width:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-size:14px;cursor:pointer;text-decoration:none;min-height:40px;white-space:nowrap}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-quiet{background:transparent;color:var(--brand);padding:6px 10px;min-height:32px}
.btn-sm{padding:5px 11px;font-size:13px;min-height:32px}
.btn-block{width:100%}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn:active{transform:scale(.985)}

/* ── الشرائح ───────────────────────────────────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;cursor:pointer;min-height:36px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:500}

/* ── الخريطة ───────────────────────────────────────── */
.mapwrap{position:relative;height:calc(100vh - 46px);background:#0A0D10;overflow:hidden}
.mapcanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-top{position:absolute;inset-block-start:11px;inset-inline:11px;display:flex;gap:7px;
  flex-wrap:wrap;z-index:5;pointer-events:auto}
.map-chip{background:rgba(18,23,28,.92);border:1px solid #2A333C;color:#E8EBEE;
  border-radius:99px;padding:7px 13px;font-size:12.5px;cursor:pointer;
  backdrop-filter:blur(6px);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.map-chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.map-fab{position:absolute;inset-block-end:16px;inset-inline-end:14px;display:flex;
  flex-direction:column;gap:8px;z-index:5;align-items:flex-end}
.map-fab .btn{box-shadow:0 6px 20px rgba(0,0,0,.45)}
.map-legend{position:absolute;inset-block-end:16px;inset-inline-start:14px;z-index:5;
  background:rgba(18,23,28,.92);border:1px solid #2A333C;border-radius:var(--radius);
  padding:10px 12px;font-size:12px;color:#C6CFD7;backdrop-filter:blur(6px)}
.lg-row{display:flex;align-items:center;gap:7px;margin:4px 0}
.lg-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

/* ── نافذة النقطة ──────────────────────────────────── */
.pop{position:absolute;inset-block-start:50%;inset-inline-start:50%;transform:translate(50%,-50%);
  width:min(340px,88vw);background:var(--raise);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:8;padding:15px}
[dir="ltr"] .pop{transform:translate(-50%,-50%)}
.pop h3{font-size:15px;color:var(--brand);margin-bottom:3px}
.pop .pid{font-size:12px;color:var(--ink-soft);font-family:ui-monospace,monospace;direction:ltr}
.pop-rows{margin:11px 0;font-size:13.5px}
.pop-rows div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--line-2)}
.pop-rows div:last-child{border-bottom:0}
.pop-rows .k{color:var(--ink-soft)}
.pop-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

/* ── القوائم والسجلات ──────────────────────────────── */
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--surface-2)}
.li-main{flex:1;min-width:0}
.li-t{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.li-end{flex:0 0 auto;text-align:end;font-size:12px;color:var(--ink-soft)}

.timeline{position:relative;padding-inline-start:22px}
.timeline::before{content:"";position:absolute;inset-block:6px;inset-inline-start:5px;
  width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;inset-inline-start:-21px;inset-block-start:5px;
  width:10px;height:10px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 0 3px var(--surface)}
.tl-t{font-size:13.5px;font-weight:500}
.tl-s{font-size:12px;color:var(--ink-soft)}

/* ── دورة الحالات ──────────────────────────────────── */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.flow-step{padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap}
.flow-step.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep);font-weight:600}
.flow-step.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.flow-arr{color:var(--ink-mute);flex:0 0 auto}

/* ── الاستجابة ─────────────────────────────────────── */
@media(max-width:900px){
  .shell{margin-inline-start:0}
  .sidebar{transform:translateX(-100%);transition:transform .22s ease}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .burger{display:block}
  .content{padding:15px}
  .page-head h1{font-size:22px}
  .mapwrap{height:calc(100vh - 46px)}
}
@media print{
  .sidebar,.topbar,.btn,.chips,.map-top,.map-fab{display:none!important}
  .shell{margin:0}
  .card{break-inside:avoid;box-shadow:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

<div id="login"></div>

<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AFAQY</div>
      <div class="brand-name" id="brandName"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="who">محمد صفوت</div>
      <div class="who-role" id="whoRole"></div>
      <div class="foot-row">
        <select id="langSel" aria-label="اللغة">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="ur">اردو</option>
        </select>
        <button type="button" class="btn btn-secondary btn-sm" id="themeBtn"
                aria-label="المظهر" style="min-width:44px">☾</button>
      </div>
      <button type="button" class="btn btn-secondary btn-block" id="outBtn"></button>
    </div>
  </aside>

  <main class="shell">
    <header class="topbar">
      <button class="burger" type="button" data-nav aria-label="القائمة"><span></span></button>
      <strong class="crumb" id="crumb"></strong>
      <span class="topbar-meta" id="syncMeta"></span>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

var LANG = 'ar';

function t(s){
  if (LANG === 'ar') return s;
  var d = D[LANG] || {};
  return (d[s] != null) ? d[s] : s;
}

function nm(v){
  var s = String(v), dg = (I18N[LANG] || I18N.ar).dig;
  if (LANG === 'ar' || LANG === 'ur'){
    s = Number(v).toLocaleString('ar-EG');
    if (LANG === 'ur') s = s.replace(/[٠-٩]/g, function(c){ return dg['٠١٢٣٤٥٦٧٨٩'.indexOf(c)]; });
    return s;
  }
  return Number(v).toLocaleString('en-US');
}

function setLang(l){
  if (!I18N[l]) return;
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir  = I18N[l].dir;
  document.body.setAttribute('data-lang', l);
  try{ localStorage.setItem('nsk14.lang', l); }catch(e){}
  render();
}

function setTheme(m){
  document.documentElement.setAttribute('data-theme', m);
  try{ localStorage.setItem('nsk14.theme', m); }catch(e){}
  var b = document.getElementById('themeBtn');
  if (b) b.textContent = (m === 'dark') ? '\u2600' : '\u263D';
}

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function N(v){ return '<span class="num">'+nm(v)+'</span>'; }

function stat(k,v,cls){
  return '<div class="stat'+(cls?' '+cls:'')+'"><div class="k">'+esc(t(k))+'</div>'
       + '<div class="v">'+v+'</div></div>';
}
function stats(list){
  return '<div class="stats">'+list.map(function(s){ return stat(s[0],s[1],s[2]); }).join('')+'</div>';
}
function meter(label,v,max){
  var p = max ? Math.min(100, Math.round(v/max*100)) : 0;
  return '<div class="meter"><div class="meter-l"><span>'+esc(t(label))+'</span>'
       + '<span>'+nm(v)+' / '+nm(max)+' · '+nm(p)+'٪</span></div>'
       + '<div class="track"><i style="width:'+p+'%"></i></div></div>';
}
function card(title, body, right){
  return '<div class="card">'
    + (title ? '<div class="card-head"><h2>'+esc(t(title))+'</h2>'+(right||'')+'</div>' : '')
    + '<div class="card-body">'+body+'</div></div>';
}
function cardFlush(title, body, right){
  return '<div class="card">'
    + (title ? '<div class="card-head"><h2>'+esc(t(title))+'</h2>'+(right||'')+'</div>' : '')
    + '<div class="card-body tight">'+body+'</div></div>';
}
function table(head, rows, foot){
  return '<div class="table-wrap"><table class="data-table rows"><thead><tr>'
    + head.map(function(h){ return '<th>'+esc(t(h))+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+c+'</td>'; }).join('')+'</tr>'; }).join('')
    + '</tbody>'
    + (foot ? '<tfoot><tr>'+foot.map(function(c){ return '<td>'+c+'</td>'; }).join('')+'</tr></tfoot>' : '')
    + '</table></div>';
}
function pill(txt, kind){ return '<span class="pill'+(kind?' '+kind:'')+'">'+esc(t(txt))+'</span>'; }
function alertBox(kind, txt){ return '<div class="alert '+kind+'"><span>'+esc(t(txt))+'</span></div>'; }
function pct(v,max){
  var p = max ? Math.round(v/max*100) : 0;
  var k = p>=100 ? 'ok' : (p>=70 ? 'warn' : 'off');
  return '<span class="pill '+k+'">'+nm(p)+'٪</span>';
}
function flow(steps, activeIdx){
  return '<div class="flow">' + steps.map(function(s,i){
    var cls = i < activeIdx ? ' done' : (i === activeIdx ? ' on' : '');
    return '<span class="flow-step'+cls+'">'+esc(t(s))+'</span>'
         + (i < steps.length-1 ? '<span class="flow-arr">\u2190</span>' : '');
  }).join('') + '</div>';
}
function btn(label, kind, extra){

/* ═══ مصدر القيم الواحد ═══
   لا قيمةَ افتراضيةً ولا رماديةً: كلُّ وزنٍ ونقطةٍ وتارجتٍ يبدأ صفرًا
   ويُضبط بيد المهندس. وما يُكتب هنا يقرؤه كلُّ ما بُني فوقه في اللحظة نفسها. */

var CFG = {
  /* أوزان الزيارة والفك — مفتاحها «المشعر|النوع» */
  w:  {},
  dw: {},

  /* التارجتات */
  tgtSurvey:0, tgtInsCamp:0, tgtInsCor:0,
  tgtPrepCamp:0, tgtPrepCor:0, tgtAsmCamp:0, tgtAsmCor:0, tgtDis:0,

  /* ثوابت النظام */
  ph:0, days:0, hours:0, daysWeek:0,
  stgCfg:0, stgVal:0, stgIns:0,

  /* المال */
  budCap:0, budApp:0,

  /* الكتالوج — مفتاحها معرّف الصنف */
  itPts:{}, itPrice:{}, itPrep:{}, itAsm:{},

  /* الطواقم — مفتاحها معرّف الطاقم */
  crewSup:{}, crewTech:{}, crewGear:{}, crewRate:{}
};

/* قراءةٌ آمنة: الصفر قيمةٌ صحيحةٌ لا غيابٌ يُستبدل */
function cfgN(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function cfgKey(k){ return (k === undefined || k === null || k === '') ? null : String(k); }
function cfgGet(path, key){
  var k = cfgKey(key), o = CFG[path];
  if (k === null) return cfgN(o);
  return cfgN(o && o[k]);
}
function cfgSet(path, key, val){
  var k = cfgKey(key);
  if (k === null) CFG[path] = cfgN(val);
  else { if (!CFG[path] || typeof CFG[path] !== 'object') CFG[path] = {}; CFG[path][k] = cfgN(val); }
}

/* الأسبوعي يُشتقّ من الشهري بأيام العمل — وصفرٌ في الأيام يعني صفرًا لا قسمةً على صفر */
function cfgWk(monthly){
  var d = cfgGet('days'), w = cfgGet('daysWeek');
  return d ? Math.round(cfgN(monthly) * (w / d)) : 0;
}

/* حقلٌ موصولٌ بالمصدر: يكتب فيه عند التحرير فينتشر أثرُه */
function cfgInput(path, key, opt){
  opt = opt || {};
  var v = cfgGet(path, key);
  return '<input type="number" inputmode="' + (opt.dec ? 'decimal' : 'numeric') + '"'
    + ' step="' + (opt.step || (opt.dec ? '0.5' : '1')) + '" min="0"'
    + (opt.max ? ' max="' + opt.max + '"' : '')
    + ' value="' + v + '"'
    + ' data-cfg="' + path + '"'
    + (cfgKey(key) !== null ? ' data-cfgk="' + esc(key) + '"' : '')
    + (opt.style ? ' style="' + opt.style + '"' : '')
    + '>';
}

/* حقلٌ مشتقٌّ لا يُكتب — الأسبوعي من الشهري */
function cfgDerived(v){
  return '<input type="number" value="' + v + '" readonly tabindex="-1"'
    + ' style="background:var(--surface-2);color:var(--ink-soft)">';
}

/* ما يُشتقّ من المصدر — تقرؤه كل الشاشات فلا رقمان يفترقان */
function T(){
  return {
    survey:   cfgGet('tgtSurvey'),
    insCamp:  cfgGet('tgtInsCamp'),  insCor:  cfgGet('tgtInsCor'),
    prepCamp: cfgGet('tgtPrepCamp'), prepCor: cfgGet('tgtPrepCor'),
    asmCamp:  cfgGet('tgtAsmCamp'),  asmCor:  cfgGet('tgtAsmCor'),
    dis:      cfgGet('tgtDis'),
    ins:      cfgGet('tgtInsCamp')  + cfgGet('tgtInsCor'),
    prep:     cfgGet('tgtPrepCamp') + cfgGet('tgtPrepCor'),
    asm:      cfgGet('tgtAsmCamp')  + cfgGet('tgtAsmCor')
  };
}
function K(){
  return {
    ph:cfgGet('ph'), days:cfgGet('days'), hours:cfgGet('hours'), daysWeek:cfgGet('daysWeek'),
    insCamp:cfgGet('insCamp'), insCor:cfgGet('insCor'),
    disOk:cfgGet('disOk'), disBad:cfgGet('disBad'),
    stgCfg:cfgGet('stgCfg'), stgVal:cfgGet('stgVal'), stgIns:cfgGet('stgIns')
  };
}

/* أرقام الكتالوج من المصدر */
function itPts(id){ return cfgGet('itPts', id); }
function itPrice(id){ return cfgGet('itPrice', id); }
function itPrep(id){ return cfgGet('itPrep', id); }
function itAsm(id){ return cfgGet('itAsm', id); }

/* الطواقم من المصدر */
function crewVal(k, f){ return cfgGet('crew' + f, k); }

/* ما لم يُضبط بعدُ — تنبيهٌ يظهر حيث يهمّ */
function cfgWarn(list){
  var miss = list.filter(function(x){ return !x[1]; });
  if (!miss.length) return '';
  return '<div class="alert warn"><span>لم يُضبط بعد: '
    + miss.map(function(x){ return esc(t(x[0])); }).join(' · ')
    + ' — القيمة صفرٌ حتى تكتبها في الإعدادات.</span></div>';
}

  var ctx = null;
  try{ ctx = cv.getContext('2d'); }catch(e){}
  if (!ctx) { cv.style.display = 'none'; return; }   /* زينة تُهمَل لا تُسقط الصفحة */
  var raf = 0, pts = [], lit = 0;
  var slow = false;
  try{ slow = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  function build(){
    var w = cv.width = cv.offsetWidth * (window.devicePixelRatio || 1);
    var h = cv.height = cv.offsetHeight * (window.devicePixelRatio || 1);
    pts = [];
    var cols = Math.max(24, Math.round(w / 26));
    var rows = Math.ceil(DATA.total / cols);
    var gx = w / (cols + 1), gy = Math.min(gx, h / (rows + 1));
    var oy = (h - gy * (rows - 1)) / 2;
    for (var i = 0; i < DATA.total; i++){
      var c = i % cols, r = Math.floor(i / cols);
      pts.push({
        x: gx * (c + 1) + (Math.sin(i * 12.9898) * gx * 0.18),
        y: oy + gy * r + (Math.cos(i * 78.233) * gy * 0.18),
        d: (i / DATA.total) + Math.abs(Math.sin(i * 4.1)) * 0.12
      });
    }
  }

  function draw(prog){
    var w = cv.width, h = cv.height, dpr = window.devicePixelRatio || 1;
    ctx.clearRect(0, 0, w, h);
    var n = 0;
    for (var i = 0; i < pts.length; i++){
      var p = pts[i], on = p.d <= prog;
      if (on) n++;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (on ? 1.9 : 1.05) * dpr, 0, 6.2832);
      ctx.fillStyle = on ? 'rgba(55,138,221,.9)' : 'rgba(90,102,115,.24)';
      ctx.fill();
      if (on && i % 17 === 0){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5.5 * dpr, 0, 6.2832);
        ctx.fillStyle = 'rgba(55,138,221,.10)';
        ctx.fill();
      }
    }
    var c = document.getElementById('lgCount');
    if (c) c.innerHTML = nm(n) + ' / ' + nm(DATA.total) + ' ' + esc(t('نقطة')) + ' · ' + esc(t('المشاعر المقدسة'));
  }

  build();
  if (slow){ draw(1); return; }

  function tick(){
    lit += 0.0055;
    if (lit > 1.12) lit = 0;
    draw(Math.min(1, lit));
    raf = requestAnimationFrame(tick);
  }
  tick();

  window.addEventListener('resize', function(){ build(); }, { passive:true });
  cv.__stop = function(){ cancelAnimationFrame(raf); };
}

/* الزاوية الذهبية توزّع الأطياف فلا يتجاور لونان متشابهان مهما كثرت الشركات */
function coColor(name){
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
  var idx = CO_LIST.indexOf(name);
  var seed = idx > -1 ? idx : h;
  return 'hsl(' + Math.round((seed * 137.508) % 360) + ',62%,58%)';
}

function mapDraw(){
  var cv = document.getElementById('mapCv');
  if (!cv) return;
  var ctx = null;
  try{ ctx = cv.getContext('2d'); }catch(e){}
  if (!ctx) return;                                  /* الخريطة تبقى بشرائحها وأسطورتها */
  var dpr = window.devicePixelRatio || 1;
  var w = cv.width = cv.offsetWidth * dpr, h = cv.height = cv.offsetHeight * dpr;
  ctx.fillStyle = '#0A0D10'; ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = 'rgba(120,132,146,.07)'; ctx.lineWidth = 1;
  for (var g = 0; g < w; g += 46 * dpr){ ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g,h); ctx.stroke(); }
  for (var g2 = 0; g2 < h; g2 += 46 * dpr){ ctx.beginPath(); ctx.moveTo(0,g2); ctx.lineTo(w,g2); ctx.stroke(); }

  var col = FIELD_MODE === 'survey' ? '#E8C34B' : '#9FB0AA';
  var clusters = [
    {cx:.30, cy:.34, n:713, r:.15},
    {cx:.66, cy:.44, n:679, r:.14},
    {cx:.72, cy:.70, n:190, r:.09},
    {cx:.44, cy:.78, n:108, r:.07},
    {cx:.22, cy:.62, n:97,  r:.06}
  ];
  var seed = 1;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  clusters.forEach(function(c){
    var shown = Math.min(c.n, 260);
    for (var i = 0; i < shown; i++){
      var a = rnd() * 6.2832, d = Math.sqrt(rnd()) * c.r;
      var x = (c.cx + Math.cos(a) * d) * w;
      var y = (c.cy + Math.sin(a) * d * 1.25) * h;
      ctx.beginPath();
      ctx.arc(x, y, 2.4 * dpr, 0, 6.2832);
      ctx.fillStyle = col;
      ctx.globalAlpha = .82;
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  ctx.font = (13 * dpr) + 'px system-ui';
  ctx.fillStyle = 'rgba(232,235,238,.6)';
  ctx.textAlign = 'center';
  [['عرفات',.30,.16],['منى',.66,.26],['قطار المشاعر',.44,.88]].forEach(function(L){
    ctx.fillText(t(L[0]), L[1] * w, L[2] * h);
  });
}

function prepAsm(pg){
  var get = pg === 'prep' ? itPrep : itAsm;
  var path = pg === 'prep' ? 'itPrep' : 'itAsm';
  var on = DATA.items.filter(function(i){ return get(i[1]) > 0; });
  var tot = on.reduce(function(a,i){ return a + get(i[1]); }, 0);
  var h = '<p class="lede" style="margin:0 0 16px">' + (pg === 'prep'
      ? 'التهيئة عملُ الورشة قبل النزول: ضبط الجهاز وعنوانه ونظامه وفحصه. وهي للأجهزة ذات الإعداد وحدها — الكاميرات والقارئات والراوترات والحساسات والجيت واي.'
      : 'التجميع تركيب ما يدخل البوكس وتوصيله قبل النزول. وهو للمكوّنات التي تُجمَّع داخله وحدها.')
    + '</p>';
  if (!on.length){
    h += card('', '<p class="hint" style="text-align:center;margin:0">'
      + (pg==='prep'?'لا أجهزة في التهيئة بعد.':'لا مكوّنات في التجميع بعد.') + '</p>');
  } else {
    h += stats([[pg==='prep'?'أجهزة في التهيئة':'مكوّنات في التجميع', N(on.length), 'acc'],
                ['إجمالي النقاط', N(tot)]])
      + cardFlush((pg==='prep'?'أجهزة التهيئة':'مكوّنات التجميع') + ' — ' + nm(on.length),
          table(['الجهاز','المنطقة','النقاط',''],
            on.map(function(i){
              return [esc(i[2]), esc(t(i[0]==='cor'?'ممر':'مخيم')),
                      cfgInput(path, i[1], { dec:1 }),
                      btn('أخرِج','btn-quiet btn-sm')];
            })),
          btn('➕ ' + (pg==='prep'?'أضِف جهازًا':'أضِف مكوّنًا'),'btn-primary btn-sm'));
  }
  h += cfgAddStage(path, pg)
     + tgtBlock(pg === 'prep' ? 'tgtPrepCamp' : 'tgtAsmCamp',
                pg === 'prep' ? 'tgtPrepCor'  : 'tgtAsmCor');
  if (pg === 'prep')
    h += '<p class="hint">الهوائي والبطارية والكابل قطعٌ سلبيةٌ لا تُهيَّأ، فلا تظهر هنا أصلًا.</p>';
  return h;
}

var UNITS = { camp:1392, cor:190 };

function crewNeed(spec, months){
  var days = cfgGet('days') * months;
  var units = UNITS[spec.zone] || 0;
  var rate = crewVal(spec.k,'Rate') || spec.rate;
  var crewDays = rate ? (units / rate) : 0;
  var crews = days ? Math.ceil(crewDays / days) : 0;
  var sup = crewVal(spec.k,'Sup'), tec = crewVal(spec.k,'Tech'), ger = crewVal(spec.k,'Gear');
  if (!sup && !tec) { sup = spec.sup; tec = spec.tech; ger = spec.gear; }
  return { units:units, crewDays:Math.round(crewDays), crews:crews,
           people:crews * (sup + tec), gear:crews * ger, sup:sup, tech:tec, rate:rate };
}

          + btn('نشر على Firestore','btn-primary btn-sm') + '</div>')

function fbRules(){
  return 'rules_version = \'2\';\n'
    + 'service cloud.firestore {\n'
    + '  match /databases/{db}/documents {\n\n'
    + '    function role() {\n'
    + '      return get(/databases/$(db)/documents/users/$(request.auth.uid)).data.role;\n'
    + '    }\n'
    + '    function crewKind() {\n'
    + '      return get(/databases/$(db)/documents/users/$(request.auth.uid)).data.kind;\n'
    + '    }\n'
    + '    function isEng()  { return role() == \'engineer\'; }\n'
    + '    function isSup()  { return role() in [\'engineer\',\'supervisor\']; }\n'
    + '    function isCrew() { return role() in [\'tech\',\'cprep\',\'casm\',\'cins\']; }\n'
    + '    function mine(d)  { return d.assignedTo == request.auth.uid; }\n\n'
    + '    match /sites/{id} {\n'
    + '      allow read:  if request.auth != null;\n'
    + '      allow write: if isSup() || (isCrew() && mine(resource.data));\n'
    + '    }\n\n'
    + '    match /tasks/{id} {\n'
    + '      allow read:   if isSup() || (isCrew() && mine(resource.data));\n'
    + '      allow create: if isSup();\n'
    + '      allow update: if isEng()\n'
    + '                    || (isCrew() && mine(resource.data)\n'
    + '                        && resource.data.kind == crewKind()\n'
    + '                        && request.resource.data.status != \'معتمد\');\n'
    + '    }\n\n'
    + '    match /inventory/{id} { allow read, write: if isEng(); }\n'
    + '    match /purchases/{id} { allow read: if isEng() || role() == \'viewer\';\n'
    + '                            allow write: if isEng(); }\n'
    + '    match /settings/{id}  { allow read: if request.auth != null;\n'
    + '                            allow write: if isEng(); }\n'
    + '    match /users/{uid} {\n'
    + '      allow read:  if isEng() || request.auth.uid == uid;\n'
    + '      allow write: if isEng();\n'
    + '    }\n\n'
    + '    // الهاتف حقلٌ محجوبٌ عن الوزارة في القاعدة\n'
    + '    match /techs/{id} {\n'
    + '      allow read: if isSup() || isCrew();\n'
    + '      allow read: if role() == \'viewer\'\n'
    + '                  && !(\'phone\' in resource.data.keys());\n'
    + '      allow write: if isEng();\n'
    + '    }\n'
    + '  }\n'
    + '}';
}

var TR_MAP = { 'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh',
  'د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z',
  'ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'a' };

function userOf(name){
  var s = String(name || '').trim().split(/\s+/)[0];
  var out = '';
  for (var i = 0; i < s.length; i++) out += (TR_MAP[s[i]] || '');
  return out ? (out[0] + '.' + out.slice(1)) : 'tech';
}

function pwGen(){
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ', b = 'abcdefghijkmnpqrstuvwxyz', c = '23456789';
  var p = '';
  for (var i = 0; i < 3; i++) p += a[Math.floor(Math.random()*a.length)];
  for (var j = 0; j < 3; j++) p += b[Math.floor(Math.random()*b.length)];
  for (var k = 0; k < 4; k++) p += c[Math.floor(Math.random()*c.length)];
  return p;
}

function isField(id){ return ['map','sites','recs','tools'].indexOf(id) > -1; }

function navHtml(){
  return NAV.map(function(s){
    if (s.solo){
      if (!seesPage(s.id)) return '';
      return '<a href="#" class="'+(CUR===s.id?'active':'')+'" data-p="'+s.id+'">'
        + '<span class="item-icon" aria-hidden="true">'+s.icon+'</span>'+esc(t(s.label))+'</a>';
    }
    var items = s.items.filter(function(i){ return seesPage(i[0]); });
    if (!items.length) return '';
    var open = items.some(function(i){ return i[0] === CUR; }) || OPEN[s.g];
    return '<div class="nav-section" data-open="'+(open?'true':'false')+'" data-g="'+esc(s.g)+'">'
      + '<button type="button" class="group-toggle" data-gt aria-expanded="'+(open?'true':'false')+'">'
      + '<span class="group-label"><span class="item-icon" aria-hidden="true">'+s.icon+'</span>'+esc(t(s.g))+'</span>'
      + '<span class="chevron" aria-hidden="true"></span></button><div class="group-panel">'
      + items.map(function(i){
          return '<a href="#" class="sub'+(CUR===i[0]?' active':'')+'" data-p="'+i[0]+'">'+esc(t(i[1]))+'</a>';

function render(){
  if (!seesPage(CUR)){
    var n = R().nav;
    CUR = (n === '*') ? 'map' : n[0];
  }
  var p = FIELD_PAGES[CUR] || PAGE[CUR];
  if (!p) p = PAGE.over;

  document.getElementById('nav').innerHTML = navHtml();
  document.getElementById('crumb').textContent = t(p.t);
  document.getElementById('brandName').innerHTML =
      esc(t('قارئات نُسُك')) + '<div class="brand-sub">' + esc(t('حج ١٤٤٨هـ')) + '</div>';

  /* التصدير مكانه المتابعة: الوزارة تُصدّر تقاريرها وإن لم تملك التصدير الكامل */
  var head = p.full ? '' : pageHead(p.m, p.t, p.l,
    (p.m === 'المتابعة' || may('exportAll'))
      ? btn('تصدير','btn-secondary',' data-exp="1"') : '');

  if (CUR === 'map'){ mapDraw(); if (POP_OPEN) c.insertAdjacentHTML('beforeend', popHtml()); }

  window.scrollTo(0, 0);
}

  var lg = document.getElementById('login');

    var cv = document.getElementById('loginCv');

    lg.remove();
  }
  document.getElementById('app').style.display = '';

document.addEventListener('click', function(e){
  var a = e.target.closest('[data-p]');
  if (a){
    e.preventDefault();
    CUR = a.getAttribute('data-p');
    document.body.classList.remove('nav-open');
    render();
    return;
  }
  var g = e.target.closest('[data-gt]');
  if (g){
    var sec = g.closest('.nav-section');
    var key = sec.getAttribute('data-g');
    var open = sec.getAttribute('data-open') !== 'false';
    OPEN[key] = !open;
    sec.setAttribute('data-open', open ? 'false' : 'true');
    g.setAttribute('aria-expanded', open ? 'false' : 'true');
    return;
  }
  if (e.target.closest('[data-nav]')) { document.body.classList.toggle('nav-open'); return; }
  var m = e.target.closest('[data-mode]');
  if (m){ FIELD_MODE = m.getAttribute('data-mode'); render(); return; }

  var pk = e.target.closest('[data-pop]');
  if (pk){ POP_OPEN = pk.getAttribute('data-pop') === '1'; render(); return; }
  if (CUR === 'map' && e.target.closest('.mapcanvas')){ POP_OPEN = true; render(); return; }

  if (e.target.closest('[data-print]')){ try{ window.print(); }catch(err){} return; }

  var b = e.target.closest('.btn, .chip');
  if (b && !b.closest('#nav') && !b.hasAttribute('href')){
    var acts = ['data-p','data-exp','data-co','data-cogo','data-role','data-print',
                'data-pop','data-mode','data-expall','data-nav','data-gt','data-crew','data-cfgp','data-months','data-mkone','data-mkall'];
    var wired = acts.some(function(a){ return b.hasAttribute(a); });
    if (!wired){
      if (b.classList.contains('chip') && !b.closest('.map-top')){
        b.classList.toggle('on');   /* الشرائح اختيارٌ فعلي لا رسالة */
        return;
      }
      toast(b.textContent.trim());
      return;
    }
  }

  var mk = e.target.closest('[data-mkone]');
  if (mk){ mkAccount(+mk.getAttribute('data-mkone')); render(); return; }
  if (e.target.closest('[data-mkall]')){
    TECHS.forEach(function(x, i){ if (!x.has) mkAccount(i); });
    render(); return;
  }

  var mo = e.target.closest('[data-months]');
  if (mo){ PLAN_MONTHS = +mo.getAttribute('data-months'); render(); return; }

  var cw = e.target.closest('[data-crew]');
  if (cw){ CREW_VIEW = cw.getAttribute('data-crew'); render(); return; }

  var rl = e.target.closest('[data-role]');
  if (rl){ ROLE = rl.getAttribute('data-role'); OPEN = {}; render(); return; }

  var co = e.target.closest('[data-co]');
  if (co){ CO_OPEN = co.getAttribute('data-co') === '1'; render(); return; }
  var cg = e.target.closest('[data-cogo]');
  if (cg){
    if (cg.getAttribute('data-cogo') === '1'){
      CO_SEL = Array.prototype.filter.call(document.querySelectorAll('.coRow'), function(r){
        return r.querySelector('.coCk').checked;
      }).map(function(r){ return r.getAttribute('data-c'); });
    } else { CO_SEL = []; }
    CO_OPEN = false; render(); return;
  }
  var ex = e.target.closest('[data-exp]');
  if (ex){ EXP_OPEN = ex.getAttribute('data-exp') === '1'; render(); return; }
  var ea = e.target.closest('[data-expall]');
  if (ea){
    var on = ea.getAttribute('data-expall') === '1';
    Array.prototype.forEach.call(document.querySelectorAll('.expCk'), function(c){ c.checked = on; });
    return;
  }
});

function toast(label){
  var old = document.getElementById('nskToast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.id = 'nskToast';
  el.setAttribute('role','status');
  el.textContent = label + ' — ' + t('في المعاينة: لا فعل حقيقي');
  el.style.cssText = 'position:fixed;inset-block-end:20px;inset-inline:0;margin-inline:auto;'
    + 'width:max-content;max-width:88vw;background:var(--sidebar);color:var(--sidebar-ink);'
    + 'padding:11px 18px;border-radius:99px;font-size:13px;z-index:200;'
    + 'box-shadow:0 8px 28px rgba(0,0,0,.45);text-align:center';
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 2200);
}

document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || !el.hasAttribute || !el.hasAttribute('data-cfg')) return;
  cfgSet(el.getAttribute('data-cfg'), el.getAttribute('data-cfgk'), el.value);
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.hasAttribute || !el.hasAttribute('data-cfg')) return;
  cfgSet(el.getAttribute('data-cfg'), el.getAttribute('data-cfgk'), el.value);
  var path = el.getAttribute('data-cfg'), key = el.getAttribute('data-cfgk');
  render();                                   /* ينتشر الأثر في كل ما بُني فوقه */
  var back = document.querySelector('[data-cfg="' + path + '"]'
    + (key ? '[data-cfgk="' + CSS.escape(key) + '"]' : ':not([data-cfgk])'));
  if (back){ back.focus(); try{ back.select(); }catch(err){} }
});

window.addEventListener('resize', function(){ if (CUR === 'map') mapDraw(); }, { passive:true });

(function boot(){
  var th = 'light', lg = 'ar';
  try{ th = localStorage.getItem('nsk14.theme') || 'light'; lg = localStorage.getItem('nsk14.lang') || 'ar'; }catch(e){}
  setTheme(th);
  LANG = I18N[lg] ? lg : 'ar';
  document.documentElement.lang = LANG;
  document.documentElement.dir  = I18N[LANG].dir;
  document.body.setAttribute('data-lang', LANG);

  document.getElementById('langSel').value  = LANG;
  document.getElementById('langSel').onchange = function(){ setLang(this.value); };
  document.getElementById('themeBtn').onclick = function(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
  loginPaint();
})();

(function(){var s=document.createElement('style');s.textContent=LOGIN_CSS;document.head.appendChild(s);})();

</script>
</body>
</html>

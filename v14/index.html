<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#185FA5">
<title>قارئات نُسُك — معاينة V14</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   نُسُك V14 — نظام التصميم
   وضعان: فاتح للإدارة على المكتب · داكن للميدان تحت الشمس
   والاتجاه ينقلب مع dir بالخصائص المنطقية وحدها
   ═══════════════════════════════════════════════════════════════════ */

:root{
  --bg:#f4f6f8; --surface:#fff; --surface-2:#f8fafb; --raise:#fff;
  --ink:#14181d; --ink-soft:#5b6673; --ink-mute:#8a939d;
  --line:#e2e6ea; --line-2:#eef1f4;
  --brand:#185FA5; --brand-ink:#fff; --brand-soft:#E6F1FB; --brand-deep:#0C447C;
  --danger:#b3261e; --danger-bg:#fdecea;
  --ok:#1d7a3d; --ok-bg:#e8f5ec;
  --warn:#8a5300; --warn-bg:#fdf1de;
  --info:#0b5f7a; --info-bg:#e3f4f8;
  --sidebar:#101a1f; --sidebar-ink:#d7dde2; --sidebar-line:rgba(255,255,255,.1);
  --radius:10px; --radius-sm:8px;
  /* سلّم الطبقات — معلنٌ في مكانٍ واحدٍ فلا يتسلّق أحدٌ فوق أحد */
  --z-map:1;      --z-map-ui:600;  --z-topbar:1200;
  --z-veil:1300;  --z-side:1400;   --z-pop:1500;  --z-toast:1600;
  --shadow:0 1px 2px rgba(20,24,29,.06);
  --sw:264px;
}
[data-theme="dark"]{
  --bg:#0A0D10; --surface:#12171c; --surface-2:#0F1418; --raise:#171D23;
  --ink:#E8EBEE; --ink-soft:#9BA5AF; --ink-mute:#6C757E;
  --line:#232B33; --line-2:#1B222A;
  --brand:#378ADD; --brand-ink:#04121f; --brand-soft:#12263A; --brand-deep:#9CC8F5;
  --danger:#F0837B; --danger-bg:#2A1512;
  --ok:#5FD08A; --ok-bg:#0F2418;
  --warn:#E7B45C; --warn-bg:#2A1F0D;
  --info:#6FC9E0; --info-bg:#0D2229;
  --sidebar:#0C1216; --sidebar-ink:#C6CFD7; --sidebar-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body[data-lang="ur"]{font-family:"Noto Nastaliq Urdu",system-ui,sans-serif;line-height:1.9}
a{color:var(--brand)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── الهيكل ───────────────────────────────────────── */
.shell{margin-inline-start:var(--sw);min-height:100dvh;display:flex;flex-direction:column}
.content{padding:22px;max-width:1200px;width:100%;flex:1}
.content.flush{padding:0;max-width:none}

.sidebar{position:fixed;inset-block:0;inset-inline-start:0;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  width:min(var(--sw), 86vw); max-width:340px;
  background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;
  padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  z-index:var(--z-side);overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:0 2px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--brand);
  color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:9.5px;
  letter-spacing:.5px;flex:0 0 auto}
.brand-name{font-weight:600;line-height:1.25;min-width:0}
.brand-sub{font-size:11px;opacity:.6;font-weight:400}

.nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav a,.group-toggle{display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:var(--radius-sm);color:var(--sidebar-ink);text-decoration:none;font-size:14px;
  background:transparent;border:0;width:100%;cursor:pointer;text-align:start;font-family:inherit;
  min-height:40px}
.nav a:hover,.group-toggle:hover{background:rgba(255,255,255,.07)}
.nav a:focus-visible,.group-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.nav a.active{background:var(--brand);color:var(--brand-ink);font-weight:500}
.item-icon{opacity:.72;font-size:15px;flex:0 0 auto;width:18px;text-align:center}
.nav a.active .item-icon{opacity:1}
.group-toggle{justify-content:space-between;text-transform:uppercase;font-size:11px;
  letter-spacing:.06em;opacity:.82;margin-top:10px}
.group-label{display:flex;align-items:center;gap:9px;min-width:0}
.chevron{width:7px;height:7px;border-inline-end:2px solid currentColor;
  border-block-end:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;flex:0 0 auto}
.nav-section[data-open="false"] .chevron{transform:rotate(-45deg)}
.nav-section[data-open="false"] .group-panel{display:none}
.group-panel{display:flex;flex-direction:column;gap:2px}
.nav a.sub{padding-inline-start:32px;font-size:13.5px}
.badge{margin-inline-start:auto;background:rgba(255,255,255,.13);border-radius:99px;
  padding:1px 7px;font-size:10.5px;font-weight:700;flex:0 0 auto}
.nav a.active .badge{background:rgba(0,0,0,.18)}

.sidebar-foot{border-top:1px solid var(--sidebar-line);padding-top:13px;margin-top:13px;font-size:13px}
.who{font-weight:600}
.who-role{opacity:.65;font-size:12px;margin-bottom:10px}
.foot-row{display:flex;gap:6px;margin-bottom:8px}
.foot-row select{flex:1;min-width:0;background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.14);color:var(--sidebar-ink)}
.foot-row select option{background:var(--sidebar);color:var(--sidebar-ink)}

/* ── الشريط العلوي ─────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:var(--z-topbar);background:var(--surface);
  padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:12px}
.burger{display:none;background:none;border:0;cursor:pointer;padding:7px;color:inherit}
.burger span,.burger::before,.burger::after{content:"";display:block;width:20px;height:2px;
  background:currentColor;margin:4px 0;border-radius:2px}
.crumb{font-weight:600;font-size:15px}
.topbar-meta{margin-inline-start:auto;font-size:12.5px;color:var(--ink-soft);
  display:flex;align-items:center;gap:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* ── رأس الصفحة ────────────────────────────────────── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:25px;margin:2px 0 4px}
.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.lede{margin:0;color:var(--ink-soft);max-width:62ch}

/* ── البطاقات ──────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:16px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15.5px}
.card-body{padding:17px}
.card-body.tight{padding:0}
.hint{color:var(--ink-soft);font-size:13px;margin:10px 0 0}
.hint:first-child{margin-top:0}

/* ── الإحصاءات ─────────────────────────────────────── */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.stat .v{font-size:26px;font-weight:600;line-height:1.25;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.acc .v{color:var(--brand)} .stat.ok .v{color:var(--ok)}
.stat.bad .v{color:var(--danger)} .stat.wrn .v{color:var(--warn)}

/* ── المقاييس ──────────────────────────────────────── */
.meter{margin-bottom:13px}
.meter:last-child{margin-bottom:0}
.meter-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:6px}
.meter-l span:last-child{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s}

/* ── الجداول ───────────────────────────────────────── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th,.data-table td{padding:10px 12px;text-align:start;
  border-bottom:1px solid var(--line);vertical-align:middle}
.data-table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-soft);font-weight:500;white-space:nowrap;background:var(--surface-2)}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--line);background:var(--surface-2)}
.data-table.rows tbody tr:hover{background:var(--surface-2)}

/* ── العلامات ──────────────────────────────────────── */
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;
  background:var(--line);color:var(--ink-soft);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.off{background:var(--danger-bg);color:var(--danger)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.acc{background:var(--brand-soft);color:var(--brand-deep)}

.alert{padding:11px 15px;border-radius:var(--radius-sm);margin-bottom:15px;font-size:14px;
  display:flex;gap:9px;align-items:flex-start}
.alert.success{background:var(--ok-bg);color:var(--ok)}
.alert.error{background:var(--danger-bg);color:var(--danger)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info)}

/* ── النماذج ───────────────────────────────────────── */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.req{color:var(--danger)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
input[type="number"]{max-width:140px}
.grid{display:grid;gap:13px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline-form input,.inline-form select{min-width:150px;width:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-size:14px;cursor:pointer;text-decoration:none;min-height:40px;white-space:nowrap}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-quiet{background:transparent;color:var(--brand);padding:7px 11px;min-height:36px}
.btn-sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn-block{width:100%}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn:active{transform:scale(.985)}

/* ── الشرائح ───────────────────────────────────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;cursor:pointer;min-height:36px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:500}

/* ── الخريطة ───────────────────────────────────────── */
.mapwrap{position:relative;height:calc(100dvh - 46px);background:#0A0D10;overflow:hidden}
.mapcanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-top{position:absolute;inset-inline:11px;display:flex;gap:7px;
  inset-block-start:calc(11px + env(safe-area-inset-top,0px));
  max-width:calc(100% - 22px);overflow-x:auto;scrollbar-width:none;
  flex-wrap:wrap;z-index:var(--z-map-ui);pointer-events:auto}
.map-chip{background:rgba(18,23,28,.92);border:1px solid #2A333C;color:#E8EBEE;
  border-radius:99px;padding:7px 13px;font-size:12.5px;cursor:pointer;
  backdrop-filter:blur(6px);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.map-chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.map-fab{position:absolute;inset-block-end:16px;inset-inline-end:14px;display:flex;
  flex-direction:column;gap:8px;z-index:var(--z-map-ui);align-items:flex-end}
.map-fab .btn{box-shadow:0 6px 20px rgba(0,0,0,.45)}
.map-legend{position:absolute;inset-block-end:16px;inset-inline-start:14px;z-index:var(--z-map-ui);
  background:rgba(18,23,28,.92);border:1px solid #2A333C;border-radius:var(--radius);
  padding:10px 12px;font-size:12px;color:#C6CFD7;backdrop-filter:blur(6px)}
.lg-row{display:flex;align-items:center;gap:7px;margin:4px 0}
.lg-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

/* ── نافذة النقطة ──────────────────────────────────── */
.pop{position:absolute;inset-block-start:50%;inset-inline-start:50%;transform:translate(50%,-50%);
  width:min(340px,88vw);background:var(--raise);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:var(--z-pop);padding:15px}
[dir="ltr"] .pop{transform:translate(-50%,-50%)}
.pop h3{font-size:15px;color:var(--brand);margin-bottom:3px}
.pop .pid{font-size:12px;color:var(--ink-soft);font-family:ui-monospace,monospace;direction:ltr}
.pop-rows{margin:11px 0;font-size:13.5px}
.pop-rows div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--line-2)}
.pop-rows div:last-child{border-bottom:0}
.pop-rows .k{color:var(--ink-soft)}
.pop-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

/* ── القوائم والسجلات ──────────────────────────────── */
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--surface-2)}
.li-main{flex:1;min-width:0}
.li-t{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.li-end{flex:0 0 auto;text-align:end;font-size:12px;color:var(--ink-soft)}

.timeline{position:relative;padding-inline-start:22px}
.timeline::before{content:"";position:absolute;inset-block:6px;inset-inline-start:5px;
  width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;inset-inline-start:-21px;inset-block-start:5px;
  width:10px;height:10px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 0 3px var(--surface)}
.tl-t{font-size:13.5px;font-weight:500}
.tl-s{font-size:12px;color:var(--ink-soft)}

/* ── دورة الحالات ──────────────────────────────────── */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.flow-step{padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap}
.flow-step.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep);font-weight:600}
.flow-step.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.flow-arr{color:var(--ink-mute);flex:0 0 auto}

/* ── الاستجابة ─────────────────────────────────────── */
@media(max-width:900px){
  .shell{margin-inline-start:0}
  .sidebar{transform:translateX(-100%);transition:transform .22s ease}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  body.nav-open .sidebar{transform:translateX(0)}
  #navVeil{display:none}
  body.nav-open #navVeil{display:block;position:fixed;inset:0;
    background:rgba(0,0,0,.55);z-index:var(--z-veil);
    -webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px)}
  .burger{display:block}
  .content{padding:15px}
  .page-head h1{font-size:22px}
  .mapwrap{height:calc(100dvh - 46px)}
  .content{padding-bottom:calc(15px + env(safe-area-inset-bottom,0px))}
}
@media print{
  .sidebar,.topbar,.btn,.chips,.map-top,.map-fab{display:none!important}
  .shell{margin:0}
  .card{break-inside:avoid;box-shadow:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══ الخريطة الحقيقية ═══ */
#mapBox{background:#0A0D10}
#mapBox.tdark .nskBase{filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(1.06) saturate(.7)}
#mapBox .leaflet-control-zoom a{background:rgba(18,23,28,.94);color:#E8EBEE;border-color:#2A333C}
#mapBox .leaflet-control-attribution{background:rgba(18,23,28,.8);color:#8A939D;font-size:10px}
#mapBox .leaflet-control-attribution a{color:#6FA8DC}

.map-badge{position:absolute;inset-inline-start:14px;z-index:var(--z-map-ui);
  background:rgba(18,23,28,.92);border:1px solid #2A333C;color:#C6CFD7;
  border-radius:99px;padding:7px 13px;font-size:12px;backdrop-filter:blur(6px);
  min-height:36px;display:inline-flex;align-items:center;gap:5px}

/* Leaflet يرفع طبقاته إلى ألف — تُحبَس تحت الشل */
#mapBox .leaflet-pane,#mapBox .leaflet-top,#mapBox .leaflet-bottom{z-index:var(--z-map-ui)}
#mapBox .leaflet-control-container{z-index:var(--z-map-ui)}
.mapwrap{isolation:isolate;z-index:var(--z-map)}
body.nav-open .mapwrap{pointer-events:none}

/* ═══ شرائح التصنيف ═══ */
.catbar{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.catrow{display:flex;gap:7px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;
  border:1.5px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;
  min-height:36px;white-space:nowrap;color:var(--ink)}
.cat .n{font-variant-numeric:tabular-nums;opacity:.75;font-size:12px}
.cat.on{font-weight:600}
.cat.zone.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cat.zone.on .n{opacity:.9}

.map-sheet{position:absolute;inset-block-start:54px;inset-inline:11px;z-index:var(--z-map-ui);
  max-height:58vh;overflow:auto;background:rgba(14,18,22,.97);border:1px solid #2A333C;
  border-radius:var(--radius);padding:13px;backdrop-filter:blur(10px);
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
.map-sheet .catbar{margin:0}
.map-sheet .cat{background:#161C22;color:#E8EBEE;border-color:#2A333C;
  font-size:12.5px;padding:7px 12px;min-height:36px}
.map-sheet .cat.zone.on{background:var(--brand);border-color:var(--brand);color:#fff}
#mapBox.sat .nskBase{filter:none}

.map-selbar{position:absolute;inset-inline:11px;z-index:calc(var(--z-map-ui) + 2);
  inset-block-end:calc(190px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;background:rgba(58,214,160,.95);color:#04120c;
  border-radius:var(--radius);padding:10px 14px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 26px rgba(0,0,0,.4);flex-wrap:wrap}
.map-selbar .btn{min-height:36px;padding:6px 13px;font-size:12.5px}

.map-layerbar .lb-t{font-weight:800}
.map-layerbar .lb-n{color:#C6CFD7;font-variant-numeric:tabular-nums}

.nav-x{display:none;width:38px;height:38px;min-height:38px;flex:0 0 auto;

  height:calc(100dvh - 46px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@media(min-width:901px){
  #mapWrap{height:calc(100dvh - 62px - env(safe-area-inset-top,0px))}
}
#mapBox{position:absolute;inset:0}
#mapUI{position:absolute;inset:0;pointer-events:none;z-index:var(--z-map-ui)}
#mapUI > *{pointer-events:auto}
#mapUI .pop{pointer-events:auto}
.content[hidden]{display:none}

.map-top::-webkit-scrollbar{display:none}
.map-top .map-chip{flex:0 0 auto}

/* الرسالةُ فوق أزرارِ الزاوية لا تحتها — ولا تحجب موقعي */
#nskToast{inset-block-end:calc(120px + env(safe-area-inset-bottom,0px))!important}
.map-fab{inset-block-end:calc(16px + env(safe-area-inset-bottom,0px))}
.map-legend{inset-block-end:calc(16px + env(safe-area-inset-bottom,0px))}
.map-badge{inset-block-end:calc(78px + env(safe-area-inset-bottom,0px))}

/* في الوضع المثبَّت لا شريطَ متصفّحٍ يحمي الحواف */
@media(display-mode:standalone){

}

.map-busy .map-legend,.map-busy .map-badge{display:none}
.map-busy .map-layerbar{inset-block-end:calc(96px + env(safe-area-inset-bottom,0px))}
@media(max-width:560px){
  .map-selbar{inset-block-end:calc(160px + env(safe-area-inset-bottom,0px));font-size:11.5px}

var LANG = 'ar';

function t(s){
  if (LANG === 'ar') return s;
  var d = D[LANG] || {};
  return (d[s] != null) ? d[s] : s;
}

function nm(v){
  var s = String(v), dg = (I18N[LANG] || I18N.ar).dig;
  if (LANG === 'ar' || LANG === 'ur'){
    s = Number(v).toLocaleString('ar-EG');
    if (LANG === 'ur') s = s.replace(/[٠-٩]/g, function(c){ return dg['٠١٢٣٤٥٦٧٨٩'.indexOf(c)]; });
    return s;
  }
  return Number(v).toLocaleString('en-US');
}

function setLang(l){
  if (!I18N[l]) return;
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir  = I18N[l].dir;
  document.body.setAttribute('data-lang', l);
  try{ localStorage.setItem('nsk14.lang', l); }catch(e){}
  render();
  var lt = document.getElementById('langTop');
  if (lt) lt.textContent = { ar:'ع', en:'EN', ur:'اُر' }[l] || 'ع';

}

function setTheme(m){
  document.documentElement.setAttribute('data-theme', m);
  try{ localStorage.setItem('nsk14.theme', m); }catch(e){}
  var b = document.getElementById('themeBtn');
  if (b) b.textContent = (m === 'dark') ? '\u2600' : '\u263D';
  var b2 = document.getElementById('themeTop');
  if (b2) b2.textContent = (m === 'dark') ? '\u2600' : '\u263D';
  try{ if (typeof mapTheme === 'function') mapTheme(); }catch(e){}
}

/* قراءةٌ آمنة: الصفر قيمةٌ صحيحةٌ لا غيابٌ يُستبدل */
function cfgN(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function cfgKey(k){ return (k === undefined || k === null || k === '') ? null : String(k); }
function cfgGet(path, key){
  var k = cfgKey(key), o = CFG[path];
  if (k === null) return cfgN(o);
  return cfgN(o && o[k]);
}
function cfgSet(path, key, val){
  if (typeof CFG_VER === 'number') CFG_VER++;
  var k = cfgKey(key);
  if (k === null) CFG[path] = cfgN(val);
  else { if (!CFG[path] || typeof CFG[path] !== 'object') CFG[path] = {}; CFG[path][k] = cfgN(val); }
}

/* الأسبوعي يُشتقّ من الشهري بأيام العمل — وصفرٌ في الأيام يعني صفرًا لا قسمةً على صفر */
function cfgWk(monthly){
  var d = cfgGet('days'), w = cfgGet('daysWeek');
  return d ? Math.round(cfgN(monthly) * (w / d)) : 0;

/* ── المخزن المحلي: IndexedDB وإن تعذّر فذاكرةٌ حيّة ── */
var IDB_NAME = 'nusuk-v14', IDB_STORE = 'kv', _idb = null, _mem = null;

function idbOpen(){
  if (_idb) return Promise.resolve(_idb);
  if (_mem)  return Promise.reject(new Error('mem-mode'));
  return new Promise(function(res, rej){
    var done = false;
    var t = setTimeout(function(){
      if (!done){ done = true; _mem = new Map(); rej(new Error('idb-timeout')); }
    }, 4000);
    var q;
    try { q = indexedDB.open(IDB_NAME, 1); }
    catch(e){ clearTimeout(t); done = true; _mem = new Map(); rej(e); return; }
    q.onupgradeneeded = function(){ q.result.createObjectStore(IDB_STORE); };
    q.onsuccess = function(){ if (done) return; done = true; clearTimeout(t); _idb = q.result; res(_idb); };
    q.onerror   = function(){ if (done) return; done = true; clearTimeout(t); _mem = new Map(); rej(q.error); };
  });
}

function idbGet(k){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(k);
      r.onsuccess = function(){ res(r.result); };
      r.onerror   = function(){ rej(r.error); };
    });
  }).catch(function(){ return _mem ? _mem.get(k) : undefined; });
}

function idbSet(k, v){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(v, k);
      tx.oncomplete = function(){ res(true); };
      tx.onerror    = function(){ rej(tx.error); };
    });
  }).catch(function(){ if (_mem) _mem.set(k, v); return false; });
}

  meta:    { lastSync:0, uid:'', role:'', name:'', online:false }
};

var QUEUE_CAP = 2000, _saveT = 0;

var CORE = {
  get:  function(kind, id){ var b = STATE[kind]; return b ? b[id] : undefined; },
  all:  function(kind){ return STATE[kind]; },
  set:  function(kind, id, v){
    if (!STATE[kind]) STATE[kind] = {};
    STATE[kind][id] = v;
    CORE.dirty(kind, id, v);
    return v;
  },
  rm:   function(kind, id){ delete STATE[kind][id]; CORE.dirty(kind, id, null); },
  push: function(kind, v){ STATE[kind].push(v); CORE.dirty(kind, v.id || String(STATE[kind].length-1), v); return v; },
  total:function(){ return STATE.sites.length; },

  /* كل تغييرٍ يدخل الطابور. والحفظُ مؤجَّلٌ: خمسون كتابةً حفظٌ واحدٌ بعد سكون،
     فلا يُثقَل القرصُ بخمسين كتابةً كاملةً للحالة. والطابور محدودٌ بألفين
     فلا يملأ الذاكرةَ انقطاعٌ طويل — وأقدمُه يُسقَط أولًا مع تحذير. */
  dirty: function(kind, id, v){
    if (typeof statBump === 'function') statBump();
    STATE.queue.push({ kind:kind, id:id, v:v, at:Date.now() });
    if (STATE.queue.length > QUEUE_CAP){
      STATE.queue = STATE.queue.slice(-QUEUE_CAP);
      STATE.meta.dropped = (STATE.meta.dropped || 0) + 1;
    }
    CORE.saveSoon();
    CORE.flush();
  },

  /* حفظٌ مؤجَّل — يُجمَّع ما تتابع من كتابات */
  saveSoon: function(){
    if (_saveT) return;
    _saveT = setTimeout(function(){ _saveT = 0; CORE.saveLocal(); }, 400);
  },

  saveLocal: function(){
    return idbSet('state', {
      recs:STATE.recs, inss:STATE.inss, tasks:STATE.tasks,
      moves:STATE.moves, buys:STATE.buys, cfg:CFG, queue:STATE.queue
    });
  },

  loadLocal: function(){
    return idbGet('state').then(function(v){
      if (!v) return false;
      ['recs','inss','tasks','moves','buys','queue'].forEach(function(k){
        if (v[k]) STATE[k] = v[k];
      });
      if (v.cfg) Object.keys(v.cfg).forEach(function(k){ CFG[k] = v.cfg[k]; });
      return true;
    }).catch(function(){ return false; });
  },

  /* الرفع — يُحاوَل ويُترك الطابور إن فشل */
  flush: function(){
    if (!STATE.meta.online || !STATE.queue.length) return Promise.resolve(0);
    var batch = STATE.queue.slice(0, 50);
    return FB.push(batch).then(function(){
      STATE.queue = STATE.queue.slice(batch.length);
      STATE.meta.lastSync = Date.now();
      CORE.saveLocal();
      syncBadge();
      return batch.length;
    }).catch(function(){ return 0; });
  },

  pending: function(){ return STATE.queue.length; }
};

/* ── جسر Firebase — يُحمَّل كسولًا فلا يُعطّل الإقلاع ── */
var FB = {
  app:null, auth:null, db:null, ready:false,

  init: function(){
    if (FB.ready) return Promise.resolve(true);
    if (typeof window === 'undefined' || !window.firebase) return Promise.resolve(false);
    try {
      FB.app  = window.firebase.initializeApp(FB_CFG);
      FB.auth = window.firebase.auth();
      FB.db   = window.firebase.firestore();
      FB.ready = true;
      return Promise.resolve(true);
    } catch(e){ return Promise.resolve(false); }
  },

  signIn: function(user, pass){
    return FB.init().then(function(ok){
      if (!ok) return { ok:false, err:'offline' };
      var email = user.indexOf('@') > -1 ? user : (user + '@nusuk.local');
      return FB.auth.signInWithEmailAndPassword(email, pass)
        .then(function(c){
          STATE.meta.uid = c.user.uid;
          STATE.meta.online = true;
          return FB.db.collection('users').doc(c.user.uid).get();
        })
        .then(function(doc){
          var u = (doc && doc.exists) ? doc.data() : {};
          STATE.meta.role = u.role || 'tech';
          STATE.meta.name = u.name || user;
          STATE.meta.kind = u.kind || '';
          return { ok:true, role:STATE.meta.role, name:STATE.meta.name };
        })
        .catch(function(e){ return { ok:false, err:String(e && e.code || e) }; });
    });
  },

  push: function(batch){
    if (!FB.ready) return Promise.reject(new Error('not-ready'));
    var w = FB.db.batch();
    batch.forEach(function(it){
      var col = { recs:'recs', inss:'inss', tasks:'tasks', moves:'inventory',
                  buys:'purchases', cfg:'settings', users:'users' }[it.kind] || 'misc';
      var ref = FB.db.collection(col).doc(String(it.id));
      if (it.v === null) w.delete(ref);
      else w.set(ref, Object.assign({}, it.v, { _by:STATE.meta.uid, _at:Date.now() }), { merge:true });
    });
    return w.commit();
  },

  /* ── جسرُ النسخة العاملة: يُقرأ ما كُتب بأسمائها القديمة ── */
  pullLegacy: function(){
    if (!FB.ready || !FB.db) return Promise.resolve(0);
    var got = 0;
    var MAP = {
      srvorders: function(id, v){
        /* أمرُ الخدمة القديم: مسحٌ أو تركيبٌ بحسب نوعه */
        if (v.kind === 'install' || v.type === 'تركيب'){
          if (!STATE.inss[v.site || id]) STATE.inss[v.site || id] = v;
        } else if (!STATE.recs[v.site || id]) STATE.recs[v.site || id] = v;
        got++;
      },
      events: function(id, v){ STATE.events.push(v); got++; },
      hb:     function(id, v){ STATE.hb = STATE.hb || {}; STATE.hb[id] = v; got++; },
      hbev:   function(id, v){ STATE.hb = STATE.hb || {}; STATE.hb[id] = v; got++; }
    };
    return Promise.all(Object.keys(MAP).map(function(c){
      return FB.db.collection(c).limit(2000).get().then(function(snap){
        snap.forEach(function(doc){ try{ MAP[c](doc.id, doc.data()); }catch(e){} });
      }).catch(function(){});
    })).then(function(){
      if (got){
        statBump();
        CORE.saveSoon();
        try{ localStorage.setItem('nsk14.legacy', '1'); }catch(e){}
        logEvent('استيراد من النسخة العاملة — ' + nm(got) + ' سجلًّا');
      }
      return got;
    });
  },

  legacyDone: function(){
    try{ return localStorage.getItem('nsk14.legacy') === '1'; }catch(e){ return false; }
  },

  pull: function(){
    if (!FB.ready) return Promise.resolve(false);
    return Promise.all(['recs','inss','tasks'].map(function(c){
      return FB.db.collection(c).get().then(function(snap){
        var o = {};
        snap.forEach(function(d){ o[d.id] = d.data(); });
        STATE[c] = o;
      });
    })).then(function(){
      return FB.db.collection('settings').doc('points').get();
    }).then(function(doc){
      if (doc && doc.exists){
        var v = doc.data();
        Object.keys(v).forEach(function(k){ if (k in CFG) CFG[k] = v[k]; });
      }
      STATE.meta.lastSync = Date.now();
      return true;
    }).catch(function(){ return false; });
  }
};

/* ── مؤشّر المزامنة في الشريط العلوي ── */
function syncBadge(){
  var el = document.getElementById('syncMeta');
  if (!el) return;
  var n = CORE.pending();
  var on = STATE.meta.online;
  var ts = STATE.meta.lastSync
    ? new Date(STATE.meta.lastSync).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'ar-EG',
        { hour:'2-digit', minute:'2-digit' })
    : '—';
  el.innerHTML = '<span class="dot" style="background:'
    + (on ? 'var(--ok)' : 'var(--danger)') + '"></span>'
    + (n ? '<span class="pill warn">' + nm(n) + ' ' + esc(t('بانتظار الرفع')) + '</span> '
         : '')
    + (STATE.meta.dropped
        ? '<span class="pill off">' + esc(t('أُسقط من الطابور')) + '</span> ' : '')
    + esc(t('آخر مزامنة')) + ' <span class="num">' + esc(ts) + '</span>';
}

/* ── الاتصال — يُراقَب فيُستأنف الرفع تلقائيًّا ── */
function watchNet(){
  function upd(){
    STATE.meta.online = (typeof navigator !== 'undefined') ? navigator.onLine !== false : false;
    syncBadge();
    if (STATE.meta.online){ CORE.flush(); if (typeof photoFlush === 'function') photoFlush(); }
  }
  if (typeof window !== 'undefined'){
    window.addEventListener('online',  upd);
    window.addEventListener('offline', upd);
  }
  upd();
}

/* المشعرُ يُدمج كما في النظام العامل: مسجدُ نمرة في عرفات،
   والجمراتُ ومنشآتُ التسكين في منى، وقطارُ المشاعر يُنسب باسم محطته. */
function zoneOf(z, name){
  if (z === 'عرفات' || z === 'مسجد نمرة') return 'عرفات';
  if (z === 'منى' || z === 'الجمرات' || z === 'منشآت التسكين') return 'منى';
  if (String(name).indexOf('عرفات') >= 0) return 'عرفات';
  if (String(name).indexOf('مزدلفة') >= 0) return 'مزدلفة';
  return 'منى';
}

/* فكُّ الصفوف إلى كائناتٍ يقرؤها العرض */
function siteRow(r){
  return {
    id:r[0], name:r[1],
    zone:zoneOf(SITES_RAW.z[r[2]] || '', r[1] || ''), type:(SITES_RAW.t[r[3]] || ''),
    work:(SITES_RAW.w[r[4]] || ''),
    lat:r[5], lng:r[6],
    sq:r[7] || '', sign:r[8] || '', co:r[9] || '',
    region:r[10] || '', fstat:r[11] || 'لم يبدأ', inout:r[12] || ''
  };
}

function loadSites(){
  var out = [];
  SITES_RAW.g.forEach(function(r){ out.push(siteRow(r)); });
  SITES_RAW.p.forEach(function(r){ out.push(siteRow(r)); });
  STATE.sites = out;
  return out;
}

/* الإحصاءُ والبحثُ والفهرسُ في طبقة الأداء — تُعرَّف بعد هذا الملف */

/* ═══ التصنيف والتفاصيل — كما في العامل ═══
   شريطان: المشاعرُ ثم الأنواعُ بأيقوناتها وألوانها،
   والضغطُ يُرشِّح الخريطةَ والقائمةَ معًا في اللحظة نفسها. */

var CAT_DEF = {
  'مخيم':   { l:'مخيمات',          i:'\u26FA', c:'#3ED598' },
  'ممر':    { l:'ممرات',           i:'\u{1F6E3}', c:'#4FA3FF' },
  'جسر':    { l:'منطقة الجمرات',   i:'\u{1F309}', c:'#E8873A' },
  'كاميرا': { l:'كاميرات الوزارة', i:'\u{1F4F7}', c:'#C77DFF' },
  'محطة':   { l:'محطات القطار',    i:'\u{1F686}', c:'#F2C960' },
  'بوابة':  { l:'مسجد نمرة',       i:'\u{1F54C}', c:'#38B2AC' },
  'مبنى':   { l:'منشآت التسكين',   i:'\u{1F3E2}', c:'#B8C4BF' }
};

var FILT = { zone:'', type:'', work:'' };

function filtOn(){ return !!(FILT.zone || FILT.type || FILT.work); }

function filtPass(x){
  if (FILT.zone && x.zone !== FILT.zone) return false;
  if (FILT.type && x.type !== FILT.type) return false;
  if (FILT.work && x.work !== FILT.work) return false;
  return true;
}

/* عدُّ كلِّ تصنيفٍ ضمن ما رُشِّح بغيره — فالأعدادُ تتبع الاختيار */
function catCounts(){
  var z = {}, ty = {}, wk = {}, n = 0;
  for (var i = 0; i < STATE.sites.length; i++){
    var x = STATE.sites[i];
    var okZ = !FILT.type || x.type === FILT.type;
    var okT = !FILT.zone || x.zone === FILT.zone;
    if (okZ) z[x.zone] = (z[x.zone] || 0) + 1;
    if (okT) ty[x.type] = (ty[x.type] || 0) + 1;
    if (filtPass(x)){ n++; if (x.work) wk[x.work] = (wk[x.work] || 0) + 1; }
  }
  return { zone:z, type:ty, work:wk, shown:n };
}

function catBar(withWork){
  var C = catCounts(), S = siteStats();
  var zones = Object.keys(C.zone).sort(function(a,b){ return C.zone[b] - C.zone[a]; });
  var types = Object.keys(C.type).sort(function(a,b){ return C.type[b] - C.type[a]; });

  var h = '<div class="catbar"><div class="catrow">'
    + '<button type="button" class="cat zone' + (FILT.zone?'':' on') + '" data-fz="">'
    +   esc(t('الكل')) + ' <span class="n">' + nm(S.total) + '</span></button>'
    + zones.map(function(z){
        return '<button type="button" class="cat zone' + (FILT.zone===z?' on':'') + '" data-fz="' + esc(z) + '">'
          + esc(z) + ' <span class="n">' + nm(C.zone[z]) + '</span></button>';
      }).join('')
    + '</div><div class="catrow">';

  h += types.map(function(ty){
    var d = CAT_DEF[ty] || { l:ty, i:'\u25CF', c:'#8A939D' };
    var on = FILT.type === ty;
    return '<button type="button" class="cat' + (on?' on':'') + '" data-ft="' + esc(ty) + '"'
      + ' style="border-color:' + d.c + (on ? ';background:' + d.c + '22;color:' + d.c : '') + '">'
      + d.i + ' ' + esc(t(d.l)) + ' <span class="n">' + nm(C.type[ty]) + '</span></button>';
  }).join('');
  h += '</div>';

  if (withWork){
    var wks = Object.keys(C.work).sort(function(a,b){ return C.work[b] - C.work[a]; });
    if (wks.length > 1){
      h += '<div class="catrow">'
        + '<button type="button" class="cat' + (FILT.work?'':' on') + '" data-fw="">'
        +   esc(t('كل الأوجه')) + '</button>'
        + wks.map(function(k){
            return '<button type="button" class="cat' + (FILT.work===k?' on':'') + '" data-fw="' + esc(k) + '">'
              + esc(k) + ' <span class="n">' + nm(C.work[k]) + '</span></button>';
          }).join('')
        + '</div>';
    }
  }
  h += '</div>';
  return h;
}

/* المرشَّحُ يُبنى مرةً ويُخزَّن حتى يتغيّر الترشيح */
var FILT_CACHE = null, FILT_KEY = '';

function filtered(){
  var k = FILT.zone + '|' + FILT.type + '|' + FILT.work + '|' + STAT_VER;
  if (FILT_CACHE && FILT_KEY === k) return FILT_CACHE;
  FILT_KEY = k;
  FILT_CACHE = filtOn() ? STATE.sites.filter(filtPass) : STATE.sites;
  return FILT_CACHE;
}

/* ═══ تفاصيل النقطة الكاملة ═══ */
var DETAIL_ID = '';

PAGE.site = { m:'الميدان', t:'تفاصيل الموقع', l:'',
  body:function(){
    var x = siteFind(DETAIL_ID) || STATE.sites[0];
    if (!x) return alertBox('warn','لا مواقع محمّلة.');
    var d = CAT_DEF[x.type] || { l:x.type, i:'\u25CF', c:'#8A939D' };
    var rec = STATE.recs[x.id], ins = STATE.inss[x.id];
    var sv = !!rec, st = (ins && ins.status) || x.fstat || 'لم يبدأ';

/* ── الخريطة والقائمة تتبعان الترشيح ── */
function mapFiltered(){ return filtered(); }

/* ═══ نقاطُ الفنيين — تُحسب من العمل لا تُكتب ═══
   الأوزانُ في الإعدادات لا تتغيّر، وكلُّ ما يعمله الفنيُّ يُوزَن بها:
   زيارةٌ بوزنها، وتركيبٌ بنقاط قطعه، وفكٌّ بوزنه في معامل حالته.
   فيرى كلٌّ ما عمله ورقمَه بين فريقه، ويرى المهندسُ الجميع. */

var STAGE_ROLES = {
  eng:   { n:'مهندسو المناطق', i:'\u{1F393}', kinds:['visit','install'],
           d:'يديرون مناطقهم ويعتمدون ما يُرفَع فيها.' },
  cfg:   { n:'فنيو التهيئة',   i:'\u{1F6E0}', kinds:['prep'],
           d:'ضبطُ الجهاز وعنوانه ونظامه قبل النزول.' },
  asm:   { n:'فنيو التجميع',   i:'\u{1F9F0}', kinds:['asm'],
           d:'تركيبُ ما يدخل البوكس وتوصيلُه.' },
  ins:   { n:'فنيو التركيب',   i:'\u{1F527}', kinds:['install'],
           d:'تركيبُ النقطة في موقعها وتوثيقُها.' },
  srv:   { n:'فنيو المسح',     i:'\u{1F50D}', kinds:['visit'],
           d:'الزيارةُ الميدانيةُ وجمعُ ما لا يُعرف.' },
  dis:   { n:'فنيو الفك',      i:'\u{1F9E9}', kinds:['dis'],
           d:'الفكُّ وإرجاعُ العُهدة بحالتها.' }

/* لكلِّ فنيٍّ مرحلتُه — تُضبط في إسناد الأدوار */
var TECH_STAGE = {
  'أحمد':'ins', 'سالم':'ins', 'ماجد':'ins',
  'ياسر':'cfg', 'عبدالله':'ins', 'طارق':'ins',
  'خالد':'eng', 'فهد':'eng', 'محمد صفوت':'eng'
};

function stageOf(name){ return TECH_STAGE[name] || 'srv'; }

/* ── حصادُ العمل: يُمشَّط السجلُّ مرةً ويُخزَّن ── */
var SCORE_CACHE = null, SCORE_VER = -1;

function scores(){
  if (SCORE_CACHE && SCORE_VER === STAT_VER) return SCORE_CACHE;
  var by = Object.create(null);

  function ent(who){
    if (!who) who = '—';
    if (!by[who]) by[who] = {
      name:who, stage:stageOf(who),
      survey:0, install:0, dis:0, prep:0, asm:0,
      pSurvey:0, pInstall:0, pDis:0, pPrep:0, pAsm:0, total:0,
      days:Object.create(null), last:0
    };
    return by[who];
  }

  /* المسح: كلُّ سجلٍّ بوزن نقطته */
  Object.keys(STATE.recs).forEach(function(id){
    var r = STATE.recs[id], x = siteFind(id);
    if (!x) return;
    var e = ent(r.by);
    e.survey++;
    e.pSurvey += ptsSurvey(x);
    var day = new Date(r.at || Date.now()).toISOString().slice(0,10);
    e.days[day] = (e.days[day] || 0) + 1;
    if ((r.at||0) > e.last) e.last = r.at || 0;
  });

  /* التركيب: المعتمدُ وحده يُحتسب — كما هو الأصل */
  Object.keys(STATE.inss).forEach(function(id){
    var r = STATE.inss[id], x = siteFind(id);
    if (!x || r.status !== 'مُركّب') return;
    var e = ent(r.by);
    e.install++;
    e.pInstall += (r.approved ? ptsInstall(x) : 0);
    var day = new Date(r.at || Date.now()).toISOString().slice(0,10);
    e.days[day] = (e.days[day] || 0) + 1;
    if ((r.at||0) > e.last) e.last = r.at || 0;
  });

  /* الفك: بحالته ومعاملها */
  if (STATE.diss) Object.keys(STATE.diss).forEach(function(id){
    var r = STATE.diss[id], x = siteFind(id);
    if (!x || r.status !== 'تم الفك') return;
    var e = ent(r.by);
    e.dis++;
    e.pDis += (r.pts || ptsDis(x));
    if ((r.at||0) > e.last) e.last = r.at || 0;
  });

  /* الورشة: التهيئةُ والتجميعُ من دفتر الحركة */
  STATE.moves.forEach(function(m){
    if (!m || !m.by) return;
    if (m.kind === 'تهيئة'){ var e1 = ent(m.by); e1.prep++; e1.pPrep += itPrep(m.item) * (m.qty||1); }
    if (m.kind === 'تجميع'){ var e2 = ent(m.by); e2.asm++;  e2.pAsm  += itAsm(m.item)  * (m.qty||1); }
  });

  Object.keys(by).forEach(function(k){
    var e = by[k];
    e.total = Math.round((e.pSurvey + e.pInstall + e.pDis + e.pPrep + e.pAsm) * 100) / 100;
    e.acts  = e.survey + e.install + e.dis + e.prep + e.asm;
    e.nDays = Object.keys(e.days).length;
    e.perDay = e.nDays ? Math.round(e.total / e.nDays * 10) / 10 : 0;

    /* الأوفر تايم: تارجتُ المرحلة يُقسَّم على أيام الشهر فيكون سقفَ اليوم،
       وما زاد عنه في يومٍ يُعدّ إضافيًّا. فلا يُقدَّر بل يُحسب من العمل نفسه. */
    var cap = dayCapOf(e);
    e.dayCap = Math.round(cap * 10) / 10;
    e.over = 0; e.regular = 0;
    if (cap){
      /* توزيعُ النقاط على الأيام بنسبة أعمال كلِّ يوم */
      var totalActs = e.acts || 1;
      Object.keys(e.days).forEach(function(dy){
        var share = e.total * (e.days[dy] / totalActs);
        if (share > cap){ e.regular += cap; e.over += (share - cap); }
        else e.regular += share;
      });
      e.over = Math.round(e.over * 10) / 10;
      e.regular = Math.round(e.regular * 10) / 10;
    } else { e.regular = e.total; }

    var ph = cfgGet('ph'), ov = cfgGet('otRate') || 1.5;
    e.money    = Math.round((e.regular * ph + e.over * ph * ov) * 100) / 100;
    e.moneyReg = Math.round(e.regular * ph * 100) / 100;
    e.moneyOT  = Math.round(e.over * ph * ov * 100) / 100;
  });

  var list = Object.keys(by).map(function(k){ return by[k]; });
  list.sort(function(a,b){ return b.total - a.total; });
  list.forEach(function(e, i){ e.rank = i + 1; });

  SCORE_CACHE = { list:list, byName:by, n:list.length };
  SCORE_VER = STAT_VER;
  return SCORE_CACHE;
}

function scoreOf(name){
  var S = scores();
  return S.byName[name] || { name:name, stage:stageOf(name), survey:0, install:0, dis:0,
    prep:0, asm:0, pSurvey:0, pInstall:0, pDis:0, pPrep:0, pAsm:0,
    total:0, acts:0, nDays:0, perDay:0, money:0, rank:S.n + 1, last:0, days:{} };
}

function stageList(stage){
  return scores().list.filter(function(e){ return e.stage === stage; });
}

/* تارجتُ المرحلة — من الإعدادات */
function stageTarget(stage){
  var Tg = T();
  return { eng:0, cfg:Tg.prep || 0, asm:Tg.asm || 0,
           ins:Tg.ins || 0, srv:Tg.survey || 0, dis:Tg.dis || 0 }[stage] || 0;
}

/* سقفُ اليوم: تارجتُ ما عمله موزونًا بأعماله ÷ أيام الشهر.
   فمن مرحلتُه تركيبٌ وعمل مسحًا يُقاس بتارجت المسح لا بتارجتٍ لا يخصّ عمله. */
function dayCapOf(e){
  var days = cfgGet('days');
  if (!days) return 0;
  var Tg = T();
  var mix = [[e.survey, Tg.survey], [e.install, Tg.ins], [e.dis, Tg.dis],
             [e.prep, Tg.prep], [e.asm, Tg.asm]];
  var acts = 0, weighted = 0;
  mix.forEach(function(m){ if (m[0] > 0){ acts += m[0]; weighted += m[0] * (m[1] || 0); } });
  var tgt = acts ? (weighted / acts) : stageTarget(e.stage);
  if (!tgt) tgt = stageTarget(e.stage);
  return tgt ? (tgt / days) : 0;
}

   قائدُ الفريق أكبرُ نصيبًا من الفني، والفنيُّ من المساعد. */

var TEAM_ROLE = {

];

var TEAM_CUR = 'T1';

function teamOf(id){ return TEAMS.filter(function(x){ return x.id === id; })[0] || TEAMS[0]; }
function teamShare(tm){ return tm.members.reduce(function(a,m){ return a + cfgN(m.share); }, 0); }

/* نقاطُ الفريق: مجموعُ ما أنجزه أعضاؤه — ثم تُقسَّم بالنسب */
function teamPoints(tm){
  var n = 0;
  tm.members.forEach(function(m){ n += scoreOf(m.name).total; });
  return Math.round(n * 100) / 100;
}

function teamAdd(){
  var tm = teamOf(TEAM_CUR);
  var n = (document.getElementById('memName') || {}).value;
  var r = (document.getElementById('memRole') || {}).value || 'tech';
  var sh = cfgN((document.getElementById('memShare') || {}).value);
  if (!n){ toast(t('لا فنيَّ متاح')); return; }
  if (tm.members.some(function(m){ return m.name === n; })){ toast(t('هو في الفريق بالفعل')); return; }
  tm.members.push({ name:n, role:r, share:sh });
  CORE.dirty('teams', tm.id, tm);
  logEvent('إضافة ' + n + ' إلى ' + tm.n);
  toast(n + ' \u00b7 ' + t('أُضيف'));
  render(1);
}

function teamRm(i){
  var tm = teamOf(TEAM_CUR);
  var m = tm.members[i];
  if (!m) return;
  tm.members.splice(i, 1);
  CORE.dirty('teams', tm.id, tm);
  logEvent('إخراج ' + m.name + ' من ' + tm.n);
  toast(m.name + ' \u00b7 ' + t('أُخرج'));
  render(1);
}

function teamEven(){
  var tm = teamOf(TEAM_CUR), n = tm.members.length;
  if (!n) return;
  var base = Math.floor(100 / n), rest = 100 - base * n;
  tm.members.forEach(function(m, i){ m.share = base + (i < rest ? 1 : 0); });
  CORE.dirty('teams', tm.id, tm);
  toast(t('وُزّعت بالتساوي'));
  render(1);
}

function teamByRole(){
  var tm = teamOf(TEAM_CUR);
  var raw = tm.members.map(function(m){ return (TEAM_ROLE[m.role] || TEAM_ROLE.tech).def; });
  var sum = raw.reduce(function(a,b){ return a + b; }, 0);
  if (!sum) return;
  var acc = 0;
  tm.members.forEach(function(m, i){
    var v = (i === tm.members.length - 1) ? (100 - acc) : Math.round(raw[i] / sum * 100);
    m.share = v; acc += v;
  });
  CORE.dirty('teams', tm.id, tm);
  toast(t('وُزّعت بالأدوار'));
  render(1);
}

  'د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z',
  'ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'a' };

function userOf(name){
  var s = String(name || '').trim().split(/\s+/)[0];

}

function pwGen(){
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ', b = 'abcdefghijkmnpqrstuvwxyz', c = '23456789';
  var p = '';
  for (var i = 0; i < 3; i++) p += a[Math.floor(Math.random()*a.length)];
  for (var j = 0; j < 3; j++) p += b[Math.floor(Math.random()*b.length)];
  for (var k = 0; k < 4; k++) p += c[Math.floor(Math.random()*c.length)];
  return p;
}

function crewNeed(spec, months){
  var days = cfgGet('days') * months;
  var units = UNITS[spec.zone] || 0;
  var rate = crewVal(spec.k,'Rate') || spec.rate;
  var crewDays = rate ? (units / rate) : 0;
  var crews = days ? Math.ceil(crewDays / days) : 0;
  var sup = crewVal(spec.k,'Sup'), tec = crewVal(spec.k,'Tech'), ger = crewVal(spec.k,'Gear');
  if (!sup && !tec) { sup = spec.sup; tec = spec.tech; ger = spec.gear; }
  return { units:units, crewDays:Math.round(crewDays), crews:crews,
           people:crews * (sup + tec), gear:crews * ger, sup:sup, tech:tec, rate:rate };
}

function fbRules(){
  return 'rules_version = \'2\';\n'
    + 'service cloud.firestore {\n'
    + '  match /databases/{db}/documents {\n\n'
    + '    function role() {\n'
    + '      return get(/databases/$(db)/documents/users/$(request.auth.uid)).data.role;\n'
    + '    }\n'
    + '    function crewKind() {\n'
    + '      return get(/databases/$(db)/documents/users/$(request.auth.uid)).data.kind;\n'
    + '    }\n'
    + '    function isEng()  { return role() == \'engineer\'; }\n'
    + '    function isSup()  { return role() in [\'engineer\',\'supervisor\']; }\n'
    + '    function isCrew() { return role() in [\'tech\',\'cprep\',\'casm\',\'cins\']; }\n'
    + '    function mine(d)  { return d.assignedTo == request.auth.uid; }\n\n'
    + '    match /sites/{id} {\n'
    + '      allow read:  if request.auth != null;\n'
    + '      allow write: if isSup() || (isCrew() && mine(resource.data));\n'
    + '    }\n\n'
    + '    match /tasks/{id} {\n'
    + '      allow read:   if isSup() || (isCrew() && mine(resource.data));\n'
    + '      allow create: if isSup();\n'
    + '      allow update: if isEng()\n'
    + '                    || (isCrew() && mine(resource.data)\n'
    + '                        && resource.data.kind == crewKind()\n'
    + '                        && request.resource.data.status != \'معتمد\');\n'
    + '    }\n\n'
    + '    match /inventory/{id} { allow read, write: if isEng(); }\n'
    + '    match /purchases/{id} { allow read: if isEng() || role() == \'viewer\';\n'
    + '                            allow write: if isEng(); }\n'
    + '    match /settings/{id}  { allow read: if request.auth != null;\n'
    + '                            allow write: if isEng(); }\n'
    + '    match /users/{uid} {\n'
    + '      allow read:  if isEng() || request.auth.uid == uid;\n'
    + '      allow write: if isEng();\n'
    + '    }\n\n'
    + '    // الهاتف حقلٌ محجوبٌ عن الوزارة في القاعدة\n'
    + '    match /techs/{id} {\n'
    + '      allow read: if isSup() || isCrew();\n'
    + '      allow read: if role() == \'viewer\'\n'
    + '                  && !(\'phone\' in resource.data.keys());\n'
    + '      allow write: if isEng();\n'
    + '    }\n'
    + '  }\n'
    + '}';
}

  },
  install: {
    n:'التركيب', i:'\u{1F527}', kind:'install', c:'#3AD6A0',
    d:'ما تمّت زيارتُه الميدانية وحده — يُجدوَل ويُسند تركيبًا.',

    ready:function(x){ return !disDone(x.id); },
    done:function(x){ return disDone(x.id); },
    pts:function(x){ return ptsDis(x); },
    empty:'لا نقاط مركَّبة بعد — الفكُّ آخرُ الدورة.'
  }
};

function insDone(id){
  var r = STATE.inss[id];
  return !!(r && r.status === 'مُركّب');
}
function disDone(id){
  var r = STATE.diss ? STATE.diss[id] : null;
  return !!(r && r.status === 'تم الفك');
}

function LAYER(){ return LAYERS[FIELD_MODE] || LAYERS.survey; }

/* ── النقاط: كلُّ عملٍ وزنُه من الإعدادات ── */
function catLabel(x){
  var d = CAT_DEF[x.type];
  return d ? d.l : x.type;
}

function ptsSurvey(x){
  var v = cfgGet('w', x.zone + '|' + catLabel(x));
  if (v) return v;
  /* لا وزنَ مضبوطٌ لهذا الصنف — يُقدَّر بوزن نوعه العام إن وُجد */
  return cfgGet('w', catLabel(x));
}

function ptsInstall(x){
  var ins = STATE.inss[x.id];
  /* إن عُرفت قطعُه حُسبت نقاطُها، وإلا فنقاطُ النقطة الكاملة تقديرًا */
  if (ins && ins.pts) return ins.pts;
  var byParts = 0;
  if (ins && ins.parts) Object.keys(ins.parts).forEach(function(k){
    byParts += cfgN(ins.parts[k]) * itPts(k);
  });
  if (byParts) return byParts;
  return x.type === 'ممر' ? cfgGet('insCor') : cfgGet('insCamp');
}

function ptsDis(x){
  var base = cfgGet('dw', x.zone + '|' + catLabel(x)) || cfgGet('dw', catLabel(x));
  var r = STATE.diss ? STATE.diss[x.id] : null;
  var f = (r && r.cond === 'تالف') ? cfgGet('disBad') : cfgGet('disOk');
  return base * (f || 1);
}

function ptsOf(x, mode){
  var L = LAYERS[mode || FIELD_MODE] || LAYERS.survey;
  return L.pts(x);
}

/* مجموعُ نقاطِ ما حُدِّد — يُعرَف قبل الإسناد */
function selPts(){
  var n = 0, L = LAYER();
  selIds().forEach(function(id){
    var x = siteFind(id);
    if (x) n += L.pts(x);
  });
  return Math.round(n * 100) / 100;
}

/* ── إحصاءُ الطبقة ── */
function layerStats(mode){
  var L = LAYERS[mode || FIELD_MODE] || LAYERS.survey;
  var pool = 0, ready = 0, done = 0, asn = 0, ptsReady = 0, ptsDone = 0;
  for (var i = 0; i < STATE.sites.length; i++){
    var x = STATE.sites[i];
    if (!L.pass(x)) continue;
    pool++;
    var p = L.pts(x);
    if (L.done(x)){ done++; ptsDone += p; }
    else { ready++; ptsReady += p; }
    if (asnOf(x.id)) asn++;
  }
  return { pool:pool, ready:ready, done:done, asn:asn,
           ptsReady:Math.round(ptsReady), ptsDone:Math.round(ptsDone),
           ptsAll:Math.round(ptsReady + ptsDone) };
}

/* الخريطةُ تُرشِّح بالطبقة ثم بالتصنيف */
function layerFiltered(){
  var L = LAYER();
  var base = (MY_ONLY || ROLE === 'tech') ? mineFiltered() : filtered();
  return base.filter(function(x){ return L.pass(x); });
}

}

                     by:STATE.meta.name || 'محمد صفوت', pts:x ? ptsDis(x) : 0 };

   يُحدَّد ما يُراد ثم يُسند لفنيٍّ، فيراه في خريطته وحده.
   والمُسنَدُ لا يُسنَد مرةً ثانيةً — فلا يُشتّت فنيّان على نقطةٍ واحدة. */

var ASN_OPEN = false, ASN_TO = '', ASN_KIND = 'visit', ASN_WHEN = '';
var SEL = Object.create(null), SEL_N = 0;

function selHas(id){ return !!SEL[id]; }
function selToggle(id){
  if (SEL[id]){ delete SEL[id]; SEL_N--; }
  else { SEL[id] = 1; SEL_N++; }
}
function selClear(){ SEL = Object.create(null); SEL_N = 0; }
function selIds(){ return Object.keys(SEL); }
function selAll(list){
  list.forEach(function(x){ if (!SEL[x.id] && !asnOf(x.id)){ SEL[x.id] = 1; SEL_N++; } });
}

/* من أُسند إليه هذا الموقع — إن أُسند */
function asnOf(id){
  var T = STATE.tasks;
  for (var k in T) if (T[k] && T[k].site === id && T[k].status !== 'معتمد') return T[k];
  return null;
}

/* ما لدى فنيٍّ في هذه الطبقة — يُفتح عليه اللوحُ فيُزاد أو يُنقَص */
function asnOfTech(who, kind){
  var out = [];
  Object.keys(STATE.tasks).forEach(function(k){
    var x = STATE.tasks[k];
    if (x.to === who && x.kind === kind && x.status !== 'معتمد') out.push(x.site);
  });
  return out;
}

/* تحميلُ ما لديه في التحديد — فالإضافةُ والحذفُ على ما هو قائم */
function asnLoad(who){
  var kind = LAYER().kind;
  selClear();
  asnOfTech(who, kind).forEach(function(id){ SEL[id] = 1; SEL_N++; });
  ASN_BASE = asnOfTech(who, kind);
  render(1);
}

   فيُفتَح اللوحُ على خمسٍ فتُجعَل سبعًا أو ثلاثًا بالتحديد نفسه. */
var ASN_TEAM = 'T1';

/* التوزيعُ على أعضاء الفريق: بالنسب المعرَّفة أو بالتساوي —
   فيأخذ القائدُ نصيبَه والمساعدُ نصيبَه، ولا تُترَك نقطةٌ بلا صاحب. */
function asnTeamCommit(){
  var tm = teamOf((document.getElementById('asnTeam') || {}).value || ASN_TEAM);
  if (!tm || !tm.members.length){ toast(t('لا أعضاءَ في هذا الفريق')); return; }
  var split = (document.getElementById('asnSplit') || {}).value || 'share';
  var kind  = (document.getElementById('asnKind') || {}).value || LAYER().kind;
  var when  = (document.getElementById('asnWhen') || {}).value || '';
  var ids   = selIds().filter(function(id){ var a = asnOf(id); return !a; });
  if (!ids.length){ toast(t('حدّد نقاطًا أولًا')); return; }

  var tot = teamShare(tm);
  var quota = tm.members.map(function(m){
    return split === 'even'
      ? Math.floor(ids.length / tm.members.length)
      : Math.round(ids.length * cfgN(m.share) / (tot || 1));
  });
  /* ما تبقّى بالكسر يُعطى الأوّلَ فالأوّل فلا تضيع نقطة */
  var given = quota.reduce(function(a,b){ return a + b; }, 0);
  for (var k = 0; given < ids.length; k = (k + 1) % tm.members.length){ quota[k]++; given++; }

  var at = 0, made = 0, log = [];
  tm.members.forEach(function(m, i){
    var mine = ids.slice(at, at + quota[i]);
    at += quota[i];
    if (!mine.length) return;
    mine.forEach(function(id){
      var tid = 'TK-' + kind + '-' + id;
      CORE.set('tasks', tid, {
        id:tid, site:id, kind:kind, to:m.name, assignedTo:m.name, team:tm.id,
        status:'مطلوب', when:when, by:STATE.meta.name || 'محمد صفوت', at:Date.now()
      });
      made++;
    });
    log.push(m.name + ' ' + nm(mine.length));
  });

  logEvent('إسناد لفريق ' + tm.n + ' — ' + nm(made) + ' نقطة · ' + log.join(' · '));
  selClear(); ASN_OPEN = false; statBump();
  toast(tm.n + ' \u00b7 ' + nm(made) + ' ' + t('نقطة') + ' \u00b7 ' + log.join(' \u00b7 '));
  render(1);
}

function asnCommit(){
  if (ASN_MODE === 'team'){ asnTeamCommit(); return; }
  var to   = curTech();
  var kind = (document.getElementById('asnKind') || {}).value || ASN_KIND;
  var when = (document.getElementById('asnWhen') || {}).value || '';
  if (!to){ toast(t('اختر فنيًّا')); return; }

  var want = selIds();
  var had  = asnOfTech(to, kind);
  var add = 0, rm = 0, busy = 0;

  /* المُضاف */
  want.forEach(function(id){
    if (had.indexOf(id) > -1) return;
    var other = asnOf(id);
    if (other && other.to !== to){ busy++; return; }
    var tid = 'TK-' + kind + '-' + id;
    CORE.set('tasks', tid, {
      id:tid, site:id, kind:kind, to:to, assignedTo:to,
      status:'مطلوب', when:when, by:STATE.meta.name || 'محمد صفوت', at:Date.now()
    });
    add++;
  });

  /* المسحوب — ما كان لديه وخرج من التحديد */
  had.forEach(function(id){
    if (want.indexOf(id) > -1) return;
    var tk = asnOf(id);
    if (tk && tk.to === to && tk.status === 'مطلوب'){ CORE.rm('tasks', tk.id); rm++; }
  });

  if (!add && !rm){ toast(t('لا تغيير')); return; }
  logEvent('إسناد ' + to + ' · +' + nm(add) + (rm ? ' \u2212' + nm(rm) : '')
           + ' \u00b7 ' + t(WO_KINDS[kind].n));
  selClear();
  ASN_BASE = [];
  ASN_OPEN = false;
  statBump();
  toast(to + ' \u00b7 ' + (add ? '+' + nm(add) + ' ' : '') + (rm ? '\u2212' + nm(rm) + ' ' : '')
        + '= ' + nm(asnOfTech(to, kind).length) + ' ' + t('نقطة')
        + (busy ? ' \u00b7 ' + nm(busy) + ' ' + t('مُسندةٌ لغيره') : ''));
  render(1);
}

  try{
    POS_WATCH = navigator.geolocation.watchPosition(function(p){
      MYPOS = { lat:p.coords.latitude, lng:p.coords.longitude, at:Date.now() };
      if (CUR === 'sites') render(1);

/* هافرساين مبسّط — نصفُ قطر الأرض بالكيلومترات */
function distKm(a, b){
  if (!a || !b) return null;
  var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var s = Math.sin(dLat/2) * Math.sin(dLat/2)
        + Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180)
        * Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function distTxt(x){
  var k = distKm(MYPOS, x);
  if (k == null) return '';
  return k < 1 ? (nm(Math.round(k * 1000)) + ' م') : (nm(Math.round(k * 10) / 10) + ' كم');
}

/* ── أداة الفحص: تُشغَّل من جهاز المكتب على شبكة الميدان ── */
var PROBE = { on:false, done:0, up:0, down:0, log:[], t:0 };

function probeIp(site){
  var ins = STATE.inss[site.id] || {};
  var p = String(ins.prefix || '').trim();
  return p ? (p + '.1') : '';
}

function probeOne(ip){
  /* لا ping في المتصفح — تُطلَب صورةٌ وهميةٌ ويُقاس أيُّهما أسرع: الردُّ أم المهلة */
  return new Promise(function(res){
    if (typeof Image === 'undefined'){ res(false); return; }
    var done = false, img = new Image();
    var t = setTimeout(function(){ if (!done){ done = true; img.src = ''; res(false); } }, 2500);
    img.onload = img.onerror = function(){
      if (done) return;
      done = true; clearTimeout(t);
      /* حتى الخطأ دليلُ حياة: المنفذُ ردّ. الصمتُ وحده موت. */
      res(true);
    };
    try{ img.src = 'http://' + ip + '/favicon.ico?t=' + Date.now(); }
    catch(e){ clearTimeout(t); res(false); }
  });
}

function probeRun(){
  if (PROBE.on) { PROBE.on = false; render(1); return; }
  var targets = STATE.sites
    .map(function(s){ return { s:s, ip:probeIp(s) }; })
    .filter(function(x){ return x.ip; });
  if (!targets.length){ toast(t('لا عناوين مسجّلة — أدخل بادئة الشبكة عند التركيب')); return; }

  PROBE.on = true; PROBE.done = 0; PROBE.up = 0; PROBE.down = 0; PROBE.log = [];
  PROBE.t = Date.now();
  render(1);

  var i = 0;
  function step(){
    if (!PROBE.on || i >= targets.length){
      PROBE.on = false;
      logEvent('فحص الأجهزة — ' + nm(PROBE.up) + ' حيّ · ' + nm(PROBE.down) + ' صامت');
      render(1);
      return;
    }
    var batch = targets.slice(i, i + 6);
    i += 6;
    Promise.all(batch.map(function(x){
      return probeOne(x.ip).then(function(alive){
        PROBE.done++;
        if (alive) PROBE.up++; else PROBE.down++;
        STATE.hb = STATE.hb || {};
        STATE.hb[x.s.id] = { ip:x.ip, alive:alive, at:Date.now() };
        if (PROBE.log.length < 60)
          PROBE.log.unshift({ id:x.s.id, ip:x.ip, alive:alive });
      });
    })).then(function(){
      if (PROBE.done % 24 === 0) render(1);
      setTimeout(step, 60);
    });
  }
  step();
}

/* ═══ جسرُ Google Drive — الصورُ في مساحتك لا في Firestore ═══
   خمسةُ تيرا في درايفك تكفي المشروعَ كلَّه، ووثيقةُ Firestore لا تتجاوز
   ميغابايتًا — فتُرفَع الصورُ هناك ويُحفَظ معرّفُها هنا. */

var DRV = {
  /* يُملأ من الإعدادات — يُنشَأ في Google Cloud Console */
  clientId: '',
  folderId: '',                 /* مجلّدُ المشروع في درايفك */
  scope: 'https://www.googleapis.com/auth/drive.file',
  token: '', exp: 0, ready: false, lib: false
};

function drvCfg(){
  try{
    DRV.clientId = localStorage.getItem('nsk14.drv.client') || '';
    DRV.folderId = localStorage.getItem('nsk14.drv.folder') || '';
  }catch(e){}
  return !!DRV.clientId;
}

/* تُحمَّل مكتبةُ جوجل كسولًا — لا تُطلَب قبل أول رفع */
function drvLoad(){
  if (DRV.lib) return Promise.resolve(true);
  if (typeof window === 'undefined') return Promise.resolve(false);
  return new Promise(function(res){
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload  = function(){ DRV.lib = true; res(true); };
    s.onerror = function(){ res(false); };
    document.head.appendChild(s);
    setTimeout(function(){ if (!DRV.lib) res(false); }, 9000);
  });
}

/* الإذنُ يُطلَب مرةً ويُجدَّد قبل انتهائه بدقيقة */
function drvAuth(){
  if (DRV.token && Date.now() < DRV.exp - 60000) return Promise.resolve(DRV.token);
  if (!drvCfg()) return Promise.reject(new Error('no-client'));
  return drvLoad().then(function(ok){
    if (!ok || !window.google || !google.accounts) throw new Error('no-lib');
    return new Promise(function(res, rej){
      var tc = google.accounts.oauth2.initTokenClient({
        client_id: DRV.clientId,
        scope: DRV.scope,
        callback: function(r){
          if (r && r.access_token){
            DRV.token = r.access_token;
            DRV.exp = Date.now() + (r.expires_in || 3600) * 1000;
            DRV.ready = true;
            res(DRV.token);
          } else rej(new Error('denied'));
        }
      });
      tc.requestAccessToken({ prompt: DRV.token ? '' : 'consent' });
    });
  });
}

/* dataURL إلى Blob — الصورُ مضغوطةٌ أصلًا على الجهاز */
function dataToBlob(d){
  var i = d.indexOf(','), meta = d.slice(0, i);
  var mime = (meta.match(/data:([^;]+)/) || [,'image/jpeg'])[1];
  var bin = atob(d.slice(i + 1));
  var arr = new Uint8Array(bin.length);
  for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: mime });
}

/* الرفع: وصفٌ ثم محتوى، في طلبٍ واحدٍ متعدّد الأجزاء */
function drvUpload(name, dataUrl){
  return drvAuth().then(function(tok){
    var blob = dataToBlob(dataUrl);
    var meta = { name: name, mimeType: blob.type };
    if (DRV.folderId) meta.parents = [DRV.folderId];
    var fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
    fd.append('file', blob);
    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',
      { method:'POST', headers:{ Authorization:'Bearer ' + tok }, body: fd })
      .then(function(r){ return r.ok ? r.json() : r.json().then(function(e){ throw new Error(e.error && e.error.message || 'upload'); }); });
  });
}

/* طابورُ الصور: تُحفَظ محليًّا ثم تُرفَع حين تتاح الشبكةُ والإذن */
var PHOTO_Q = [];

function photoQueue(siteId, kind, dataUrl){
  PHOTO_Q.push({ site:siteId, kind:kind, data:dataUrl, at:Date.now(), tries:0 });
  CORE.saveSoon();
  photoFlush();
}

function photoFlush(){
  if (!PHOTO_Q.length || !STATE.meta.online || !drvCfg()) return Promise.resolve(0);
  var it = PHOTO_Q[0];
  var nm2 = it.site + '__' + it.kind + '__' + new Date(it.at).toISOString().slice(0,19).replace(/[:T]/g,'-') + '.jpg';
  return drvUpload(nm2, it.data).then(function(r){
    PHOTO_Q.shift();
    /* في الوثيقة معرّفُ الملف ورابطُه لا الصورةُ نفسها */
    CORE.set('photos', it.site + '_' + it.kind, {
      site:it.site, kind:it.kind, driveId:r.id, link:r.webViewLink, at:it.at
    });
    logEvent('رفع صورة — ' + it.site + ' · ' + it.kind);
    if (PHOTO_Q.length) setTimeout(photoFlush, 400);
    return 1;
  }).catch(function(e){
    it.tries++;
    if (it.tries > 5){ PHOTO_Q.shift(); logEvent('تعذّر رفع صورة — ' + it.site); }
    return 0;
  });
}

/* ضغطُ الصورة على الجهاز — الرفع الخام يخنق شبكةَ المشاعر */
function shrink(file, max, q){
  return new Promise(function(res){
    if (!file || typeof FileReader === 'undefined' || typeof Image === 'undefined'){ res(null); return; }
    var fr;
    try{ fr = new FileReader(); }catch(e){ res(null); return; }
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        try{
          var r = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
          var cx = cv.getContext('2d');
          if (!cx){ res(null); return; }
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          res({ data:cv.toDataURL('image/jpeg', q || 0.72), w:cv.width, h:cv.height,
                size:Math.round(cv.width * cv.height * 0.12) });
        }catch(e){ res(null); }
      };
      img.onerror = function(){ res(null); };
      img.src = fr.result;
    };
    fr.onerror = function(){ res(null); };
    try{ fr.readAsDataURL(file); }catch(e){ res(null); }
  });
}

/* ═══ حوكمةُ المشروع بمعايير PMI ═══
   أربعةٌ يسأل عنها المدقّق ولم تكن: خطُّ أساسٍ يُقاس عليه، وقيمةٌ مكتسبةٌ
   تقول أين نحن، وسجلُّ مخاطرَ بالاحتمال والأثر، وضبطُ تغييرٍ يمنع الانزلاق. */

/* ── خط الأساس: يُجمَّد فيصير مرجعًا لا يُعدَّل إلا بطلب تغيير ── */
var BASE = null;

function baseSet(){
  var S = siteStats();
  BASE = {
    at: Date.now(),
    by: STATE.meta.name || 'محمد صفوت',
    scope: S.total,
    byKey: JSON.parse(JSON.stringify(S.byKey)),
    months: PLAN_MONTHS || cfgGet('phase') || 4,
    budget: cfgGet('budCap'),
    ph: cfgGet('ph'),
    targets: { survey:cfgGet('tgtSurvey'), ins:cfgGet('tgtInsCamp') + cfgGet('tgtInsCor'),
               prep:cfgGet('tgtPrepCamp') + cfgGet('tgtPrepCor'),
               asm:cfgGet('tgtAsmCamp') + cfgGet('tgtAsmCor'), dis:cfgGet('tgtDis') },
    ver: (BASE ? BASE.ver + 1 : 1)
  };
  /* الميزانيةُ الكلية للنطاق: نقاطُ المسح والتركيب في سعر النقطة */
  var pts = 0;
  STATE.sites.forEach(function(x){ pts += ptsSurvey(x) + ptsInstall(x); });
  BASE.bac = Math.round(pts * BASE.ph);          /* Budget At Completion */
  BASE.totalPts = Math.round(pts);
  CORE.set('baseline', 'v' + BASE.ver, BASE);
  logEvent('تجميد خط الأساس — النسخة ' + nm(BASE.ver));
  return BASE;
}

function baseDays(){
  if (!BASE) return { elapsed:0, total:0, pct:0 };
  var total = (BASE.months || 4) * (cfgGet('days') || 26);
  var elapsed = Math.min(total, Math.max(0,
    Math.round((Date.now() - BASE.at) / 86400000)));
  return { elapsed:elapsed, total:total, pct: total ? elapsed / total : 0 };
}

/* ── القيمة المكتسبة — لغةُ المدقّق ── */
function evm(){
  if (!BASE) return null;
  var D = baseDays();
  var PV = Math.round(BASE.bac * D.pct);          /* المخطَّط حتى اليوم */

  var earned = 0, done = 0;
  STATE.sites.forEach(function(x){
    if (STATE.recs[x.id]){ earned += ptsSurvey(x); done++; }
    var r = STATE.inss[x.id];
    if (r && r.status === 'مُركّب' && r.approved) earned += ptsInstall(x);
  });
  var EV = Math.round(earned * BASE.ph);          /* المكتسَب فعلًا */

  var AC = 0;
  scores().list.forEach(function(e){ AC += e.money; });
  DATA.buys.forEach(function(b){ AC += b[4]; });
  AC = Math.round(AC);                            /* المنصرف الفعلي */

  var SV = EV - PV, CV = EV - AC;
  var SPI = PV ? (EV / PV) : 0;
  var CPI = AC ? (EV / AC) : 0;
  var EAC = CPI ? Math.round(BASE.bac / CPI) : BASE.bac;
  var ETC = Math.max(0, EAC - AC);
  var VAC = BASE.bac - EAC;
  var TCPI = (BASE.bac - AC) ? ((BASE.bac - EV) / (BASE.bac - AC)) : 0;

  return { PV:PV, EV:EV, AC:AC, SV:SV, CV:CV,
           SPI:Math.round(SPI * 100) / 100, CPI:Math.round(CPI * 100) / 100,
           EAC:EAC, ETC:ETC, VAC:VAC, TCPI:Math.round(TCPI * 100) / 100,
           BAC:BASE.bac, days:D, doneSites:done };
}

function evmVerdict(v){
  if (!v) return { t:'—', c:'' };
  if (v.SPI >= 1 && v.CPI >= 1) return { t:'متقدّمٌ وضمن الكلفة', c:'ok' };
  if (v.SPI >= 0.95 && v.CPI >= 0.95) return { t:'ضمن الحدود المقبولة', c:'ok' };
  if (v.SPI < 0.9 && v.CPI < 0.9) return { t:'متأخّرٌ ومتجاوزٌ للكلفة', c:'bad' };
  if (v.SPI < 0.95) return { t:'متأخّرٌ عن الجدول', c:'wrn' };
  return { t:'متجاوزٌ للكلفة', c:'wrn' };
}

function riskScore(r){ return r.p * r.i; }
function riskLevel(n){
  if (n >= 15) return { t:'حرج', c:'bad' };
  if (n >= 9)  return { t:'عالٍ', c:'wrn' };
  if (n >= 4)  return { t:'متوسط', c:'' };
  return { t:'منخفض', c:'ok' };
}

  var why  = (document.getElementById('chgWhy') || {}).value || '';

                 at:Date.now(), st:'مقدَّم' });
  CORE.dirty('changes', 'CR-' + CHANGES.length, CHANGES[CHANGES.length-1]);
  logEvent('طلب تغيير — ' + kind + ' · ' + imp);
  toast(t('قُدّم الطلب'));

function chgDecide(i, ok){
  var c = CHANGES[i];
  if (!c) return;
  c.st = ok ? 'معتمد' : 'مرفوض';
  c.decBy = STATE.meta.name || 'محمد صفوت';
  c.decAt = Date.now();
  CORE.dirty('changes', 'CR-' + (i+1), c);
  logEvent((ok ? 'اعتماد' : 'رفض') + ' طلب تغيير — ' + c.kind);
  toast(ok ? t('اعتُمد — جمّد خط أساسٍ جديد') : t('رُفض'));

}

                  ['مغطّاةٌ كاملًا', N(covered), covered===all.length?'ok':'wrn'],

function mileDone(m){
  var S = siteStats();
  var byZone = function(z, type){
    var tot = 0, done = 0;
    STATE.sites.forEach(function(x){
      if (x.zone !== z) return;
      tot++;
      if (type === 'survey' ? STATE.recs[x.id] : insDone(x.id)) done++;
    });
    return tot ? done / tot : 0;
  };
  switch (m.id){
    case 'M1': return BASE ? 1 : 0;
    case 'M2': return byZone('عرفات','survey');
    case 'M3': return byZone('منى','survey');
    case 'M4': return 0;
    case 'M5': return byZone('عرفات','install');
    case 'M6': return byZone('منى','install');
    case 'M7': case 'M8': return 0;
  }
  return 0;
}

  toast(t('يُجهَّز') + ' ' + t(r.n) + '…');
  logEvent('توليد تقرير — ' + r.n + ' → ' + r.to);
  xlsExport(keys, 'نسك-' + r.id + '-' + new Date().toISOString().slice(0,10) + '.xlsx');

function repPack(side){
  var keys = {};
  REPORTS.filter(function(r){ return r.side === side; })
         .forEach(function(r){ r.sheets.forEach(function(s){ if (SHEETS[s]) keys[s] = 1; }); });
  var list = Object.keys(keys);
  if (!list.length){ toast(t('لا أوراق')); return; }
  toast(nm(list.length) + ' ' + t('ورقةً تُجهَّز') + '…');
  logEvent('حزمة تقارير — ' + (side === 'co' ? 'الشركة' : 'الوزارة') + ' · ' + nm(list.length) + ' ورقة');
  xlsExport(list, 'نسك-حزمة-' + (side === 'co' ? 'الشركة' : 'الوزارة') + '-'

var MOVE_ID = '', MOVE_AT = null;

function popHtml(){
  var s = (POP_SITE && siteFind(POP_SITE)) || STATE.sites[0];
  if (!s) return '';
  var d = CAT_DEF[s.type] || { l:s.type, i:'\u25CF', c:'#8A939D' };
  var rec = STATE.recs[s.id] || null;
  var ins = STATE.inss[s.id] || null;
  var task = asnOf(s.id);
  var moved = !!(rec && rec.loc);
  var sv = !!rec;
  var st = (ins && ins.status) || s.fstat || 'لم يبدأ';

  function kv(k, v){
    if (v === '' || v == null) return '';
    return '<div><span class="k">' + esc(t(k)) + '</span><span>' + v + '</span></div>';
  }

  /* أزرارُ الوسم: في وضع التركيب مجدولٌ وتم، وفي المسح «تمت الزيارة» —
     ولا تظهر إلا لنقطةٍ أُسندت، فلا يُوسَم ما لم يُطلَب. */
  var marks = '';
  if (FIELD_MODE === 'install'){
    marks = [['مجدول','#FF8C42'], ['مُركّب','#3AD6A0'], ['متعذّر','#E05252']].map(function(o){
      var on = st === o[0];
      return '<button type="button" class="go' + (on?' on':'') + '"'
        + ' style="border-color:' + o[1] + ';color:' + (on ? '#0A0B0D' : o[1])
        + (on ? ';background:' + o[1] : '') + '"'
        + ' data-fmark="' + esc(s.id) + '|' + esc(o[0]) + '">' + esc(t(o[0])) + '</button>';
    }).join('');
  } else if (task || may('approve')){
    var onSv = sv;
    marks = '<button type="button" class="go' + (onSv?' on':'') + '"'
      + ' style="border-color:#4BC9F5;color:' + (onSv ? '#0A0B0D' : '#4BC9F5')
      + (onSv ? ';background:#4BC9F5' : '') + '"'
      + ' data-smark="' + esc(s.id) + '">' + esc(t('تمت الزيارة')) + '</button>';
  } else {
    marks = '<span class="hint" style="margin:0;font-size:11.5px">'
      + esc(t('لم تُجدول زيارة لهذه النقطة بعد')) + '</span>';
  }

  return '<div class="pop" id="pkPop">'
    + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
    +   '<div style="min-width:0"><div class="pid" style="color:var(--brand);font-weight:700">'
    +     esc(s.id) + '</div>'
    +   '<h3 style="margin-top:3px">' + esc(s.name) + '</h3></div>'
    +   '<button type="button" class="btn btn-quiet btn-sm" data-pop="0" aria-label="'
    +     esc(t('إغلاق')) + '">✕</button>'
    + '</div>'

    + '<div style="color:' + d.c + ';font-weight:800;font-size:12px;margin:6px 0 2px">'
    +   d.i + ' ' + esc(t(d.l)) + ' — ' + esc(s.zone) + '</div>'

    + '<div class="pop-rows">'
    +   kv('الشاخص', s.sign ? '<span class="num">' + esc(s.sign) + '</span>' : '')
    +   kv('المربع', s.sq ? '<span class="num">' + esc(s.sq) + '</span>' : '')
    +   kv('الشركة', esc(s.co))
    +   kv('التصنيف', esc(s.inout === 'خارج' ? 'حجاج خارج' : (s.inout === 'داخل' ? 'حجاج داخل' : s.inout)))
    +   kv('وجه العمل', esc(s.work))
    +   kv('المنطقة', esc(s.region))
    +   kv('حالة المسح', pill(sv ? 'تمت الزيارة' : 'لم يُزر', sv ? 'ok' : 'warn'))
    +   kv('حالة التركيب', pill(st, st==='مُركّب' ? 'ok' : (st==='متعذّر' ? 'off' : '')))
    +   (task ? kv('مُسند إلى', esc(task.to) + (task.when ? ' · ' + esc(task.when) : '')) : '')
    +   kv('الإحداثيات', '<span class="num">' + s.lat.toFixed(5) + ', ' + s.lng.toFixed(5) + '</span>')
    + '</div>'

    + (moved ? '<div class="hint" style="color:#7FB3FF;margin:6px 0 0">\u{1F4CD} '
        + esc(t('موقع معدَّل ميدانيًّا')) + '</div>' : '')

    + '<div class="pst">' + marks + '</div>'

    + (ins && Object.keys(ins.parts || {}).length
      ? '<div class="hint" style="margin:8px 0 0">' + esc(t('القطع'))
        + ': <b>' + nm(Object.keys(ins.parts).length) + '</b> · ' + esc(t('النقاط'))
        + ': <b>' + nm(ins.pts || 0) + '</b>'
        + (ins.approved ? ' · ' + pill('معتمد','ok') : ' · ' + pill('بانتظار التدقيق','warn'))
        + '</div>' : '')

    + '<div class="pop-btns">'
    +   btn(selHas(s.id) ? '☑ ' + t('محدَّد') : '☐ ' + t('حدّد'),
            selHas(s.id) ? 'btn-primary btn-sm' : 'btn-secondary btn-sm',
            ' data-psel="' + esc(s.id) + '"')
    +   '<a class="btn btn-primary btn-sm" target="_blank" rel="noopener" '
    +   'href="https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng + '">'
    +   '↗ ' + esc(t('اتجاهات')) + '</a>'
    +   btn('⇱ ' + t('تحريك'),'btn-secondary btn-sm',' data-move="' + esc(s.id) + '"')
    +   btn('✎ ' + t('تعديل البيانات'),'btn-secondary btn-sm',' data-site="' + esc(s.id) + '"')
    +   btn((FIELD_MODE === 'install' ? '🔧 ' + t('نموذج التركيب') : '🔍 ' + t('نموذج المسح')),
            'btn-secondary btn-sm',
            (FIELD_MODE === 'install' ? ' data-insform="' : ' data-form="') + esc(s.id) + '"')
    + '</div></div>';
}

/* ── التحريك: نقرةٌ على الخريطة تنقل النقطة ── */
function moveStart(id){
  MOVE_ID = id;
  POP_OPEN = false;
  toast(t('اضغط على الموقع الجديد على الخريطة'));
  render(1);
}

function moveApply(lat, lng){
  var s = siteFind(MOVE_ID);
  if (!s) { MOVE_ID = ''; return; }
  var old = { lat:s.lat, lng:s.lng };
  s.lat = lat; s.lng = lng;
  var rec = STATE.recs[s.id] || { id:s.id, at:Date.now(), by:STATE.meta.name || 'محمد صفوت' };
  rec.loc = { lat:lat, lng:lng, from:old, at:Date.now(), by:STATE.meta.name || 'محمد صفوت' };
  CORE.set('recs', s.id, rec);
  logEvent('تحريك موقع — ' + s.id);
  toast(t('حُرِّك الموقع') + ' · ' + nm(Math.round(distKm(old, { lat:lat, lng:lng }) * 1000)) + ' ' + t('م'));
  MOVE_ID = '';
  POP_SITE = s.id; POP_OPEN = true;
  statBump();
  render(1);
  if (MAP) mapPaint();
}

function moveBar(){
  if (!MOVE_ID) return '';
  var s = siteFind(MOVE_ID);
  return '<div class="map-selbar" style="background:rgba(127,179,255,.96);color:#04121f">'
    + '<span>' + esc(t('اضغط على الموقع الجديد لـ')) + ' <b>' + esc(MOVE_ID) + '</b></span>'
    + '<div class="actions" style="margin-inline-start:auto">'
    + btn('إلغاء','btn-secondary btn-sm',' data-movex="1"') + '</div></div>';
}

/* ── وسمُ الحالة: يكتب فعلًا ── */
function markSurvey(id){
  var rec = STATE.recs[id];
  if (rec){
    CORE.rm('recs', id);
    logEvent('إلغاء وسم زيارة — ' + id);
    toast(t('أُلغي الوسم'));
  } else {
    CORE.set('recs', id, {
      id:id, by:STATE.meta.name || 'محمد صفوت', at:Date.now(), quick:1
    });
    logEvent('وسم زيارة — ' + id);
    toast(t('وُسمت زيارةً'));
  }
  statBump(); render(1);
  if (MAP) mapPaint();
}

function markInstall(id, status){
  var s = siteFind(id);
  var cur = STATE.inss[id] || { id:id, parts:{}, serials:{}, pts:0, approved:false };
  if (cur.status === status){
    CORE.rm('inss', id);
    if (s) s.fstat = 'لم يبدأ';
    logEvent('إلغاء وسم تركيب — ' + id);
    toast(t('أُلغي الوسم'));
  } else {
    cur.status = status;
    cur.by = STATE.meta.name || 'محمد صفوت';
    cur.at = Date.now();
    CORE.set('inss', id, cur);
    if (s && status === 'مُركّب' && cur.approved) s.fstat = 'مُركّب';
    logEvent('وسم تركيب «' + status + '» — ' + id);
    toast(t(status));
  }
  statBump(); render(1);
  if (MAP) mapPaint();
}

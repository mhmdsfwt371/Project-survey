   ثلاثةُ أعناقٍ قاستها الأرقام: بحثٌ خطيٌّ في ألفٍ وسبعمئة صف،
   وإحصاءٌ يُعاد حسابُه في كل رسمة، وسحبٌ كاملٌ من القاعدة
   كان سيبلغ ثلاثةَ ملايين قراءةٍ يوميًّا والحدُّ خمسون ألفًا. */

/* ── فهرسٌ للمواقع: بحثٌ فوريٌّ بدل مسحٍ خطي ── */
var SITE_IX = null, SITE_TOK = null;

function siteIndex(){
  if (SITE_IX) return SITE_IX;
  SITE_IX = Object.create(null);
  SITE_TOK = Object.create(null);
  STATE.sites.forEach(function(x, i){
    SITE_IX[x.id] = x;
    /* مفاتيحُ البحث: المعرّف والشاخص والمربع وكلماتُ الاسم */
    var keys = [x.id, x.sign, x.sq];
    String(x.name || '').split(/[\s\-—·]+/).forEach(function(t){ if (t.length > 1) keys.push(t); });
    keys.forEach(function(k){
      k = String(k || '').trim();
      if (!k) return;
      if (!SITE_TOK[k]) SITE_TOK[k] = [];
      if (SITE_TOK[k].length < 400) SITE_TOK[k].push(i);
    });
  });
  return SITE_IX;
}

function siteFind(id){ return siteIndex()[id] || null; }

function siteSearch(q, lim){
  lim = lim || 50;
  q = String(q || '').trim();
  if (!q) return STATE.sites.slice(0, lim);
  siteIndex();
  /* مطابقةٌ تامةٌ أولًا — أسرعُ ما يكون */
  if (SITE_TOK[q]){
    var hit = SITE_TOK[q].slice(0, lim).map(function(i){ return STATE.sites[i]; });
    if (hit.length >= lim) return hit;
  }
  var out = [], seen = Object.create(null);
  if (SITE_TOK[q]) SITE_TOK[q].forEach(function(i){
    if (!seen[i] && out.length < lim){ seen[i] = 1; out.push(STATE.sites[i]); }
  });
  /* ثم بادئةٌ جزئية — تُمسح مفاتيحُ الفهرس لا الصفوفُ كلها */
  if (out.length < lim){
    var ks = Object.keys(SITE_TOK);
    for (var j = 0; j < ks.length && out.length < lim; j++){
      if (ks[j].indexOf(q) < 0) continue;
      SITE_TOK[ks[j]].forEach(function(i){
        if (!seen[i] && out.length < lim){ seen[i] = 1; out.push(STATE.sites[i]); }
      });
    }
  }
  return out;
}

/* ── إحصاءٌ يُحسب مرةً ويُبطَل عند التغيير ── */
var STAT_CACHE = null, STAT_VER = 0;

function statBump(){ STAT_CACHE = null; STAT_VER++; }

function siteStats(){
  if (STAT_CACHE) return STAT_CACHE;
  var s = STATE.sites, by = {}, co = {}, wk = {}, sv = 0, ins = 0;
  for (var i = 0; i < s.length; i++){
    var x = s[i], k = x.zone + '|' + x.type;
    by[k] = (by[k] || 0) + 1;
    if (x.co) co[x.co] = (co[x.co] || 0) + 1;
    if (x.work) wk[x.work] = (wk[x.work] || 0) + 1;
    if (STATE.recs[x.id]) sv++;
    var st = (STATE.inss[x.id] || {}).status;
    if (st === 'مُركّب' || x.fstat === 'مُركّب') ins++;
  }
  STAT_CACHE = { total:s.length, byKey:by, byCo:co, byWork:wk, surveyed:sv, installed:ins };
  return STAT_CACHE;
}

/* ── قائمةٌ افتراضية: تُرسَم دفعةٌ ويُزاد عند الطلب ── */
var LIST_PAGE = 40, LIST_SHOWN = 40, SEL_MODE = false;

/* عدٌّ بلا بناءِ مصفوفة — يُعرَف الإجمالي دون نسخِ الصفوف */
function siteCount(q){
  q = String(q || '').trim();
  if (!q) return STATE.sites.length;
  siteIndex();
  var seen = Object.create(null), n = 0;
  var ks = Object.keys(SITE_TOK);
  for (var j = 0; j < ks.length; j++){
    if (ks[j].indexOf(q) < 0) continue;
    var arr = SITE_TOK[ks[j]];
    for (var i = 0; i < arr.length; i++) if (!seen[arr[i]]){ seen[arr[i]] = 1; n++; }
  }
  return n;
}

function fieldList(){
  var S = siteStats();
  var base = filtered();
  var view, total;
  if (SITE_Q){
    var hits = siteSearch(SITE_Q, 4000);
    if (filtOn()) hits = hits.filter(filtPass);
    total = hits.length;
    view = hits.slice(0, LIST_SHOWN);
  } else {
    total = base.length;
    /* الأقربُ أولًا حين يُعرَف الموقع — والفنيُّ يبدأ بما تحت قدمه */
    if (MYPOS && base.length <= 4000){
      var arr = base.slice();
      arr.sort(function(a, b){ return (distKm(MYPOS, a) || 9e9) - (distKm(MYPOS, b) || 9e9); });
      view = arr.slice(0, LIST_SHOWN);
    } else view = base.slice(0, LIST_SHOWN);
  }
  var L = { length: total };
  return catBar(1) + cardFlush('المواقع — ' + nm(total) + (filtOn() ? ' / ' + nm(S.total) : ''),
    (view.length
      ? '<div class="list">' + view.map(function(x){
          var sv = !!STATE.recs[x.id];
          var a = (typeof asnOf === 'function') ? asnOf(x.id) : null;
          return '<div class="list-item' + (selHas(x.id)?' sel':'') + '" data-site="' + esc(x.id) + '">'
            + (SEL_MODE ? '<input type="checkbox" data-sel="' + esc(x.id) + '"'
                + (selHas(x.id)?' checked':'') + (a?' disabled':'')
                + ' style="width:20px;min-height:20px;flex:0 0 auto">' : '')
            + '<div class="li-main">'
            + '<div class="li-t">' + esc(x.name) + '</div>'
            + '<div class="li-s"><span class="num">' + esc(x.id) + '</span> · '
            +   esc(x.zone) + ' · ' + esc(x.type) + (x.co ? ' · ' + esc(x.co.slice(0, 26)) : '')
            + '</div></div><div class="li-end">'
            + (typeof distTxt === 'function' && distTxt(x)
                ? '<div class="num" style="margin-bottom:3px">\u{1F4CD} ' + distTxt(x) + '</div>' : '')
            + pill(sv ? 'تمت الزيارة' : 'لم يُزر', sv ? 'ok' : 'warn') + '</div></div>';
        }).join('') + '</div>'
        + (L.length > view.length
          ? '<div style="padding:12px 16px;text-align:center">'
            + btn('اعرض ' + nm(Math.min(LIST_PAGE, L.length - view.length)) + ' أخرى — '
                  + nm(L.length - view.length) + ' متبقية','btn-secondary btn-sm',' data-more="1"')
            + '</div>'
          : '')
      : '<p class="hint" style="padding:18px;text-align:center;margin:0">لا نتائج لـ«' + esc(SITE_Q) + '».</p>'),
    '<form class="inline-form" onsubmit="return false">'
    + '<input type="search" id="siteQ" value="' + esc(SITE_Q) + '" placeholder="'
    +   esc(t('ابحث بالمعرّف أو الشاخص أو المربع')) + '" dir="auto">'
    + btn('بحث','btn-secondary btn-sm',' data-sq="1"')
    + '<span class="hint" style="margin:0">' + nm(view.length) + ' / ' + nm(L.length) + '</span>'
    + btn(SEL_MODE ? 'إنهاء التحديد' : '☑ تحديد', SEL_MODE?'btn-primary btn-sm':'btn-secondary btn-sm',
          ' data-selmode="' + (SEL_MODE?0:1) + '"')
    + (SEL_MODE && SEL_N ? btn('أسند ' + nm(SEL_N),'btn-primary btn-sm',' data-asn="1"') : '')
    + '</form>');
}

/* ── الرسم: لا يُعاد إن لم يتغيّر شيء ── */

var CFG_VER = 0;

/* ── السحبُ الفارقي: ما تغيّر بعد آخر مزامنةٍ وحده ── */
function pullDelta(){
  if (!FB.ready || !FB.db) return Promise.resolve(0);
  var since = STATE.meta.lastSync || 0, got = 0;
  return Promise.all(['recs','inss','tasks'].map(function(c){
    var q = FB.db.collection(c);
    if (since) q = q.where('_at', '>', since);
    return q.limit(500).get().then(function(snap){
      snap.forEach(function(doc){
        STATE[c][doc.id] = doc.data();
        got++;
      });
    }).catch(function(){});
  })).then(function(){
    STATE.meta.lastSync = Date.now();
    if (got){ statBump(); CORE.saveSoon(); }
    return got;
  });
}

/* استماعٌ حيٌّ محدودٌ بما يخصّ المستخدم — لا بالمجموعة كلها */
var LIVE = [];
function liveWatch(){
  if (!FB.ready || !FB.db || LIVE.length) return;
  try{
    var me = STATE.meta.uid;
    LIVE.push(FB.db.collection('tasks').where('assignedTo', '==', me).limit(200)
      .onSnapshot(function(snap){
        snap.docChanges().forEach(function(ch){
          if (ch.type === 'removed') delete STATE.tasks[ch.doc.id];
          else STATE.tasks[ch.doc.id] = ch.doc.data();
        });
        statBump();
        if (['map','sites','mine','mywork'].indexOf(CUR) > -1) render();
      }, function(){}));
  }catch(e){}
}

function liveStop(){
  LIVE.forEach(function(u){ try{ u(); }catch(e){} });
  LIVE = [];
}

/* ── حدودُ الاستهلاك — تُعرَض للمهندس ── */
function quotaEstimate(){
  var users = cfgGet('users') || 150;
  var perDay = { survey:20, install:8 };
  var writes = users * (perDay.survey * 3 + perDay.install * 5);
  var reads  = users * 12;              /* سحبٌ فارقيٌّ لا كامل */
  var photos = users * (perDay.survey * 2 + perDay.install * 2);
  return {
    users:users, writes:writes, reads:reads, photos:photos,
    writeCap:20000, readCap:50000,
    writeOver: writes > 20000, readOver: reads > 50000,
    storeDay: Math.round(photos * 180 / 1024)   /* ميجا يوميًّا */
  };
}

/* ═══ الخريطة — Leaflet بطبقتين ومضلّعات المخيمات ═══
   البلاطات بلا مفتاح: OpenStreetMap أساسًا وEsri بديلًا عند التعثّر.
   والوضع الليلي مرشّحٌ على طبقة الأساس وحدها فلا يُقلَب ما فوقها. */

var MAP_ME = null;
var MAP = null, MAP_LAYER = null, MAP_BASE = null, MAP_POLY = null, MAP_CV = null;
var MAP_READY = false, MAP_LOADING = false;
var POLY = null, POLY_LOADING = null;

function POLY_OF(id){ return POLY ? (POLY[id] || null) : null; }

/* المضلّعات ملفٌّ خارجيٌّ يُطلَب مرةً ويُخزَّن محليًّا */
function polyLoad(){
  if (POLY) return Promise.resolve(true);
  if (POLY_LOADING) return POLY_LOADING;
  POLY_LOADING = idbGet('poly').then(function(v){
    if (v){ POLY = v; return true; }
    return fetch('poly.json').then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j) return false;
        POLY = j;
        idbSet('poly', j);
        return true;
      });
  }).catch(function(){ return false; })
    .then(function(ok){ if (ok && MAP) mapPaint(); return ok; });
  return POLY_LOADING;
}

var TILES = {
  osm:  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  esri: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
};

/* ألوان الحالة — المسح ثنائيٌّ والتركيب رباعي */
var MAP_COL = {
  survey:  { 'لم يُزر':'#E8C34B', 'تمت الزيارة':'#4BC9F5' },
  install: { 'لم يبدأ':'#9FB0AA', 'مجدول':'#FF8C42', 'مُركّب':'#3AD6A0', 'متعذّر':'#E05252' }
};

function mapColorOf(x){
  if (CO_SEL.length) return CO_SEL.indexOf(x.co) > -1 ? coColor(x.co) : '#4A5560';
  if (FILT.type && typeof CAT_DEF === 'object' && CAT_DEF[x.type]) return CAT_DEF[x.type].c;
  /* لونُ الطبقة: المنجَزُ بلونها والجاهزُ أصفرُ انتظار والمُسنَدُ برتقالي */
  if (typeof LAYERS === 'object' && LAYERS[FIELD_MODE]){
    var L = LAYERS[FIELD_MODE];
    if (L.done(x)) return L.c;
    if (asnOf(x.id)) return '#FF8C42';
    return '#E8C34B';
  }
  if (FIELD_MODE === 'survey')
    return MAP_COL.survey[STATE.recs[x.id] ? 'تمت الزيارة' : 'لم يُزر'];
  var st = (STATE.inss[x.id] || {}).status || x.fstat || 'لم يبدأ';
  return MAP_COL.install[st] || MAP_COL.install['لم يبدأ'];
}

/* تحميل Leaflet كسولًا — لا يُثقل الإقلاع ولا يُطلَب قبل فتح الخريطة */
function mapLoad(){
  if (MAP_READY) return Promise.resolve(true);
  if (typeof window === 'undefined') return Promise.resolve(false);
  if (window.L){ MAP_READY = true; return Promise.resolve(true); }
  if (MAP_LOADING) return MAP_LOADING;

  MAP_LOADING = new Promise(function(res){
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);

    var js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload  = function(){ MAP_READY = true; res(true); };
    js.onerror = function(){ res(false); };
    document.head.appendChild(js);

    setTimeout(function(){ if (!MAP_READY) res(false); }, 9000);
  });
  return MAP_LOADING;
}

function mapInit(){
  var el = document.getElementById('mapBox');
  if (!el || !window.L) return false;
  if (MAP){
    try{ MAP.invalidateSize(); }catch(e){}
    setTimeout(function(){ try{ MAP.invalidateSize(); mapPaint(); }catch(e){} }, 60);
    mapPaint();
    return true;
  }

  MAP = L.map(el, { preferCanvas:true, zoomControl:false, attributionControl:true })
         .setView([21.38, 39.92], 12);
  L.control.zoom({ position:'topleft' }).addTo(MAP);

  MAP_BASE = L.tileLayer(MAP_SAT ? TILES.esri : TILES.osm, {
    maxZoom:19, className:'nskBase', crossOrigin:true,
    attribution: MAP_SAT ? '&copy; Esri' : '&copy; OpenStreetMap'
  }).addTo(MAP);

  /* بديلٌ تلقائيٌّ مرةً واحدةً عند تعثّرٍ متكرّر */
  var errs = 0, swapped = false;
  MAP_BASE.on('tileerror', function(){
    if (swapped || ++errs < 8) return;
    swapped = true;
    MAP_BASE.setUrl(TILES.esri);
    MAP_BASE.options.attribution = '&copy; Esri';
    toast('تعذّر المزوّد — تحوّلنا لبديل');
  });

  MAP_CV    = L.canvas({ padding:0.3 });
  MAP_POLY  = L.layerGroup().addTo(MAP);
  MAP_LAYER = L.layerGroup().addTo(MAP);

  MAP.on('zoomend moveend', mapPaintDebounced);
  MAP.on('click', function(e){
    if (typeof MOVE_ID !== 'undefined' && MOVE_ID) moveApply(e.latlng.lat, e.latlng.lng);
  });
  mapPaint();
  setTimeout(function(){ try{ MAP.invalidateSize(); mapPaint(); }catch(e){} }, 120);
  return true;
}

/* الرسم — نقاطٌ دائمًا، ومضلّعاتٌ عند التقريب وحده */
var _mapT = 0;
function mapPaintDebounced(){
  clearTimeout(_mapT);
  _mapT = setTimeout(mapPaint, 120);
}

function mapPaint(){
  if (!MAP || !MAP_LAYER) return;
  MAP_LAYER.clearLayers();
  if (MAP_POLY) MAP_POLY.clearLayers();

  var b = MAP.getBounds(), z = MAP.getZoom();
  var r = z >= 16 ? 7 : (z >= 14 ? 5 : (z >= 12 ? 3.5 : 2.5));
  var shown = 0, cap = 4000;

  var LIST = (typeof layerFiltered === 'function') ? layerFiltered() : STATE.sites;
  for (var i = 0; i < LIST.length && shown < cap; i++){
    var x = LIST[i];
    if (!x.lat || !x.lng) continue;
    if (!b.contains([x.lat, x.lng])) continue;
    shown++;
    var picked = (typeof selHas === 'function') && selHas(x.id);
    var col = mapColorOf(x);
    var mk;

    /* الممرُّ معيّنٌ مائل، والمخيمُ مضلّعٌ إن تقرّبت وإلا دائرة، وما عداهما دائرة —
       فيُعرَف النوعُ بالشكل قبل أن يُقرَأ اللون. */
    if (x.type === 'ممر' || x.type === 'كاميرا'){
      var ds = z >= 16 ? 22 : (z >= 14 ? 17 : 12);
      mk = L.marker([x.lat, x.lng], { keyboard:false, icon:L.divIcon({
        className:'mkC', iconSize:[ds, ds], iconAnchor:[ds/2, ds/2], popupAnchor:[0, -ds/2],
        html:'<i style="background:' + col + (picked ? ';outline:2px solid #fff' : '') + '"></i>'
      })});
    } else if (x.type === 'مخيم' && z >= 16 && POLY && POLY[x.id]){
      mk = L.polygon(POLY[x.id].map(function(p){ return [p[1], p[0]]; }), {
        renderer:MAP_CV, color:col, weight: picked ? 2.4 : 1.3,
        fillColor:col, fillOpacity: picked ? 0.5 : 0.32
      });
    } else {
      mk = L.circleMarker([x.lat, x.lng], {
        renderer:MAP_CV,
        radius: picked ? r + 2.5 : r,
        color: picked ? '#fff' : col,
        weight: picked ? 2 : (z >= 14 ? 1.3 : 1),
        fillColor:col, fillOpacity: picked ? 1 : 0.6
      });
    }
    mk.on('click', (function(id){
      return function(){
        if (typeof MAP_SELECT !== 'undefined' && MAP_SELECT){
          if (!asnOf(id)){ selToggle(id); mapPaint(); render(1); }
          else toast(t('هذه النقطة مُسندة بالفعل'));
          return;
        }
        POP_SITE = id; POP_OPEN = true; render();
      };
    })(x.id));
    mk.addTo(MAP_LAYER);
  }

  /* المضلّعات ثقيلة — لا تُرسم إلا قريبًا وللمخيمات وحدها */
  if (z >= 16 && !POLY) polyLoad();

  var lb = document.getElementById('mapCount');
  if (lb) lb.textContent = nm(shown) + (shown >= cap ? '+' : '') + ' / ' + nm(LIST.length);
}

function mapFly(id){
  var x = siteFind(id);
  if (x && MAP) MAP.setView([x.lat, x.lng], 18);
}

function mapLocate(){
  if (!navigator.geolocation){ toast(t('تعذّر تحديد الموقع')); return; }
  toast(t('يُلتقَط موضعك…'));
  navigator.geolocation.getCurrentPosition(
    function(p){
      MYPOS = { lat:p.coords.latitude, lng:p.coords.longitude, at:Date.now() };
      if (MAP) MAP.setView([MYPOS.lat, MYPOS.lng], 17);
      /* علامةٌ تبقى فيُعرَف أين هو */
      try{
        if (MAP_ME) MAP.removeLayer(MAP_ME);
        MAP_ME = L.circleMarker([MYPOS.lat, MYPOS.lng], {
          radius:8, color:'#fff', weight:3, fillColor:'#4FA3FF', fillOpacity:1
        }).addTo(MAP);
      }catch(e){}
      toast(t('موضعُك'));
      render(1);
    },
    function(){ toast(t('تعذّر تحديد الموقع')); },
    { enableHighAccuracy:true, timeout:10000 });
}

/* الوضع الليلي على طبقة الأساس وحدها */
function mapTheme(){
  var el = document.getElementById('mapBox');
  if (el) el.classList.toggle('tdark',
    document.documentElement.getAttribute('data-theme') !== 'light');
}


/* تبديلُ طبقة الأساس — خريطةٌ أو قمرٌ صناعي */
function mapSat(on){
  MAP_SAT = !!on;
  if (!MAP || !MAP_BASE) return;
  MAP_BASE.setUrl(MAP_SAT ? TILES.esri : TILES.osm);
  MAP_BASE.options.attribution = MAP_SAT ? '&copy; Esri' : '&copy; OpenStreetMap';
  var el = document.getElementById('mapBox');
  /* القمرُ صورةٌ حقيقية — لا يُقلَب في الوضع الداكن */
  if (el) el.classList.toggle('sat', MAP_SAT);

/* ═══ التصدير والاستيراد — بالبيانات الحقيقية ═══

var XLSX_READY = false, XLSX_LOADING = null;

function xlsxLoad(){
  if (XLSX_READY || (typeof window !== 'undefined' && window.XLSX)){ XLSX_READY = true; return Promise.resolve(true); }
  if (XLSX_LOADING) return XLSX_LOADING;
  XLSX_LOADING = new Promise(function(res){
    var s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload  = function(){ XLSX_READY = true; res(true); };
    s.onerror = function(){ res(false); };
    document.head.appendChild(s);
    setTimeout(function(){ if (!XLSX_READY) res(false); }, 12000);
  });
  return XLSX_LOADING;
}

function dl(blob, name){
  try{
    var u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 400);
    return true;
  }catch(e){ return false; }
}

/* ── KMZ — ZIP مكتوبٌ بالكود بلا مكتبة ── */
function crc32(buf){
  var c, tbl = crc32.t;
  if (!tbl){
    tbl = crc32.t = new Int32Array(256);
    for (var n = 0; n < 256; n++){
      c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      tbl[n] = c;
    }
  }
  var crc = -1;
  for (var i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ tbl[(crc ^ buf[i]) & 0xFF];
  return (crc ^ -1) >>> 0;
}

function zipStore(name, bytes){
  var nb = new TextEncoder().encode(name), cr = crc32(bytes);
  function u32(v){ return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]; }
  function u16(v){ return [v&255,(v>>>8)&255]; }
  var lf = [].concat([80,75,3,4], u16(20), u16(0), u16(0), u16(0), u16(0),
                     u32(cr), u32(bytes.length), u32(bytes.length),
                     u16(nb.length), u16(0));
  var local = new Uint8Array(lf.length + nb.length + bytes.length);
  local.set(lf, 0); local.set(nb, lf.length); local.set(bytes, lf.length + nb.length);
  var cf = [].concat([80,75,1,2], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
                     u32(cr), u32(bytes.length), u32(bytes.length),
                     u16(nb.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(0));
  var central = new Uint8Array(cf.length + nb.length);
  central.set(cf, 0); central.set(nb, cf.length);
  var end = [].concat([80,75,5,6], u16(0), u16(0), u16(1), u16(1),
                      u32(central.length), u32(local.length), u16(0));
  var out = new Uint8Array(local.length + central.length + end.length);
  out.set(local, 0); out.set(central, local.length);
  out.set(new Uint8Array(end), local.length + central.length);
  return out;
}

var KMZ_STY = {
  'مخيم':'camp', 'ممر':'cor', 'كاميرا':'cam', 'محطة':'stn',
  'جسر':'jam', 'بوابة':'gte', 'مبنى':'bld'

function kmzBuild(filter, title){
  var X = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var K = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>',
    '<name>' + X(title) + '</name>',
    '<Style id="camp"><IconStyle><scale>0.8</scale><color>ff4ac9f9</color></IconStyle></Style>',
    '<Style id="cor"><IconStyle><scale>0.8</scale><color>ffa0d63a</color></IconStyle></Style>',
    '<Style id="cam"><IconStyle><scale>0.8</scale><color>ffff7dc7</color></IconStyle></Style>',
    '<Style id="stn"><IconStyle><scale>0.8</scale><color>ff60c9f2</color></IconStyle></Style>',
    '<Style id="jam"><IconStyle><scale>0.8</scale><color>ff3a87e8</color></IconStyle></Style>',
    '<Style id="gte"><IconStyle><scale>0.8</scale><color>ffacb238</color></IconStyle></Style>',
    '<Style id="bld"><IconStyle><scale>0.8</scale><color>ffbfc4b8</color></IconStyle></Style>'];
  var folders = {}, n = 0;
  STATE.sites.forEach(function(x){
    if (filter && !filter(x)) return;
    if (!x.lat || !x.lng) return;
    n++;
    var f = x.zone + ' — ' + x.type;
    if (!folders[f]) folders[f] = [];
    folders[f].push('<Placemark><name>' + X(x.id) + '</name>'
      + '<description><![CDATA[' + X(x.name)
      + (x.sign ? '<br>شاخص: ' + X(x.sign) : '')
      + (x.sq   ? '<br>مربع: '  + X(x.sq)   : '')
      + (x.co   ? '<br>' + X(x.co) : '') + ']]></description>'
      + '<styleUrl>#' + (KMZ_STY[x.type] || 'bld') + '</styleUrl>'
      + '<Point><coordinates>' + x.lng + ',' + x.lat + ',0</coordinates></Point></Placemark>');
  });
  Object.keys(folders).forEach(function(f){
    K.push('<Folder><name>' + X(f) + ' (' + folders[f].length + ')</name>');
    K.push(folders[f].join(''));
    K.push('</Folder>');
  });
  K.push('</Document></kml>');
  return { xml:K.join('\n'), count:n };
}

function kmzExport(kind){
  var f = null, title = 'نُسُك — قارئات RFID ١٤٤٨هـ', name = 'nusuk.kmz';
  if (kind === 'main'){
    f = function(x){ return x.zone === 'منى' || x.zone === 'عرفات'; };
    title = 'نُسُك — منى وعرفات · ١٤٤٨هـ'; name = 'nusuk-mina-arafat.kmz';
  } else if (kind === 'co'){
    f = function(x){ return !CO_SEL.length || CO_SEL.indexOf(x.co) > -1; };
    title = 'نُسُك — بلون الشركة'; name = 'nusuk-companies.kmz';
  } else if (kind === 'redo'){
    f = function(x){ return x.work === 'إعادة تركيب ١٤٤٧'; };
    title = 'نُسُك — إعادة تركيب ١٤٤٧'; name = 'nusuk-redo-1447.kmz';
  } else if (kind === 'sel'){
    f = function(x){ return SEL_IDS.indexOf(x.id) > -1; };
    title = 'نُسُك — المحدَّد'; name = 'nusuk-selected.kmz';
  }
  var b = kmzBuild(f, title);
  if (!b.count){ toast('لا نقاط في هذا التحديد'); return false; }
  var zip = zipStore('doc.kml', new TextEncoder().encode(b.xml));
  var ok = dl(new Blob([zip], { type:'application/vnd.google-earth.kmz' }), name);
  toast(ok ? (nm(b.count) + ' ' + t('نقطةً في الملف')) : 'تعذّر التنزيل');
  return ok;

var IMP_COLS = {
  sites: ['المعرّف','المشعر','النوع','الشاخص','المربع','الشركة','خط العرض','خط الطول'],
  ips:   ['معرّف الموقع','بادئة الشبكة','الراوتر','القارئ','الكاميرا'],

  stock: ['الصنف','الكمية','المورّد','التاريخ','رقم الفاتورة'],
  buys:  ['التاريخ','الصنف','الفئة','المشعر','الكمية','سعر الوحدة','المورّد']

function impTemplate(kind){
  return xlsxLoad().then(function(ok){
    if (!ok){ toast('تعذّر تحميل محرّك إكسل'); return false; }
    var cols = IMP_COLS[kind] || [];
    var rows = [cols];
    /* صفٌّ نموذجيٌّ من بياناتٍ حقيقيةٍ يُحتذى */
    if (kind === 'sites' && STATE.sites.length){
      var x = STATE.sites[0];
      rows.push([x.id, x.zone, x.type, x.sign, x.sq, x.co, x.lat, x.lng]);
    } else if (kind === 'items' && DATA.items.length){
      var i = DATA.items[0];
      rows.push([i[0]==='cor'?'ممر':'مخيم', i[2], itPts(i[1]), itPrep(i[1]), itAsm(i[1]), itPrice(i[1])]);
    } else if (kind === 'ips' && STATE.sites.length){
      rows.push([STATE.sites[0].id, '10.20.30', '.1', '.2', '.3']);
    } else {
      rows.push(cols.map(function(){ return ''; }));
    }
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = cols.map(function(c){ return { wch:Math.max(14, c.length + 4) }; });
    XLSX.utils.book_append_sheet(wb, ws, 'القالب');
    XLSX.writeFile(wb, 'قالب-' + kind + '.xlsx');
    return true;
  });
}

var IMP_PREVIEW = null;

function impRead(kind, file){
  return xlsxLoad().then(function(ok){
    if (!ok) return null;
    return new Promise(function(res){
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          res(impValidate(kind, rows));
        }catch(e){ res(null); }
      };
      fr.onerror = function(){ res(null); };
      fr.readAsArrayBuffer(file);
    });
  });
}

function impValidate(kind, rows){
  var cols = IMP_COLS[kind] || [], head = rows[0] || [];
  var missing = cols.filter(function(c){ return head.indexOf(c) < 0; });
  var okRows = [], bad = [];
  for (var i = 1; i < rows.length; i++){
    var r = rows[i];
    if (!r || !r.length || r.every(function(v){ return v === ''; })) continue;
    var why = '';
    if (kind === 'sites'){
      if (!r[0]) why = 'بلا معرّف';
      else if (!siteFind(String(r[0]).trim())) why = 'معرّف غير موجود';
    } else if (kind === 'items'){
      var z = String(r[0]||'').trim();
      if (z !== 'مخيم' && z !== 'ممر') why = 'المنطقة إما مخيم أو ممر';
      else if (!r[1]) why = 'بلا اسم';
    } else if (kind === 'buys'){
      if (DATA.buyCats.indexOf(String(r[2]||'').trim()) < 0) why = 'فئة غير معتمدة';
      else if (DATA.suppliers.indexOf(String(r[6]||'').trim()) < 0) why = 'مورّد غير معتمد';
    } else if (!r[0]) why = 'الحقل الأول فارغ';
    if (why) bad.push({ row:i+1, why:why, data:r });
    else okRows.push(r);
  }
  IMP_PREVIEW = { kind:kind, missing:missing, ok:okRows, bad:bad, head:head };
  return IMP_PREVIEW;
}

function impApply(){
  var p = IMP_PREVIEW;
  if (!p || !p.ok.length) return 0;
  var n = 0;
  p.ok.forEach(function(r){
    if (p.kind === 'items'){
      var id = 'imp_' + (++n);
      cfgSet('itPts', id, r[2]); cfgSet('itPrep', id, r[3]);
      cfgSet('itAsm', id, r[4]); cfgSet('itPrice', id, r[5]);
      DATA.items.push([String(r[0]).trim()==='ممر'?'cor':'camp', id, String(r[1]), 0, 0, 0, 0]);
    } else if (p.kind === 'sites'){
      var s = siteFind(String(r[0]).trim());
      if (s){ if (r[3]) s.sign = String(r[3]); if (r[4]) s.sq = String(r[4]);
              if (r[5]) s.co = String(r[5]); n++; }
    } else { n++; }
  });
  CORE.dirty(p.kind, 'import', { at:Date.now(), n:n });
  IMP_PREVIEW = null;
  return n;
}

/* ═══ عامل الخدمة — التطبيق يفتح بلا شبكة ═══
   القشرة تُكاش عند التثبيت، والملفات الثقيلة عند أول طلب،
   والصفحاتُ شبكةٌ أولًا فإن تعذّرت فمن الكاش — فلا يُعرض قديمٌ وشبكةٌ حاضرة. */

var SW_SRC = [
"const V = 'nusuk-v14-1';",
"const SHELL = ['./', './index.html'];",
"const HEAVY = ['./poly.json'];",
"",
"self.addEventListener('install', e => {",
"  self.skipWaiting();",
"  e.waitUntil(caches.open(V).then(c => c.addAll(SHELL).catch(() => null)));",
"});",
"",
"self.addEventListener('activate', e => {",
"  e.waitUntil(caches.keys().then(ks =>",
"    Promise.all(ks.filter(k => k !== V).map(k => caches.delete(k)))",
"  ).then(() => self.clients.claim()));",
"});",
"",
"function timed(req, ms){",
"  return new Promise((res, rej) => {",
"    const t = setTimeout(() => rej(new Error('t')), ms);",
"    fetch(req).then(r => { clearTimeout(t); res(r); }, e => { clearTimeout(t); rej(e); });",
"  });",
"}",
"",
"self.addEventListener('fetch', e => {",
"  const req = e.request;",
"  if (req.method !== 'GET') return;",
"  const url = new URL(req.url);",
"",
"  /* لا يُكاش ما يخصّ قاعدة البيانات ولا المصادقة */",
"  if (/firestore|googleapis|identitytoolkit|gstatic/.test(url.host)) return;",
"",
"  /* الصفحة: شبكةٌ أولًا بمهلةٍ ثم الكاش */",
"  if (req.mode === 'navigate'){",
"    e.respondWith(",
"      timed(new Request(req.url, { cache:'reload' }), 3500)",
"        .then(r => { if (r && r.status === 200) caches.open(V).then(c => c.put('./index.html', r.clone())); return r; })",
"        .catch(() => caches.match('./index.html').then(h => h || caches.match(req)))",
"    );",
"    return;",
"  }",
"",
"  /* الثقيل والبلاطات والمكتبات: كاشٌ أولًا ثم شبكةٌ تُخزَّن */",
"  e.respondWith(",
"    caches.match(req).then(hit => hit || fetch(req).then(r => {",
"      if (r && r.status === 200 && (url.origin === location.origin",
"          || /unpkg|cdn\\.sheetjs|tile\\.openstreetmap|arcgisonline/.test(url.host))){",
"        const cl = r.clone();",
"        caches.open(V).then(c => c.put(req, cl));",
"      }",
"      return r;",
"    }).catch(() => hit))",
"  );",
"});",
"",
"self.addEventListener('message', e => {",
"  if (e.data === 'skip') self.skipWaiting();",
"  if (e.data === 'clear') caches.keys().then(ks => ks.forEach(k => caches.delete(k)));",
"});"
].join('\n');

var SW_STATE = { reg:null, ok:false, waiting:false };

function swInstall(){
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return Promise.resolve(false);
  /* يُولَّد من الشيفرة نفسها فلا يحتاج ملفًا ثانيًا يُنسى تحديثُه */
  try{
    var blob = new Blob([SW_SRC], { type:'text/javascript' });
    var url  = URL.createObjectURL(blob);
    return navigator.serviceWorker.register(url, { scope:'./' })
      .then(function(r){
        SW_STATE.reg = r; SW_STATE.ok = true;
        r.addEventListener('updatefound', function(){
          var nw = r.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            if (nw.state === 'installed' && navigator.serviceWorker.controller){
              SW_STATE.waiting = true;
              toast(t('نسخةٌ جديدةٌ جاهزة — أغلق التطبيق وافتحه'));
            }
          });
        });
        return true;
      })
      .catch(function(){ return false; });
  }catch(e){ return Promise.resolve(false); }
}

function swClear(){
  if (SW_STATE.reg && SW_STATE.reg.active) SW_STATE.reg.active.postMessage('clear');
  if (typeof caches !== 'undefined') caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
  toast(t('أُفرغ الكاش'));
}

/* حجمُ ما خُزّن — يُعرَض في عمر البيانات */
function cacheSize(){
  if (typeof navigator === 'undefined' || !navigator.storage || !navigator.storage.estimate)
    return Promise.resolve(null);
  return navigator.storage.estimate().then(function(e){
    return { used:e.usage || 0, quota:e.quota || 0 };
  }).catch(function(){ return null; });
}

function loginBg(){
  var cv = document.getElementById('loginCv');
  if (!cv) return;
  var ctx = null;
  try{ ctx = cv.getContext('2d'); }catch(e){}
  if (!ctx) { cv.style.display = 'none'; return; }   /* زينة تُهمَل لا تُسقط الصفحة */
  var raf = 0, pts = [], lit = 0;
  var slow = false;
  try{ slow = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  function build(){
    var w = cv.width = cv.offsetWidth * (window.devicePixelRatio || 1);
    var h = cv.height = cv.offsetHeight * (window.devicePixelRatio || 1);
    pts = [];
    var cols = Math.max(24, Math.round(w / 26));
    var rows = Math.ceil(DATA.total / cols);
    var gx = w / (cols + 1), gy = Math.min(gx, h / (rows + 1));
    var oy = (h - gy * (rows - 1)) / 2;
    for (var i = 0; i < DATA.total; i++){
      var c = i % cols, r = Math.floor(i / cols);
      pts.push({
        x: gx * (c + 1) + (Math.sin(i * 12.9898) * gx * 0.18),
        y: oy + gy * r + (Math.cos(i * 78.233) * gy * 0.18),
        d: (i / DATA.total) + Math.abs(Math.sin(i * 4.1)) * 0.12
      });
    }
  }

  function draw(prog){
    var w = cv.width, h = cv.height, dpr = window.devicePixelRatio || 1;
    ctx.clearRect(0, 0, w, h);
    var n = 0;
    for (var i = 0; i < pts.length; i++){
      var p = pts[i], on = p.d <= prog;
      if (on) n++;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (on ? 1.9 : 1.05) * dpr, 0, 6.2832);
      ctx.fillStyle = on ? 'rgba(55,138,221,.9)' : 'rgba(90,102,115,.24)';
      ctx.fill();
      if (on && i % 17 === 0){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5.5 * dpr, 0, 6.2832);
        ctx.fillStyle = 'rgba(55,138,221,.10)';
        ctx.fill();
      }
    }
    var c = document.getElementById('lgCount');
    if (c) c.innerHTML = nm(n) + ' / ' + nm(DATA.total) + ' ' + esc(t('نقطة')) + ' · ' + esc(t('المشاعر المقدسة'));
  }

  build();
  if (slow){ draw(1); return; }

  function tick(){
    lit += 0.0055;
    if (lit > 1.12) lit = 0;
    draw(Math.min(1, lit));
    raf = requestAnimationFrame(tick);
  }
  tick();

  window.addEventListener('resize', function(){ build(); }, { passive:true });
  cv.__stop = function(){ cancelAnimationFrame(raf); };
}

  var rows = [];
  if (FIELD_MODE === 'survey'){
    rows = [['#E8C34B','لم يُزر'], ['#FF8C42','مُسند'], [L.c,'تمت الزيارة']];
  } else if (FIELD_MODE === 'install'){
    rows = [['#E8C34B','بانتظار التركيب'], ['#FF8C42','مُسند'], [L.c,'مُركّب']];
  } else {
    rows = [['#E8C34B','قابل للفك'], ['#FF8C42','مجدول للفك'], [L.c,'تم الفك']];
  }
  var out = rows.map(function(r){
    return '<div class="lg-row"><i class="lg-dot" style="background:' + r[0] + '"></i>'
      + esc(t(r[1])) + '</div>';
  }).join('');
  /* الأشكالُ — تُذكَر مرةً في آخر الأسطورة */
  out += '<div class="lg-sep"></div>'
    + '<div class="lg-row"><i class="lg-sh sh-c"></i>' + esc(t('مخيم')) + '</div>'
    + '<div class="lg-row"><i class="lg-sh sh-d"></i>' + esc(t('ممر · كاميرا')) + '</div>'
    + '<div class="lg-row"><i class="lg-sh sh-o"></i>' + esc(t('محطة · جسر · بوابة')) + '</div>';
  return out;
}

/* تعذّر تحميل Leaflet — تُعرَض قائمةٌ بدل خريطةٍ فارغة */
function mapFallback(){
  var el = document.getElementById('mapBox');
  if (!el) return;
  el.innerHTML = '<div style="padding:22px;color:#9BA5AF;font-size:13.5px;line-height:1.9">'
    + esc(t('تعذّر تحميل الخريطة — تعمل بلا شبكة أو تعذّر المزوّد.')) + '<br>'
    + esc(t('المواقع متاحةٌ من تبويب «المواقع» وبحثها يعمل محليًّا.')) + '</div>';
}

function _mapDrawOld(){
  var cv = document.getElementById('mapCv');
  if (!cv) return;
  var ctx = null;
  try{ ctx = cv.getContext('2d'); }catch(e){}
  if (!ctx) return;
  var dpr = window.devicePixelRatio || 1;
  var w = cv.width = cv.offsetWidth * dpr, h = cv.height = cv.offsetHeight * dpr;
  ctx.fillStyle = '#0A0D10'; ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = 'rgba(120,132,146,.07)'; ctx.lineWidth = 1;
  for (var g = 0; g < w; g += 46 * dpr){ ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g,h); ctx.stroke(); }
  for (var g2 = 0; g2 < h; g2 += 46 * dpr){ ctx.beginPath(); ctx.moveTo(0,g2); ctx.lineTo(w,g2); ctx.stroke(); }

  var col = FIELD_MODE === 'survey' ? '#E8C34B' : '#9FB0AA';
  var clusters = [
    {cx:.30, cy:.34, n:713, r:.15},
    {cx:.66, cy:.44, n:679, r:.14},
    {cx:.72, cy:.70, n:190, r:.09},
    {cx:.44, cy:.78, n:108, r:.07},
    {cx:.22, cy:.62, n:97,  r:.06}
  ];
  var seed = 1;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  clusters.forEach(function(c){
    var shown = Math.min(c.n, 260);
    for (var i = 0; i < shown; i++){
      var a = rnd() * 6.2832, d = Math.sqrt(rnd()) * c.r;
      var x = (c.cx + Math.cos(a) * d) * w;
      var y = (c.cy + Math.sin(a) * d * 1.25) * h;
      ctx.beginPath();
      ctx.arc(x, y, 2.4 * dpr, 0, 6.2832);
      ctx.fillStyle = col;
      ctx.globalAlpha = .82;
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  ctx.font = (13 * dpr) + 'px system-ui';
  ctx.fillStyle = 'rgba(232,235,238,.6)';
  ctx.textAlign = 'center';
  [['عرفات',.30,.16],['منى',.66,.26],['قطار المشاعر',.44,.88]].forEach(function(L){
    ctx.fillText(t(L[0]), L[1] * w, L[2] * h);
  });
}

function stageBar(){
  return '<div class="card"><div class="card-body">'
    + '<div class="flow" style="justify-content:space-between">'
    + STAGES.map(function(s,i){
        var p = s.tot ? Math.round(s.done/s.tot*100) : 0;
        var cls = p >= 100 ? ' done' : (p > 0 ? ' on' : '');
        return '<span class="flow-step'+cls+'" style="flex:1;text-align:center;min-width:0">'
          + s.ic + ' ' + esc(t(s.n)) + '<br><span class="num" style="font-size:11px;opacity:.8">'
          + nm(p) + '٪</span></span>'
          + (i < STAGES.length-1 ? '<span class="flow-arr">\u2190</span>' : '');
      }).join('')
    + '</div></div></div>';
}

function prepAsm(pg){
  var get = pg === 'prep' ? itPrep : itAsm;
  var path = pg === 'prep' ? 'itPrep' : 'itAsm';
  var on = DATA.items.filter(function(i){ return get(i[1]) > 0; });
  var tot = on.reduce(function(a,i){ return a + get(i[1]); }, 0);
  var h = '<p class="lede" style="margin:0 0 16px">' + (pg === 'prep'
      ? 'التهيئة عملُ الورشة قبل النزول: ضبط الجهاز وعنوانه ونظامه وفحصه. وهي للأجهزة ذات الإعداد وحدها — الكاميرات والقارئات والراوترات والحساسات والجيت واي.'
      : 'التجميع تركيب ما يدخل البوكس وتوصيله قبل النزول. وهو للمكوّنات التي تُجمَّع داخله وحدها.')
    + '</p>';
  if (!on.length){
    h += card('', '<p class="hint" style="text-align:center;margin:0">'
      + (pg==='prep'?'لا أجهزة في التهيئة بعد.':'لا مكوّنات في التجميع بعد.') + '</p>');
  } else {
    h += stats([[pg==='prep'?'أجهزة في التهيئة':'مكوّنات في التجميع', N(on.length), 'acc'],
                ['إجمالي النقاط', N(tot)]])
      + cardFlush((pg==='prep'?'أجهزة التهيئة':'مكوّنات التجميع') + ' — ' + nm(on.length),
          table(['الجهاز','المنطقة','النقاط',''],
            on.map(function(i){
              return [esc(i[2]), esc(t(i[0]==='cor'?'ممر':'مخيم')),
                      cfgInput(path, i[1], { dec:1 }),
                      btn('أخرِج','btn-quiet btn-sm')];
            })),
          btn('➕ ' + (pg==='prep'?'أضِف جهازًا':'أضِف مكوّنًا'),'btn-primary btn-sm'));
  }
  h += cfgAddStage(path, pg)

var CUR = 'map';
var OPEN = {};

function isField(id){ return ['map','sites','recs','tools'].indexOf(id) > -1; }

var NAV_Q = '';

function arNorm(x){
  return String(x || '')
    .replace(/[\u064B-\u0652\u0640]/g, '')      /* تشكيلٌ وتطويل */
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/^ال/, '').replace(/\s+/g, ' ')
    .toLowerCase().trim();
}

/* حروفُ الاستعلام بالترتيب وإن تخلّلها غيرُها — «تقرير» تجد «التقارير» */
function subseq(hay, needle){
  var i = 0;
  for (var j = 0; j < hay.length && i < needle.length; j++)
    if (hay[j] === needle[i]) i++;
  return i === needle.length;
}

function navMatch(label, key){
  if (!NAV_Q) return true;
  var q = arNorm(NAV_Q);
  if (!q) return true;
  var a = arNorm(label), b = arNorm(t(label)), k = String(key).toLowerCase();
  return a.indexOf(q) > -1 || b.indexOf(q) > -1 || k.indexOf(q) > -1
      || subseq(a, q) || subseq(b, q) || subseq(k, q);
}

  var box = '<div style="padding:0 2px 8px">'
    + '<input id="navQ" type="search" value="' + esc(NAV_Q) + '" placeholder="'
    + esc(t('ابحث في القائمة')) + '" '
    + 'style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);'
    + 'color:var(--sidebar-ink);min-height:38px;font-size:13px" aria-label="'
    + esc(t('ابحث في القائمة')) + '"></div>';
  return box + NAV.map(function(s){
    if (s.solo){
      if (!seesPage(s.id)) return '';
      if (!navMatch(s.label, s.id)) return '';
      return '<a href="#" class="'+(CUR===s.id?'active':'')+'" data-p="'+s.id+'">'
        + '<span class="item-icon" aria-hidden="true">'+s.icon+'</span>'+esc(t(s.label))+'</a>';
    }
    var items = s.items.filter(function(i){ return seesPage(i[0]) && navMatch(i[1], i[0]); });
    if (!items.length) return '';
    var open = NAV_Q ? true : (items.some(function(i){ return i[0] === CUR; }) || OPEN[s.g]);
    return '<div class="nav-section" data-open="'+(open?'true':'false')+'" data-g="'+esc(s.g)+'">'
      + '<button type="button" class="group-toggle" data-gt aria-expanded="'+(open?'true':'false')+'">'
      + '<span class="group-label"><span class="item-icon" aria-hidden="true">'+s.icon+'</span>'+esc(t(s.g))+'</span>'
      + '<span class="chevron" aria-hidden="true"></span></button><div class="group-panel">'
      + items.map(function(i){
          return '<a href="#" class="sub'+(CUR===i[0]?' active':'')+'" data-p="'+i[0]+'">'+esc(t(i[1]))+'</a>';
        }).join('')
      + '</div></div>';
  }).join('');
}

  map:   { m:'الميدان', t:'الخريطة', full:true, body:function(){ return ''; } },
  sites: { m:'الميدان', t:'المواقع', l:'الأقرب أولًا — وبحث بالشاخص.', body:fieldList },
  recs:  { m:'الميدان', t:'السجلات', l:'ما جرى في الميدان بالترتيب.', body:fieldRecords },
  tools: { m:'الميدان', t:'الأدوات', l:'التصديرات والمزامنة.', body:fieldTools }
};

function render(force){
  var key = (typeof renderKey === 'function') ? renderKey() : String(Math.random());
  if (!force && key === RENDER_KEY && document.getElementById('content')
      && document.getElementById('content').children.length) return;
  RENDER_KEY = key; RENDER_N++;

  if (!seesPage(CUR)){
    var n = R().nav;
    CUR = (n === '*') ? 'map' : n[0];
  }
  var p = FIELD_PAGES[CUR] || PAGE[CUR];
  if (!p) p = PAGE.over;

  document.getElementById('nav').innerHTML = navHtml();
  document.getElementById('crumb').textContent = t(p.t);
  document.getElementById('brandName').innerHTML =
      esc(t('قارئات نُسُك')) + '<div class="brand-sub">' + esc(t('حج ١٤٤٨هـ')) + '</div>';
  document.getElementById('whoRole').textContent = t(R().n) + ' — ' + t(R().d);
  document.getElementById('outBtn').textContent  = t('تسجيل الخروج');
  document.getElementById('syncMeta').innerHTML  =
      '<span class="dot"></span>' + esc(t('آخر مزامنة')) + ' <span class="num">٠٢:٥١</span>';

  var c  = document.getElementById('content');
  var mw = document.getElementById('mapWrap');
  var mu = document.getElementById('mapUI');

  if (CUR === 'map'){
    /* لا يُمَسُّ #mapBox — تُرسَم واجهتُه في طبقةٍ فوقه وحدها */
    if (mw) mw.hidden = false;
    c.hidden = true;
    c.innerHTML = '';
    if (mu){
      mu.innerHTML = mapUIHtml();
      /* وقتَ التحديد أو النقل: الشاشةُ للعمل — تُخفى الأسطورةُ والعدّاد */
      var busy = MAP_SELECT || MOVE_ID;
      mu.classList.toggle('map-busy', !!busy);
    }
    mapDraw();
    if (MAP) mapPaint();
    if (mu) labelCells(mu);
    return;
  }

  if (mw) mw.hidden = true;
  c.hidden = false;
  c.className = 'content' + (p.full ? ' flush' : '');
  /* التصدير مكانه المتابعة: الوزارة تُصدّر تقاريرها وإن لم تملك التصدير الكامل */
  var head = p.full ? '' : pageHead(p.m, p.t, p.l,
    (p.m === 'المتابعة' || may('exportAll'))
      ? btn('تصدير','btn-secondary',' data-exp="1"') : '');
  c.innerHTML = p.full ? p.body() : (head + p.body());

  labelCells(c);
  if (EXP_OPEN) c.insertAdjacentHTML('beforeend', expHtml());
  window.scrollTo(0, 0);
}

function enterApp(user, pass){
  if (user && pass){
    FB.signIn(user, pass).then(function(r){
      if (r.ok){
        ROLE = ROLES[r.role] ? r.role : 'tech';
        var first = CORE.legacyDone() ? Promise.resolve(0) : CORE.pullLegacy();
        first.then(function(n){
          if (n) toast(nm(n) + ' ' + t('سجلًّا من النسخة السابقة'));
          return pullDelta();
        }).then(function(){ statBump(); render(1); liveWatch(); });
      }
      enterShell();
    });
    return;
  }
  enterShell();
}

  var tkr = e.target.closest('[data-tkrm]');
  if (tkr){ CORE.rm('tasks', tkr.getAttribute('data-tkrm')); statBump();
            toast(t('أُلغيت')); render(1); return; }

  var sa = e.target.closest('[data-sat]');
  if (sa){ mapSat(!MAP_SAT); render(1); if (MAP) mapPaint(); return; }
  var mf = e.target.closest('[data-mfilt]');
  if (mf){ MAP_FILT_OPEN = mf.getAttribute('data-mfilt') === '1'; render(1); return; }
  if (e.target.closest('[data-mclear]')){
    FILT = { zone:'', type:'', work:'' }; MAP_FILT_OPEN = false;
    render(1); if (MAP) mapPaint(); return;
  }

  var co = e.target.closest('[data-co]');
  if (co){ CO_OPEN = co.getAttribute('data-co') === '1'; render(); return; }
  var cg = e.target.closest('[data-cogo]');
  if (cg){
    if (cg.getAttribute('data-cogo') === '1'){
      CO_SEL = Array.prototype.filter.call(document.querySelectorAll('.coRow'), function(r){
        return r.querySelector('.coCk').checked;
      }).map(function(r){ return r.getAttribute('data-c'); });
    } else { CO_SEL = []; }
    CO_OPEN = false; render(); return;
  }
  var ex = e.target.closest('[data-exp]');
  if (ex){ EXP_OPEN = ex.getAttribute('data-exp') === '1'; render(); return; }
  var ea = e.target.closest('[data-expall]');
  if (ea){
    var on = ea.getAttribute('data-expall') === '1';
    Array.prototype.forEach.call(document.querySelectorAll('.expCk'), function(c){ c.checked = on; });
    return;
  }
});

/* الحقلُ في خليةٍ وسمُه عنوانُ عموده وصفُّه — يُنسَب إليهما فيقرؤه القارئُ الصوتي */
function labelCells(root){
  var tbs = root.querySelectorAll('.data-table');
  for (var i = 0; i < tbs.length; i++){
    var heads = tbs[i].querySelectorAll('thead th');
    var rows  = tbs[i].querySelectorAll('tbody tr');
    for (var r = 0; r < rows.length; r++){
      var cells = rows[r].children;
      var first = (cells[0] && cells[0].textContent.trim().split('\n')[0]) || '';
      for (var cI = 0; cI < cells.length; cI++){
        var col = (heads[cI] && heads[cI].textContent.trim()) || '';
        var fs = cells[cI].querySelectorAll('input,select,textarea');
        for (var f = 0; f < fs.length; f++){
          if (fs[f].getAttribute('aria-label')) continue;
          fs[f].setAttribute('aria-label',
            (col ? col + (first ? ' — ' + first.slice(0, 40) : '') : first) || 'حقل');
        }
      }
    }
  }
}

function toast(label){
  var old = document.getElementById('nskToast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.id = 'nskToast';
  el.setAttribute('role','status');
  el.textContent = label + ' — ' + t('في المعاينة: لا فعل حقيقي');
  el.style.cssText = 'position:fixed;inset-block-end:20px;inset-inline:0;margin-inline:auto;'
    + 'width:max-content;max-width:88vw;background:var(--sidebar);color:var(--sidebar-ink);'
    + 'padding:11px 18px;border-radius:99px;font-size:13px;z-index:200;'
    + 'box-shadow:0 8px 28px rgba(0,0,0,.45);text-align:center';
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 2200);
}

document.addEventListener('change', function(e){
  var t0 = e.target;
  if (t0 && t0.id === 'asnTo'){ ASN_TO = t0.value; render(1); return; }
  if (t0 && t0.hasAttribute && t0.hasAttribute('data-ns')){
    NEWSITE[t0.getAttribute('data-ns')] = t0.value;
    return;
  }
  if (t0 && t0.hasAttribute && t0.hasAttribute('data-share')){
    var tm = teamOf(TEAM_CUR), m = tm.members[+t0.getAttribute('data-share')];
    if (m){ m.share = cfgN(t0.value); CORE.dirty('teams', tm.id, tm); render(1); }
    return;
  }
  if (t0 && t0.hasAttribute && t0.hasAttribute('data-mrole')){
    var tm2 = teamOf(TEAM_CUR), m2 = tm2.members[+t0.getAttribute('data-mrole')];
    if (m2){ m2.role = t0.value; CORE.dirty('teams', tm2.id, tm2); render(1); }
    return;
  }
  var el = e.target;
  if (el && el.hasAttribute){
    if (el.hasAttribute('data-photo')){
      var file = el.files && el.files[0];
      if (!file) return;
      toast(t('تُضغط الصورة…'));
      shrink(file, 1280, 0.72).then(function(p){
        if (!p){ toast(t('تعذّرت قراءة الصورة')); return; }
        FORM.photos[el.getAttribute('data-photo')] = p;
        render();
      });
      return;
    }
    if (el.hasAttribute('data-form')){ FORM[el.getAttribute('data-form')] = el.value; return; }
    if (el.hasAttribute('data-part')){ FORM.parts[el.getAttribute('data-part')] = el.value; render(); return; }
    if (el.hasAttribute('data-serial')){ FORM.serials[el.getAttribute('data-serial')] = el.value; return; }
  }
  var f = e.target;
  if (!f || !f.hasAttribute || !f.hasAttribute('data-imp')) return;
  var file = f.files && f.files[0];
  if (!file) return;
  toast('يُقرَأ الملف…');
  impRead(f.getAttribute('data-imp'), file).then(function(p){
    if (!p){ toast('تعذّرت قراءة الملف'); return; }
    render();
  });
});

document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'navQ'){
    NAV_Q = e.target.value;
    var nv = document.getElementById('nav');
    if (nv){
      nv.innerHTML = navHtml();
      var q = document.getElementById('navQ');
      if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    return;
  }
  var el = e.target;
  if (!el || !el.hasAttribute || !el.hasAttribute('data-cfg')) return;
  cfgSet(el.getAttribute('data-cfg'), el.getAttribute('data-cfgk'), el.value);
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.hasAttribute || !el.hasAttribute('data-cfg')) return;
  cfgSet(el.getAttribute('data-cfg'), el.getAttribute('data-cfgk'), el.value);
  var path = el.getAttribute('data-cfg'), key = el.getAttribute('data-cfgk');
  render();                                   /* ينتشر الأثر في كل ما بُني فوقه */
  var back = document.querySelector('[data-cfg="' + path + '"]'
    + (key ? '[data-cfgk="' + CSS.escape(key) + '"]' : ':not([data-cfgk])'));
  if (back){ back.focus(); try{ back.select(); }catch(err){} }
});

/* مزامنةٌ دوريةٌ فارقية — كلُّ دقيقتين، ولا تعمل والتطبيق مخفيّ */
setInterval(function(){
  if (typeof document !== 'undefined' && document.hidden) return;
  if (!STATE.meta.online) return;
  CORE.flush();
  pullDelta().then(function(n){ if (n) render(1); });
}, 120000);

/* الهروبُ يغلق ما هو مفتوح، الأحدثَ فالأقدم */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (POP_OPEN){ POP_OPEN = false; render(1); return; }
  if (ASN_OPEN){ ASN_OPEN = false; render(1); return; }
  if (MAP_FILT_OPEN){ MAP_FILT_OPEN = false; render(1); return; }
  if (CO_OPEN){ CO_OPEN = false; render(1); return; }
  if (EXP_OPEN){ EXP_OPEN = false; render(1); return; }
  if (document.body.classList.contains('nav-open')){ document.body.classList.remove('nav-open'); return; }
});

/* سحبةٌ أفقيةٌ على القائمة تغلقها — كما تُغلَق الأدراج */
(function(){
  var x0 = 0, y0 = 0, on = false;
  var sb = document.querySelector('.sidebar');
  if (!sb) return;
  sb.addEventListener('touchstart', function(e){
    if (!document.body.classList.contains('nav-open')) return;
    var t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; on = true;
  }, { passive:true });
  sb.addEventListener('touchend', function(e){
    if (!on) return;
    on = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    var rtl = document.documentElement.dir === 'rtl';
    /* في العربية القائمةُ يمينًا فتُغلَق بسحبٍ يمينًا، وفي الإنجليزية العكس */
    if ((rtl && dx > 0) || (!rtl && dx < 0)) document.body.classList.remove('nav-open');
  }, { passive:true });
})();

window.addEventListener('resize', function(){ if (CUR === 'map') mapDraw(); }, { passive:true });

(function boot(){
  var th = 'light', lg = 'ar';
  try{ th = localStorage.getItem('nsk14.theme') || 'light'; lg = localStorage.getItem('nsk14.lang') || 'ar'; }catch(e){}
  setTheme(th);
  LANG = I18N[lg] ? lg : 'ar';
  document.documentElement.lang = LANG;
  document.documentElement.dir  = I18N[LANG].dir;
  document.body.setAttribute('data-lang', LANG);

  document.getElementById('langSel').value  = LANG;
  document.getElementById('langSel').onchange = function(){ setLang(this.value); };
  /* الشريطُ العلوي: لغةٌ تدور على الثلاث، ومظهرٌ يقلب — من أي صفحةٍ بلا فتح القائمة */
  var lt = document.getElementById('langTop');
  if (lt) lt.onclick = function(){
    var order = ['ar','en','ur'], i = order.indexOf(LANG);
    setLang(order[(i + 1) % 3]);
    var sel = document.getElementById('langSel');
    if (sel) sel.value = LANG;
    render(1);
  };
  var tt = document.getElementById('themeTop');
  if (tt) tt.onclick = function(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    render(1);
  };

  document.getElementById('themeBtn').onclick = function(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
  loadSites();
  manifestInject();
  loginPaint();
  watchNet();
  pwaWatch();
  swInstall();
  posWatch();
  CORE.loadLocal().then(function(){
    if (!document.getElementById('login')) render();   /* إن كان دخل بالفعل */
    syncBadge();
  }).catch(function(){});
})();

(function(){var s=document.createElement('style');s.textContent=LOGIN_CSS;document.head.appendChild(s);})();

</script>

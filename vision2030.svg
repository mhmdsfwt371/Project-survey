<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" role="img"
     aria-label="رؤية السعودية 2030">
  <!-- علامةٌ نصيةٌ مؤقتة. الشعارُ الرسميُّ لرؤية السعودية ٢٠٣٠ علامةٌ مسجَّلةٌ
       لها دليلُ هويةٍ ومصدرٌ رسميّ — يُنزَّل منه ويُستبدَل بهذا الملف باسمه
       نفسِه. وهذه العلامةُ تُبقي الموضعَ والمقاسَ حتى يوضَع الأصل. -->
  <text x="150" y="40" text-anchor="middle" font-family="system-ui,Segoe UI,Tahoma,sans-serif"
        font-size="27" font-weight="700" fill="currentColor" opacity=".92">رؤية السعودية</text>
  <text x="150" y="76" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif"
        font-size="31" font-weight="800" letter-spacing="4" fill="currentColor" opacity=".92">2030</text>
</svg>
